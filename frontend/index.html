<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<title>Finance Book</title>
<style>
  /* Blurple on blue-grey, with zero radius, hairline rules, mono figures and
     uppercase labels.

     The light blurple is the signal. Positive amounts take it and negative ones
     stay plain ink. Saturated fill is used sparingly. */
  :root {
    color-scheme: dark;
    --bg: #161826;          /* ground */
    --panel: #232532;       /* surface */
    /* Nothing in the chrome is a true grey. A neutral grey next to the
       purple accent reads as dirt, so every line and fill carries the same
       violet hue the accent does, just desaturated. */
    --line: #413d55;        /* border */
    --line-soft: #2b2740;   /* quiet fill: code, progress track */
    --rule: #37334f;        /* table row rule, a touch brighter than the fill */
    --hover: #322d4b;       /* row and sidebar hover */
    --ink: #eae8f2;         /* the same violet hue, just at the top of the ramp */
    --ink-dim: #b2b6ca;
    --ink-faint: #9397ab;
    --in: #b5abfc;          /* light blurple: money in, positive */
    --out: #eae8f2;         /* money out stays plain ink */
    --move: #9397ab;        /* transfers stay desaturated */
    --gain: #57d68d;        /* income, in the transaction tables */
    --loss: #f2727d;        /* spending, in the transaction tables */
    /* Text on an accent fill is --bg, at 5.4:1. Near-white reads at only 3:1. */
    --accent: #9184d9;      /* blurple: current item, primary action */
    --accent-dim: #423a6a;
    --gap: 14px;           /* one spacing step, horizontal and vertical */
    --display: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
    --sans: "IBM Plex Sans", ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  /* The browser's own tick box is a neutral grey when unticked, so every tick
     in the app is drawn here instead. */
  input[type="checkbox"] {
    appearance: none; display: grid; place-content: center; flex: none;
    width: 14px; height: 14px; margin: 0; cursor: pointer;
    border: 1px solid var(--ink-faint); background: var(--bg);
  }
  input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }
  /* The tick: the left and bottom borders of a small box, turned 45 degrees. */
  input[type="checkbox"]:checked::before {
    content: ""; width: 7px; height: 3px; margin-top: -2px; color: var(--bg);
    border: solid; border-width: 0 0 2px 2px; transform: rotate(-45deg);
  }
  /* Other browser defaults that would draw in pure grey, white or blue. */
  :root { scrollbar-color: var(--line) transparent; }
  ::placeholder { color: var(--ink-faint); }
  ::selection { background: var(--accent-dim); color: var(--ink); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* Chrome draws the date picker's calendar in pure white. The same shape cut
     out of a token colour replaces it. */
  ::-webkit-calendar-picker-indicator {
    cursor: pointer; background: var(--ink-dim);
    mask: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='black' stroke-width='1.5'><rect x='2' y='3' width='12' height='11'/><path d='M2 7h12M5 1v4M11 1v4'/></svg>") center / 14px no-repeat;
  }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.55 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  h1, h2 { font-family: var(--display); font-weight: 700; letter-spacing: -0.035em; }
  /* Every figure and timestamp is mono, so columns lock. */
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .in { color: var(--in); } .out { color: var(--out); } .move { color: var(--move); }

  /* ---------- shell ---------- */
  .caption { font-family: var(--mono); font-size: 11px; color: var(--ink-faint);
             text-transform: uppercase; letter-spacing: .08em; }

  .layout { display: grid; grid-template-columns: 236px minmax(0, 1fr); align-items: start; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }

  /* ---------- sidebar ---------- */
  /* Fills the window below the chat bar, so the dividing rule reaches the
     bottom rather than stopping under the last item. Scrolls on its own if the
     account list ever outgrows the screen. */
  nav {
    padding: 18px 12px; border-right: 1px solid var(--line);
    position: sticky; top: var(--bar); height: calc(100vh - var(--bar));
    overflow-y: auto; box-sizing: border-box;
    /* Column flex so the export stamp can sit on the bottom edge. As a page
       footer it spanned the full width and pushed the document taller than the
       window, which is what made the whole page scroll. */
    display: flex; flex-direction: column;
  }
  @media (max-width: 860px) { nav { position: static; height: auto; border-right: 0;
                                  border-bottom: 1px solid var(--line); } }
  nav .group { margin-bottom: 14px; flex: none; }
  nav .group > .caption { padding: 0 10px 6px; }
  nav button {
    display: flex; width: 100%; gap: 8px; align-items: baseline; text-align: left;
    background: none; border: 0; padding: 6px 10px; cursor: pointer;
    color: var(--ink-dim); font: inherit; font-size: 13px;
  }
  nav button:hover { background: var(--hover); color: var(--ink); }
  /* The accent fill marks the current item. */
  nav button[aria-current="true"] { background: var(--accent); color: var(--bg); }
  nav button[aria-current="true"] .name { font-weight: 500; }
  /* Dimmed, the balance drops under 4.5:1 on the fill. */
  nav button[aria-current="true"] .bal { opacity: 1; }
  nav button .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  nav button .bal { font-size: 12px; opacity: .75; }

  /* ---------- main ---------- */
  main { padding: 20px 24px 32px; min-width: 0; }
  .title { display: flex; align-items: baseline; gap: 10px; margin-bottom: var(--gap); }
  .title h2 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
  .title .sub { color: var(--ink-dim); font-size: 13px; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
           gap: var(--gap); margin: var(--gap) 0; }
  /* Surface block with a 2px rule down the left: the accent on the first card,
     dim on the rest. */
  .card { background: var(--panel); border-left: 2px solid var(--accent-dim); padding: 13px 16px; }
  .cards .card:first-child { border-left-color: var(--accent); }
  .card .v { font-family: var(--mono); font-size: 20px; font-weight: 400;
             margin-top: 6px; letter-spacing: -0.01em; }
  .card .note { font-family: var(--mono); }
  .card .note { font-size: 11px; color: var(--ink-faint); margin-top: 2px; }
  /* The Net cards are the one place a card goes green or red. A surplus or a
     loss is a verdict, and blurple-or-ink only says which sign it has. Zero
     stays desaturated, like a transfer: neither. */
  .card .v.gain { color: var(--gain); }
  .card .v.loss { color: var(--loss); }
  .card .v.even { color: var(--move); }

  .panel { background: var(--panel); border: 1px solid var(--line); padding: 14px 16px;
           margin-bottom: var(--gap); min-width: 0; }
  .panel > h3 { margin: 0 0 2px; font-size: 13px; font-weight: 600; }
  .panel > p  { margin: 0 0 12px; font-size: 12px; color: var(--ink-faint); }
  /* The grid's gap is the space between its panels and its margin the space
     below, so the panels' own margins would only double it. */
  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap);
            margin-bottom: var(--gap); }
  .charts > * { min-width: 0; margin-bottom: 0; }
  /* A long category list makes one chart far taller than the other, which
     would otherwise stretch around empty space to match. */
  #analysis .charts { align-items: start; }
  @media (max-width: 1040px) { .charts { grid-template-columns: 1fr; } }
  .chartbox { position: relative; height: 240px; min-width: 0; }
  .chartbox canvas { display: block; max-width: 100%; }

  .years { display: flex; gap: 6px; flex-wrap: wrap; margin: var(--gap) 0; }
  /* 32px tall, like the sidebar items and every other toggle. */
  .years button {
    border: 1px solid var(--line); background: transparent; color: var(--ink-dim);
    height: 32px; padding: 0 12px; font: inherit; font-family: var(--mono); font-size: 12px; cursor: pointer;
  }
  .years button:hover { color: var(--ink); border-color: var(--ink-faint); }
  .years button[aria-current="true"] { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  /* From and To wear the analysis page's date input box: the `.picker label`
     rule below covers both. Only the height differs, to line them up with the
     year buttons beside them. */
  .years label { height: 32px; }

  /* ---------- table ---------- */
  .tablewrap { background: var(--panel); border: 1px solid var(--line); }
  /* Below this, Date, Type, Amount and Balance alone need more than the screen
     has, so let the table scroll inside its own box rather than pushing the
     whole page sideways. Only here: making this a scroll container at any
     width would stop the column headers sticking to the top of the page. */
  @media (max-width: 600px) {
    .tablewrap { overflow-x: auto; }
    /* Shared out across a phone screen, the one flexible column (Description,
       Name, Pattern) got no width at all. Keep a usable width and scroll. */
    .tablewrap table { min-width: 44rem; }
  }
  table { width: 100%; border-collapse: collapse; }
  /* A header strip above the table rather than a <caption>: a caption with
     display:flex is laid out outside its own box, leaving an empty band and
     printing its text over the sticky column headers. */
  .tcap {
    display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap;
    padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .tcap .grp { font-family: var(--display); font-weight: 500; font-size: 14px;
               letter-spacing: -0.02em; }
  /* Sits right after the account name. Quiet until you hover it, because every
     table has one and nine of them shouting would be noise. */
  .findbtn {
    display: inline-flex; align-items: center; padding: 2px; margin: -2px 0;
    background: none; border: 0; border-radius: 0; cursor: pointer;
    color: var(--ink-faint); line-height: 0;
  }
  .findbtn:hover { color: var(--ink); }
  /* On All accounts the chevron and the account name are one button, so the
     whole name opens the table, not a 12px arrow. */
  .fold {
    display: inline-flex; align-items: center; gap: 7px; padding: 0;
    background: none; border: 0; border-radius: 0; cursor: pointer;
    color: inherit; font: inherit;
  }
  .fold svg { flex: none; color: var(--ink-faint); transition: transform .15s; }
  .fold:hover svg { color: var(--ink); }
  .fold[aria-expanded="true"] svg { transform: rotate(90deg); }
  /* The strip's own rule would double the box's border on a collapsed table. */
  .tablewrap:has(> table[hidden]) .tcap { border-bottom: 0; }
  /* No taller than the account name beside it, so opening the search does not
     make the strip grow. */
  .tcap .find {
    flex: 1 1 12rem; min-width: 0; max-width: 22rem;
    padding: 0 8px; font: inherit; font-size: 13px; line-height: 18px;
    color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 0;
  }
  .tcap .find:focus { outline: none; border-color: var(--accent); }
  /* Chrome's clear button is pure white. This is the same cross in a token. */
  .tcap .find::-webkit-search-cancel-button {
    appearance: none; width: 10px; height: 10px; margin-left: 6px; cursor: pointer;
    background: var(--ink-dim);
    mask: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10' stroke='black' stroke-width='1.6'><path d='M1 1l8 8M9 1L1 9'/></svg>");
  }
  .ink-faint { color: var(--ink-faint); }
  .tcap .meta { font-family: var(--mono); font-size: 12px; color: var(--ink-faint);
                margin-left: auto; }
  th {
    text-align: left; font-family: var(--mono); font-size: 11px;
    text-transform: uppercase; letter-spacing: .08em;
    color: var(--ink-faint); font-weight: 400; padding: 5px 10px;
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; background: var(--panel);
  }
  /* Column headers stick below the chat bar, and in the drill-down below its
     57px header: the 30px close button, 13px padding above and below, and a
     1px rule. Not at 600px and under, where the table scrolls in its own box
     and an offset would push the header down over the first row. */
  @media (width > 600px) {
    th { top: var(--bar); }
    #drill th { top: 57px; }
  }
  td { padding: 4px 10px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
  /* One transaction, one row. Date, Type, Amount and Balance each settle at the
     width their own content needs — no narrower, so they never truncate — and
     the description takes every pixel that is left.
     Auto layout, not fixed. Fixed layout only divides leftover width evenly
     across the columns, so on a wide window Date was as wide as Description.
     The description cell carries `max-width: 0`, so it asks for nothing while
     the browser measures the other columns, then `width: 100%` claims all the
     slack. Being the only constrained column, it is also the only one that
     truncates; hovering shows the full text. */
  table.rows { table-layout: auto; width: 100%; }
  table.rows td, table.rows th { white-space: nowrap; }
  table.rows td.desc, table.rows th.desc {
    width: 100%; max-width: 0; overflow: hidden; text-overflow: ellipsis;
  }
  /* The type tag always shows; a long category name truncates rather than
     spilling into the Amount column. */
  table.rows td.tags .tag { max-width: 7.5rem; overflow: hidden; text-overflow: ellipsis;
                            vertical-align: bottom; }
  /* A what-if row carries a third tag. Its category gives way, so the Type
     column stays the width it has on every other row. */
  tr.whatif td.tags .tag.cat { max-width: 5rem; }
  /* The same on the rules page, capped at its fixed-width category column. */
  #rules td .tag { max-width: 100%; overflow: hidden; text-overflow: ellipsis;
                   vertical-align: bottom; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: var(--hover); }
  td.r, th.r { text-align: right; }
  td.date { white-space: nowrap; color: var(--ink-faint); font-size: 13px; }

  td.amt { white-space: nowrap; font-weight: 500; }
  td.bal { white-space: nowrap; color: var(--ink-faint); font-size: 13px; }
  code {
    font: 12px/1.5 var(--mono);
    background: var(--line-soft); border: 1px solid var(--line);
    border-radius: 0; padding: 1px 5px;
    /* A regex has no spaces to break at, so allow a break anywhere. Without
       this the cell cannot shrink and the other columns get squeezed away. */
    overflow-wrap: anywhere;
  }
  /* Spaces at the end of a pattern change what it matches but draw as nothing,
     so they get a fill. */
  code .trail { white-space: pre; background: var(--accent-dim); }
  /* Fixed layout keeps the narrow columns readable no matter how long the
     pattern is. Widths come from the colgroup on each table. */
  table.fixed { table-layout: fixed; }
  table.fixed td { vertical-align: middle; }
  /* Solid fill. The badge colour arrives as --tag rather than as `color`,
     because `background: currentColor` and a readable label cannot both come
     from the same property. */
  .tag {
    display: inline-block; font-family: var(--mono); font-size: 10px;
    text-transform: uppercase; letter-spacing: .06em; white-space: nowrap;
    padding: 1px 6px; background: var(--tag, var(--ink-faint)); color: var(--bg);
  }
  .tag.in { --tag: var(--in); }
  .tag.out { --tag: var(--out); }
  .tag.move { --tag: var(--move); }
  /* In the transaction tables money reads the way a bank statement does:
     income green, spending red, transfers left grey because they are neither.
     The amount, the type badge and the in/out figures in the header strip all
     agree. The rest of the app keeps its purple, except the Net cards, which
     take the same green and red. */
  table.rows td.amt.in, .tcap .meta .in { color: var(--gain); }
  table.rows td.amt.out, .tcap .meta .out { color: var(--loss); }
  table.rows .tag.in { --tag: var(--gain); }
  table.rows .tag.out { --tag: var(--loss); }
  /* A provisional row is one the bank has not finalised. Dimming it says so
     without spending a column on the word. The reason is in the title. */
  tr.provisional td.desc, tr.provisional td.date { color: var(--ink-faint); font-style: italic; }
  /* A what-if is a plan you typed in, not a bank row. It wears the accent: the
     tag is filled with it and the description is written in it. */
  /* No truncation: "what-if · covered" is the whole warning. */
  .tag.whatif { --tag: var(--accent); max-width: none; }
  tr.whatif td.desc { color: var(--accent); }

  /* ---------- editing rows ---------- */
  /* An editor stands in for one cell, or for one tag, and keeps the row's
     height: 22px sits inside the line the text took, so nothing around it moves. */
  .editor, tr.add input, tr.add select {
    height: 22px; padding: 0 5px; font: inherit; font-size: 13px; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 0;
    vertical-align: middle;
  }
  .editor:focus, tr.add input:focus, tr.add select:focus { outline: none; border-color: var(--accent); }
  td.desc .editor, td.desc input { width: 100%; }
  td.amt .editor, tr.add [name="amount"] { width: 5.5rem; text-align: right; }
  tr.add [name="category"] { width: 7rem; }
  /* Dimmed while the server has it. The reload draws the row afresh. */
  td[aria-busy="true"], tr[aria-busy="true"] td { opacity: .5; }
  /* The add row is the table's foot, which a search leaves alone: it redraws
     the body only. At rest it is one faint "+ add". */
  tfoot td { border-top: 1px solid var(--rule); border-bottom: 0; }
  tr.add .addbtn { padding: 0; color: var(--ink-faint); }
  tr.add .addbtn:hover { background: none; color: var(--ink); }
  /* Open, the add row is one cell across the table holding a form that
     wraps: one line at 1440, two below that. Spread over the five columns it
     squeezed Description to 27px at 1024, since every other column was
     widened by its control and Description alone gave way. */
  tr.add td { white-space: normal; }
  tr.add .addform { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
  tr.add .addform [name="description"] { flex: 1 1 14rem; }
  tr.add .addform label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer;
                          white-space: nowrap; font-size: 13px; height: 22px; }
  .empty { padding: 28px 10px; text-align: center; color: var(--ink-faint); }
  .controls { display: flex; gap: var(--gap); flex-wrap: wrap; align-items: flex-start;
              margin-bottom: var(--gap); }
  .controls > div { min-width: 0; }
  .picker { display: flex; flex-wrap: wrap; gap: 6px; }
  .picker label, .years label {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none;
    border: 1px solid var(--line); background: transparent;
    padding: 5px 12px 5px 9px; font-size: 13px; color: var(--ink-dim);
  }
  .picker label:has(input:checked) { border-color: var(--accent); color: var(--ink); }
  .swatch { width: 9px; height: 9px; border-radius: 0; display: inline-block; flex: none; }
  tbody tr.pick { cursor: pointer; }
  /* The name is the part you click to drill in, so only it gets the underline —
     the tick box beside it does something else. */
  tbody tr.pick:hover td:nth-child(2) { text-decoration: underline; text-underline-offset: 3px; }
  td.tick, th.tick { width: 2.2rem; padding-right: 0; }
  /* A category left out of the totals. Still listed, still clickable, just not
     counted — dimmed rather than hidden so you can put it back. */
  tr.off td { opacity: .6; }
  tr.off td.tick { opacity: 1; }

  /* 32px tall, level with the account toggles beside the period chips. */
  .chip {
    font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    height: 32px; padding: 0 9px; cursor: pointer; border-radius: 0;
    border: 1px solid var(--line); background: transparent; color: var(--ink-dim);
  }
  .chip:hover { color: var(--ink); border-color: var(--ink-faint); }
  .chip[aria-current="true"] { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  /* The category drill-down covers the window below the chat bar. The page
     underneath stays rendered, so closing is instant and the scroll position
     survives. */
  #drill {
    position: fixed; inset: var(--bar) 0 0; z-index: 50; background: var(--bg);
    overflow-y: auto; overscroll-behavior: contain;
  }
  .drill-head {
    position: sticky; top: 0; z-index: 1; background: var(--panel);
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px; padding: 13px 24px;
  }
  .drill-head h2 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.02em;
                   display: flex; align-items: center; gap: 9px; }
  .drill-head .sub { color: var(--ink-dim); font-size: 13px; }
  .drill-close {
    margin-left: auto; flex: none; width: 30px; height: 30px; border-radius: 0;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink-dim);
    font: inherit; font-size: 17px; line-height: 1; cursor: pointer;
  }
  .drill-close:hover { background: var(--hover); color: var(--ink); }
  .drill-body { padding: 20px 24px 64px; }
  body.locked { overflow: hidden; }
  /* A span in a table cell, so it needs display: block to take a height. */
  .bar { display: block; height: 6px; background: var(--line-soft); overflow: hidden; }
  .bar > i { display: block; height: 100%; }
  .hint { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--move);
          border-radius: 0; padding: 12px 16px; margin-bottom: var(--gap); font-size: 13px; }
  .hint b { font-variant-numeric: tabular-nums; }
  form.holding { display: grid; grid-template-columns: 2fr 1.4fr 1fr 1fr auto; gap: 8px; align-items: end; }
  @media (max-width: 900px) { form.holding { grid-template-columns: 1fr 1fr; } }
  form.holding label { display: block; font-size: 11px; color: var(--ink-faint);
    text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
  /* Fields and buttons in a form row share one height. Left alone, a date
     field and a button each come out a pixel or two off a text field. */
  form.holding input {
    width: 100%; height: 38px; padding: 7px 9px; font: inherit; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 0;
  }
  form.holding input:focus { outline: 2px solid var(--move); outline-offset: -1px; }
  .btn { height: 38px; padding: 0 16px; font: inherit; font-family: var(--mono); font-size: 12px;
         text-transform: uppercase; letter-spacing: .06em; cursor: pointer;
         border: 1px solid var(--accent); background: var(--accent); color: var(--bg); }
  .btn.ghost { background: none; color: var(--ink-dim); border-color: var(--line); }
  .btn.ghost:hover { color: var(--ink); border-color: var(--ink-faint); }
  /* Buttons are only disabled while their request runs. */
  .btn:disabled { opacity: .5; cursor: progress; }
  .rowbtn { background: none; border: 0; color: var(--ink-faint); cursor: pointer;
            font: inherit; font-size: 12px; padding: 2px 6px; border-radius: 0; }
  .rowbtn:hover { background: var(--hover); color: var(--ink); }
  /* × on a row entered by hand, in space every date cell reserves, so dates
     line up whether a row has one or not. Faded out until the row is hovered
     or the × itself is focused, so the ledger does not fill with buttons.
     Opacity, not visibility: a hidden button cannot take the focus, so Tab
     could never reach it. After .rowbtn on purpose: it takes the padding and
     line height from it. */
  table.rows td.date, table.rows th.date { padding-left: 24px; }
  table.rows td.date { position: relative; }
  .del { position: absolute; left: 6px; top: 50%; transform: translateY(-50%);
         opacity: 0; padding: 0 4px; margin: 0; line-height: 1; }
  tr:hover .del, .del:focus-visible { opacity: 1; }
  /* margin-top:auto pins this to the bottom when the account list is short,
     and lets it scroll away with the list when it is long. */
  nav .foot {
    margin-top: auto; padding: 12px 10px 2px; border-top: 1px solid var(--line);
    color: var(--ink-faint); font-size: 11px; line-height: 1.5;
  }
  nav .foot div + div { margin-top: 2px; }
  /* The hide/show toggle after the what-if count: a word in the line, not a
     sidebar item, so it sheds the item styling every other nav button gets. */
  nav .whatif-toggle { display: inline; width: auto; padding: 0; font: inherit;
                       color: var(--ink-dim); text-decoration: underline; text-underline-offset: 2px; }
  nav .whatif-toggle:hover { background: none; color: var(--ink); }

  /* ---------- the agent ---------- */
  /* Fixed to the top on every view and every width, so you can always just
     type. It keeps a one-line slot in the layout; the answers open downwards
     over the page rather than pushing it, and clicking the page puts them away.
     --bar is that one-line height, and the layout below is offset by it. It
     stacks above the drill-down overlay too, so it works there as well. */
  :root {
    --bar: 38px;
    /* The one place in the app that is not the purple palette. It marks the
       surface where you are talking to a model rather than reading your own
       books, and it only appears while that surface has your attention. */
    --spectrum: linear-gradient(90deg, #b5abfc, #7cc7fb, #5eead4,
                                #fbbf24, #f472b6, #a78bfa, #b5abfc);
  }
  #agent {
    position: fixed; inset: 0 0 auto 0; z-index: 60;
    background: var(--bg); border-bottom: 1px solid var(--line);
    display: flex; flex-direction: column; max-height: 100vh;
    /* The whole chat is monospace, like the terminal its markdown copies.
       13px, a pixel under the page's text, because mono glyphs run wider and
       taller and would otherwise look a size up. Everything inside inherits. */
    font: 13px/1.55 var(--mono);
  }
  /* Buttons and text fields do not inherit fonts by default, so they have to be
     told — including Apply and Dismiss on a proposed change. */
  #agent button, #agent textarea { font-family: var(--mono); }
  body { padding-top: var(--bar); }

  /* Two layers of the same gradient: a hairline on the edge, and a blurred
     copy below it doing the glowing. Both absolutely positioned, so neither
     becomes a flex item of the bar. */
  #agent::before, #agent::after {
    content: ""; position: absolute; left: 0; right: 0; pointer-events: none;
    background: var(--spectrum); background-size: 200% 100%;
    opacity: 0; transition: opacity .3s ease;
  }
  /* Exactly over the 1px border, not on top of it: bottom:-1px puts this in the
     border's own band (a containing block is its padding box), so the edge is
     the same weight focused or not, just a different colour. */
  #agent::after  { bottom: -1px; height: 1px; }
  /* Hung off the bottom edge (top:100%) and clipped flat along its own top, so
     the blur can only spread downwards. Left to itself a 10px blur reaches just
     as far upwards, and washes over the text you are typing. The three negative
     insets leave the other sides free to stay soft. */
  #agent::before {
    top: 100%; height: 10px; filter: blur(12px);
    clip-path: inset(0 -40px -40px -40px);
  }
  #agent:focus-within::after  { opacity: 1; }
  #agent:focus-within::before { opacity: .55; }
  @media (prefers-reduced-motion: no-preference) {
    #agent:focus-within::before, #agent:focus-within::after {
      animation: spectrum-drift 9s linear infinite;
    }
  }
  @keyframes spectrum-drift { to { background-position: -200% 0; } }


  /* Answers sit above the input, so the thing you are reading does not jump
     when the box grows under it. */
  #agentLog {
    overflow-y: auto; padding: 0 12px; display: none;
    border-bottom: 1px solid var(--line-soft);
    /* A scroll that reaches the end of the log stops there, rather than
       running on into the page behind. */
    overscroll-behavior: contain;
  }
  /* Half the screen at most: the log opens over the page, and the page is what
     you are asking about. */
  #agent.open #agentLog { display: block; padding: 12px; max-height: 50vh; }
  /* Full screen: the same chat given the whole window, conversation above and
     the input along the bottom. It comes after the 50vh cap on purpose, so it
     wins at equal specificity. */
  #agent.full { inset: 0; max-height: none; }
  #agent.full #agentLog { flex: 1; min-height: 0; max-height: none; }

  /* Floats over the top right of the conversation, where the spinner used to
     be, so text runs underneath instead of wrapping round it. Only shown while
     there is a conversation to make bigger. */
  #agentFull {
    position: absolute; top: 8px; right: 12px; z-index: 2; display: none;
    width: 24px; height: 24px; padding: 0; align-items: center; justify-content: center;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink-dim);
    border-radius: 0; cursor: pointer;
  }
  #agentFull:hover { color: var(--ink); border-color: var(--ink-faint); }
  #agent.open #agentFull { display: flex; }
  #agentFull .shrink, #agent.full #agentFull .grow { display: none; }
  #agent.full #agentFull .shrink { display: block; }
  #agentForm { display: flex; gap: 10px; align-items: flex-end; padding: 0 12px;
               min-height: var(--bar); }
  #agentInput {
    flex: 1; min-width: 0; resize: none; overflow-y: auto;
    max-height: 40vh; padding: calc((var(--bar) - 1.45em) / 2) 0;
    border: 0; background: none; overscroll-behavior: contain;
    color: var(--ink); font: inherit; line-height: 1.45;
    caret-color: var(--in);
  }
  #agentInput:focus { outline: none; }
  #agent:focus-within #agentInput::placeholder { color: var(--ink-dim); }
  /* The right-hand controls: a cluster exactly one row tall, riding the bottom
     of the form. The input pads its text into the middle of that same row, so
     whatever is centred here sits level with the last line of text, and stays
     level as the box grows. There are no per-button margins to keep in step —
     those had Send 2px from the top of the row and 6px from the bottom. */
  :root { --control: 22px; }
  .agent-controls { flex: none; display: flex; align-items: center; gap: 6px;
                    height: var(--bar); }
  /* Scoped to the whole chat and carrying an ID, on purpose. The buttons set
     display through #agentSend and #agentStop, and an ID selector outranks a
     plain [hidden] rule. So for a while Stop stayed on screen with nothing
     running, and Send showed on an empty box, with hidden set on both. */
  #agent [hidden] { display: none; }
  #agentSpin { font: 14px/1 var(--mono); color: var(--ink-dim); width: 1.2ch;
               text-align: center; }
  #agentSpin::after { content: "⠋"; animation: braille .9s steps(1) infinite; }
  @keyframes braille {
    0%  { content: "⠋" }  10% { content: "⠙" }  20% { content: "⠹" }
    30% { content: "⠸" }  40% { content: "⠼" }  50% { content: "⠴" }
    60% { content: "⠦" }  70% { content: "⠧" }  80% { content: "⠇" }
    90% { content: "⠏" }
  }
  #agentSend, #agentStop {
    height: var(--control); padding: 0 8px; border-radius: 0; cursor: pointer;
    display: inline-flex; align-items: center; font: 12px/1 var(--mono);
  }
  #agentSend { border: 1px solid var(--accent); background: var(--accent); color: var(--bg); }
  #agentStop { border: 1px solid var(--line); background: none; color: var(--ink-dim); }
  #agentStop:hover { color: var(--ink); border-color: var(--ink-faint); }

  /* One rhythm for the whole conversation: 18px between turns, 8px between the
     parts of a turn, and 2px between the agent's working steps so they read as
     a single block. Your messages carry the accent colour and a rule down the
     left, so where one turn ends and the next begins is visible at a glance. */
  .turn + .turn { margin-top: 18px; }
  .turn .you {
    color: var(--in); border-left: 2px solid var(--accent);
    padding: 1px 0 1px 10px; white-space: pre-wrap; line-height: 1.5;
  }
  .turn .you.queued { color: var(--ink-faint); border-left-color: var(--line); }
  .tag-queued { font: 11px var(--mono); margin-left: 8px; color: var(--ink-faint); }
  .turn .steps:not(:empty) { margin-top: 8px; display: grid; gap: 2px; }
  .turn .said:not(:empty) { margin-top: 8px; line-height: 1.55; }
  /* Markdown the way a terminal draws it: one text size for everything, with
     structure carried by weight, colour and indentation instead of bigger
     headings with margins of their own. Every block, whatever kind, is
     separated by the same 8px. Code is the same size as the text
     around it, since the whole chat is set in mono. */
  .said > * { margin: 0; }
  .said > * + * { margin-top: 8px; }
  .said strong { color: var(--ink); font-weight: 600; }
  .said em { font-style: italic; }
  .said a { color: var(--in); }
  .said code { font: 13px var(--mono); color: var(--ink); background: var(--panel);
               padding: 0 4px; }
  .said .md-h { font-weight: 600; color: var(--in); }
  .said .md-list { display: grid; gap: 2px; }
  .said .md-li { display: flex; gap: 8px; padding-left: calc(var(--level, 0) * 18px); }
  .said .md-mark { flex: none; min-width: 1.4ch; color: var(--ink-faint); }
  .said .md-quote { border-left: 2px solid var(--line); padding-left: 10px; color: var(--ink-dim); }
  .said .md-hr { border: 0; border-top: 1px solid var(--line); }
  .said .md-code { font: 13px/1.5 var(--mono); color: var(--ink-dim); background: var(--panel);
                   border: 1px solid var(--line); padding: 8px 10px; overflow-x: auto;
                   white-space: pre; }
  /* Tables inherit the ledger's rules unless told otherwise: full width, sticky
     uppercase headers, hover fills. None of that belongs in a chat reply. */
  .said .md-table { overflow-x: auto; }
  .said table { width: auto; border-collapse: collapse; }
  .said th, .said td { position: static; padding: 3px 16px 3px 0; background: none;
                       font: inherit; text-transform: none; letter-spacing: normal;
                       white-space: nowrap; font-variant-numeric: tabular-nums;
                       border-bottom: 1px solid var(--line-soft); }
  .said th { color: var(--ink-faint); font-weight: 500; border-bottom-color: var(--line); }
  .said th:last-child, .said td:last-child { padding-right: 0; }
  .said tbody tr:hover td { background: none; }
  .work > summary { color: var(--ink-faint); cursor: pointer; list-style: none;
                    font: 12px var(--mono); }
  .work > summary::-webkit-details-marker { display: none; }
  .work > summary:hover { color: var(--ink-dim); }
  .work pre { margin: 6px 0 2px; padding: 8px 10px; overflow-x: auto;
              background: var(--panel); border: 1px solid var(--line);
              font: 11px/1.5 var(--mono); color: var(--ink-dim); }
  .step { color: var(--ink-faint); font: 12px var(--mono); }
  .propose { border: 1px solid var(--accent-dim); border-left: 3px solid var(--accent);
             background: var(--panel); padding: 10px 12px; margin-top: 8px; }
  .propose h4 { margin: 0 0 4px; font-size: 13px; font-weight: 500; }
  .propose p { margin: 0 0 8px; font-size: 12px; color: var(--ink-dim); }
  .propose .work { margin-bottom: 8px; }
  .propose .btn { margin-right: 6px; }
  .agent-err, .agent-note { margin-top: 8px; }
  .agent-err { color: var(--loss); font-size: 13px; }
  .agent-note { color: var(--ink-faint); font: 12px var(--mono); }
</style>
</head>
<body>
<div id="agent">
  <button id="agentFull" type="button" aria-label="Full screen" aria-pressed="false" title="Full screen">
    <svg class="grow" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true" fill="none"
         stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 2h4v4M14 2 9 7M6 14H2v-4M2 14l5-5"/></svg>
    <svg class="shrink" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true" fill="none"
         stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13 7H9V3M9 7l5-5M3 9h4v4M7 9l-5 5"/></svg>
  </button>
  <div id="agentLog"></div>
  <form id="agentForm">
    <textarea id="agentInput" rows="1" placeholder="Ask about your money…"
              aria-label="Ask the analysis agent"></textarea>
    <div class="agent-controls">
      <span id="agentSpin" aria-hidden="true" hidden></span>
      <button id="agentStop" type="button" hidden>Stop</button>
      <button id="agentSend" type="submit" hidden>Send</button>
    </div>
  </form>
</div>
<div class="layout">
  <nav id="sidebar"></nav>
  <main>
    <div id="ledger">
    <div class="title">
      <h2 id="viewName">—</h2>
      <span class="sub" id="viewSub"></span>
    </div>

    <div class="cards" id="cards"></div>

    <div class="charts">
      <div class="panel">
        <h3>Money in and out, by month</h3>
        <p>Transfers between your own accounts are excluded.</p>
        <div class="chartbox"><canvas id="flowChart"></canvas></div>
      </div>
      <div class="panel">
        <h3 id="balTitle">Balance over time</h3>
        <p id="balNote">End of each month.</p>
        <div class="chartbox"><canvas id="balChart"></canvas></div>
      </div>
    </div>

    <div class="years" id="years"></div>
    <div id="tables"></div>
    </div>

    <div id="holdings" hidden></div>
    <div id="investments" hidden></div>
    <div id="rules" hidden></div>
    <div id="analysis" hidden></div>
  </main>
</div>

<div id="drill" hidden>
  <div class="drill-head">
    <h2 id="drillName"></h2>
    <span class="sub" id="drillSub"></span>
    <button class="drill-close" id="drillClose" aria-label="Close" title="Close (Esc)">✕</button>
  </div>
  <div class="drill-body" id="drillBody"></div>
</div>
<!-- Suggestions for the category editors and the add row. render() fills it. -->
<datalist id="categories"></datalist>


<script src="vendor/chart.umd.js"></script>
<script>
// Money is integer cents everywhere, exactly as the database stores it.
// Division by 100 happens only when formatting.
const money = (c, sign) => {
  const s = (Math.abs(c) / 100).toLocaleString("en-AU", {minimumFractionDigits: 2, maximumFractionDigits: 2});
  const lead = c < 0 ? "-" : (sign && c > 0 ? "+" : "");
  return lead + "$" + s;
};
// Short form for sidebar balances and chart axes. One decimal below $10k so
// neighbouring gridlines cannot collide: rounding to whole thousands printed
// $1,000 and $1,200 both as "$1k", and $1,500 as "$2k".
const compact = c => {
  const v = Math.abs(c) / 100;
  const scale = (n, suffix) => (n >= 10 ? Math.round(n) : Math.round(n * 10) / 10) + suffix;
  // The unit is picked by the rounded figure, so a value that rounds past a
  // unit's ceiling moves up one: $999.50 is "$1k", not "$1000", and $999,500
  // is "$1m", not "$1000k".
  const text = Math.round(v / 1000) >= 1000 ? scale(v / 1e6, "m")
    : Math.round(v) >= 1000 ? scale(v / 1000, "k")
    : String(Math.round(v));
  // No minus on a figure that rounds to zero: -$0.30 read "-$0".
  return (c < 0 && text !== "0" ? "-" : "") + "$" + text;
};
// "1 transaction", not "1 transactions".
const plural = (n, word) => `${n.toLocaleString()} ${word}${n === 1 ? "" : "s"}`;
// Dollars typed by hand to cents, or null when the text is not an amount.
// Commas only where a thousands separator belongs. Stripping them blindly
// turned a typo like "50000,25" into $5,000,025.00 without a word.
function cents(text) {
  const typed = String(text).replace(/[$\s]/g, "");
  if (!/^[-+]?\d{1,3}(,\d{3})*(\.\d{1,2})?$|^[-+]?\d+(\.\d{1,2})?$/.test(typed)) return null;
  return Math.round(Number(typed.replace(/,/g, "")) * 100);
}

const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
// The export stamp is written in UTC. Show it in the reader's own time zone:
// "when did this last run" only means anything in the time you live in.
// The month comes from MONTHS, not from toLocaleDateString, which renders
// September as "Sept" under en-AU and makes the line jump width.
const stamp = iso => {
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const date = `${String(d.getDate()).padStart(2, "0")} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  return date + " at " + d.toLocaleTimeString("en-AU", {hour: "numeric", minute: "2-digit"});
};
const monthOf = date => date.slice(0, 7);
const yearOf  = date => date.slice(0, 4);
// "1 Mar 2026". The month comes from MONTHS for the same reason stamp's does:
// toLocaleDateString writes September as "Sept" under en-AU.
const dayLabel = day => {
  const [y, m, d] = day.split("-");
  return `${+d} ${MONTHS[+m - 1]} ${y}`;
};
// Dozens of categories have to be told apart at a glance, so hues are spread by
// the golden angle over the alphabetical list — hashing the name collided badly,
// putting four categories within six degrees of each other. Saturation stays low
// and lightness high so they read on the near-black ground without competing
// with the signal lime, which 1c reserves for money in, the current item and the
// primary action. Uncategorised is faint: it means "missing", not a kind of thing.
function categoryColour(name) {
  if (!name || name === "Uncategorised") return css("--ink-faint");
  // From every row, hidden what-ifs included, so the toggle cannot shift the hues.
  const all = [...new Set(DATA.all.map(t => t.category).filter(Boolean))].sort();
  const i = all.indexOf(name);
  if (i < 0) return css("--ink-faint");
  // Lightness is set by contrast, not taste: the badge label is the dark
  // ground colour, so a fill below ~66% drops under 4.5:1 on some hues.
  return `hsl(${Math.round(i * 137.508) % 360} 38% ${i % 2 ? 66 : 76}%)`;
}
const colourFor = categoryColour;

const MONTH_LABEL = m => {
  const [y, mm] = m.split("-");
  return MONTHS[+mm - 1] + " " + y.slice(2);
};

// state.year: a "2026" string, null for every year, undefined for not chosen
// yet. Keeping "not chosen" distinct from "all" is what lets the All years
// button stick instead of being overwritten by the default below.
// state.from and state.to are a custom range on an account view, an alternative
// to the year. Setting either sets year to null, so no year button lights up and
// the default newest year cannot come back over the top of the range.
// state.whatif shows the what-if rows, the plans typed in by hand. Off, every
// view reads real rows only.
let DATA, state = {account: "all", year: undefined, from: null, to: null, whatif: true};
const charts = {};

// ---------- selection ----------
const totalOf = kind =>
  DATA.holdings.filter(h => (h.kind || "term deposit") === kind)
    .reduce((n, h) => n + h.balance, 0);

const accountsTotal = () => DATA.accounts.reduce((n, a) => n + (a.balance || 0), 0);

const netWorth = () => accountsTotal() + DATA.holdings.reduce((n, h) => n + h.balance, 0);

const accountsInView = () =>
  state.account === "all" ? DATA.accounts : DATA.accounts.filter(a => a.id === state.account);

// By posting date, which is what the year buttons and the running balances go
// by. Only a From runs to the last transaction; only a To starts at the first.
const rowsFor = (accountId, year, from, to) => DATA.transactions.filter(t =>
  (accountId === "all" || t.account === accountId) && (!year || yearOf(t.date) === year)
  && (!from || t.date >= from) && (!to || t.date <= to));

// The rows an account view is showing: its year, or its custom range.
const viewRows = accountId => rowsFor(accountId, state.year, state.from, state.to);

// The range in words, or "" when there is none. A range open at one end names
// only the day it was given. The other end is the first or last transaction,
// which is not a day worth printing.
const rangeLabel = () =>
  state.from && state.to ? `${dayLabel(state.from)} to ${dayLabel(state.to)}`
  : state.from ? `from ${dayLabel(state.from)}`
  : state.to ? `to ${dayLabel(state.to)}` : "";

// What the cards, the table titles and the agent's line call the period on show.
const periodLabel = () => rangeLabel() || state.year || "all years";

// Income and spending never include transfers. Moving your own money between
// accounts is not earning or spending it, and treating it as either is the
// mistake this whole view exists to avoid.
function totals(rows) {
  let income = 0, spend = 0;
  for (const t of rows) {
    if (t.type === "income") income += t.amount;
    else if (t.type === "expense") spend -= t.amount;
  }
  return {income, spend, net: income - spend, count: rows.length};
}

// Green for a surplus, red for a loss, neither for zero. Only the Net cards
// use it: Money in and Money out keep the page's blurple and ink.
const tone = n => n > 0 ? "gain" : n < 0 ? "loss" : "even";

// ---------- sidebar ----------
function renderSidebar() {
  const banks = {};
  for (const a of DATA.accounts) (banks[a.bank] ||= []).push(a);
  const nav = document.getElementById("sidebar");
  nav.innerHTML = "";

  // The total of the bank accounts listed below. Term deposits and investments
  // have their own items under Setup, so they are not counted here too.
  const all = document.createElement("div");
  all.className = "group";
  all.innerHTML = `<button data-id="all" aria-current="${state.account === "all"}">
      <span class="name">All accounts</span>
      <span class="bal num">${compact(accountsTotal())}</span></button>
    <button data-id="analysis" aria-current="${state.account === "analysis"}">
      <span class="name">Spending analysis</span></button>`;
  nav.append(all);

  for (const [bank, list] of Object.entries(banks)) {
    const group = document.createElement("div");
    group.className = "group";
    group.innerHTML = `<div class="caption">${esc(bank)}</div>` + list.map(a => `
      <button data-id="${a.id}" aria-current="${state.account === a.id}">
        <span class="name">${esc(a.label)}</span>
        <span class="bal num">${a.balance === null ? "—" : compact(a.balance)}</span>
      </button>`).join("");
    nav.append(group);
  }
  const other = document.createElement("div");
  other.className = "group";
  other.innerHTML = `<div class="caption">Setup</div>
    <button data-id="holdings" aria-current="${state.account === "holdings"}">
      <span class="name">Term deposits</span>
      <span class="bal num">${totalOf("term deposit") ? compact(totalOf("term deposit")) : "add"}</span>
    </button>
    <button data-id="investments" aria-current="${state.account === "investments"}">
      <span class="name">Investments</span>
      <span class="bal num">${totalOf("investment") ? compact(totalOf("investment")) : "add"}</span>
    </button>
    <button data-id="rules" aria-current="${state.account === "rules"}">
      <span class="name">Rules</span>
      <span class="bal num">${DATA.rules.length || "add"}</span>
    </button>`;
  nav.append(other);

  const foot = document.createElement("div");
  foot.className = "foot";
  // Real rows only, so the count still matches what the bank has. The plans
  // are counted apart, with the toggle that hides them from every view.
  const plans = DATA.all.length - DATA.real.length;
  foot.innerHTML =
    `<div>${DATA.real.length.toLocaleString()} transactions`
    + ` across ${DATA.accounts.length} accounts`
    + (plans ? ` · ${plural(plans, "what-if")} <button class="whatif-toggle" type="button">${
        state.whatif ? "hide" : "show"}</button>` : "")
    + `</div>`
    + `<div>Exported ${esc(stamp(DATA.generated_at))}</div>`;
  nav.append(foot);
  const toggle = foot.querySelector(".whatif-toggle");
  if (toggle) toggle.onclick = () => {
    state.whatif = !state.whatif;
    render();
    // render() rebuilt the sidebar. Focus the new copy of the toggle.
    nav.querySelector(".whatif-toggle").focus({preventScroll: true});
  };

  // Only the view buttons: the toggle above is a button in the same nav.
  nav.querySelectorAll("button[data-id]").forEach(b => b.onclick = () => {
    const before = state.account;
    state.account = ["all", "holdings", "investments", "rules", "analysis"]
      .includes(b.dataset.id) ? b.dataset.id : +b.dataset.id;
    // Keep a deliberate "All years" (null). renderYears already drops a year
    // the new account has no rows for, so resetting here only threw away the
    // one choice the user cannot get back by clicking a year button.
    if (state.year !== null) state.year = undefined;
    render();
    // A new view opens at its top, not partway down the last one's table.
    if (state.account !== before) window.scrollTo(0, 0);
    // render() rebuilt the sidebar. Focus the new copy of this item, so
    // pressing Enter does not drop keyboard focus back to the page.
    nav.querySelector(`button[data-id="${b.dataset.id}"]`).focus({preventScroll: true});
  });
}

// ---------- header, cards ----------
function renderSummary() {
  const view = accountsInView();
  // The period on show, not all time. The cards used to be all-time while the
  // charts and tables beside them obeyed the year buttons, so the page opened
  // with 2026 lit up and cards showing four years of totals, about seven times
  // too high.
  const rows = viewRows(state.account);
  const sum = totals(rows);
  const period = periodLabel();
  const balance = view.reduce((n, a) => n + (a.balance || 0), 0);

  document.getElementById("viewName").textContent =
    state.account === "all" ? "All accounts" : view[0].label;
  document.getElementById("viewSub").textContent =
    state.account === "all"
      ? `${view.length} accounts · ${DATA.real.length.toLocaleString()} transactions`
      : `${view[0].bank} · ${view[0].bsb ? view[0].bsb + "-" : ""}${view[0].number} · ${view[0].count.toLocaleString()} transactions`;

  const card = (label, value, cls, note) =>
    `<div class="card"><div class="caption">${label}</div>
       <div class="v num ${cls || ""}">${value}</div>
       ${note ? `<div class="note">${note}</div>` : ""}</div>`;

  // Net worth used to live in the top bar. On All accounts it belongs here,
  // where it can say what it is made of; a single account still shows its own
  // balance instead.
  const byKind = Object.entries(KINDS)
    .map(([kind, meta]) => [meta.title.toLowerCase(), totalOf(kind)])
    .filter(([, total]) => total);
  // Every balance is as at its own latest statement or entry, so the total
  // mixes dates. The oldest one says how far behind it can be.
  const oldest = [...DATA.accounts, ...DATA.holdings].map(x => x.as_at).filter(Boolean).sort()[0];
  const first = state.account === "all"
    ? card("Net worth", money(netWorth()), "", (byKind.length
        ? [`${money(balance)} in accounts`,
           ...byKind.map(([label, total]) => `${money(total)} in ${label}`)].join(" · ")
        : "across every account") + (oldest ? ` · oldest balance as at ${esc(oldest)}` : ""))
    : card("Balance", money(balance), "",
           view[0] && view[0].as_at ? "as at " + esc(view[0].as_at) : "");

  document.getElementById("cards").innerHTML =
    first +
    card("Money in", money(sum.income), "in", `${period} · excludes transfers`) +
    card("Money out", money(sum.spend), "out", `${period} · excludes transfers`) +
    card("Net", money(sum.net, true), tone(sum.net), `${period} · in minus out`);
}

// ---------- charts ----------
function draw(id, config) {
  charts[id]?.destroy();
  charts[id] = new Chart(document.getElementById(id), config);
}

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

// Chart.js ships Helvetica, grey lines and a black tooltip, none of which fit
// this palette. Set once from the page's tokens, so a chart that passes its
// own `scales`, and so replaces baseOptions' scales whole, still matches.
Chart.defaults.font.family = css("--mono");
Chart.defaults.scale.ticks.font = {size: 11};
// Legends list category names, which the page sets in sans. Mono is wider: the
// nine-item legend on All accounts 2023 wrapped to a fourth row, and the shorter
// plot dropped every other axis label, $0 among them.
Chart.defaults.plugins.legend.labels.font = {family: css("--sans")};
Chart.defaults.color = css("--ink-faint");      // tick and legend text
Chart.defaults.borderColor = css("--line");     // gridlines and axis borders
Object.assign(Chart.defaults.plugins.tooltip, {
  backgroundColor: css("--panel"), borderColor: css("--line"), borderWidth: 1,
  titleColor: css("--ink-dim"), bodyColor: css("--ink"), multiKeyBackground: css("--panel"),
});

// Money axes step by a dollar at least. A flat line at zero, such as a closed
// account's balance, otherwise got eleven gridlines all reading "$0". Returning
// null drops that tick and its gridline.
const moneyTick = v => v % 100 ? null : compact(v);

function baseOptions(extra = {}) {
  const options = Object.assign({
    responsive: true, maintainAspectRatio: false,
    plugins: {
      legend: {labels: {color: css("--ink-dim"), boxWidth: 10, boxHeight: 10, usePointStyle: true}},
      // Math.abs: the flow chart plots spending downwards, which is a drawing
      // decision. Leaking it into the text showed a negative "Out" figure beside a
      // "Money out" card reading the same figure unsigned.
      tooltip: {callbacks: {label: c => `${c.dataset.label}: ${money(Math.abs(c.parsed.y))}`}},
    },
    scales: {
      x: {grid: {display: false}, ticks: {maxRotation: 0, autoSkipPadding: 16}},
      y: {border: {display: false}, ticks: {callback: moneyTick}},
    },
  }, extra);

  // Chart.js matches the pointer along one axis, and that axis defaults to "x".
  // On a horizontal bar chart the categories run down the y axis, so the
  // default picked whichever bar the pointer's *horizontal* position lined up
  // with — the tooltip and the click both landed on the wrong category. Derive
  // it from indexAxis so this cannot be got wrong again.
  options.interaction = extra.interaction ||
    {mode: "index", intersect: false, axis: options.indexAxis === "y" ? "y" : "x"};
  return options;
}

function renderCharts() {
  const rows = viewRows(state.account);
  // Every month from the first row to the last by posting date, so a month
  // with no rows shows as a gap instead of being skipped.
  const months = monthsSpanning(rows, t => t.date);

  // Income is stacked by category so labelled sources read separately.
  const categories = [...new Set(rows.filter(t => t.type === "income")
    .map(t => t.category).filter(Boolean))].sort();
  const perMonth = m => rows.filter(t => monthOf(t.date) === m);
  const incomeSets = [...categories, null].map(name => ({
    label: name || (categories.length ? "Other income" : "In"),
    data: months.map(m => perMonth(m)
      .filter(t => t.type === "income" && (t.category || null) === name)
      .reduce((n, t) => n + t.amount, 0)),
    backgroundColor: name ? colourFor(name) : css("--in"),
    stack: "in", borderRadius: 0,
  })).filter(d => d.data.some(v => v));
  draw("flowChart", {
    type: "bar",
    data: {labels: months.map(MONTH_LABEL), datasets: [...incomeSets, {
      label: "Out", stack: "out", borderRadius: 0, backgroundColor: css("--out"),
      data: months.map(m => -totals(perMonth(m)).spend),
    }]},
    options: baseOptions({scales: {
      x: {stacked: true, grid: {display: false}, ticks: {maxRotation: 0, autoSkipPadding: 16}},
      y: {stacked: true, border: {display: false}, ticks: {callback: moneyTick}},
    }}),
  });

  // Balance at each month end. For a single account that is its own running
  // balance; for "all accounts" it is the sum of every account's last known
  // balance in that month, which is net worth over time.
  const view = accountsInView();
  const series = months.map(m => {
    let total = 0;
    for (const a of view) {
      const upTo = DATA.transactions.filter(t => t.account === a.id && monthOf(t.date) <= m && t.balance !== null);
      total += upTo.length ? upTo[upTo.length - 1].balance : 0;
    }
    return total;
  });

  // Not "net worth": this is bank accounts only. Term deposits and investments
  // are typed in as a single current balance with no history, so they cannot be
  // plotted. Calling this net worth put the accounts-only total under a card
  // showing the full net worth, on the same screen.
  document.getElementById("balTitle").textContent =
    state.account === "all" ? "In your accounts, over time" : "Balance over time";
  document.getElementById("balNote").textContent =
    state.account === "all"
      ? "Every account's balance at each month end, added up. Term deposits and "
        + "investments are not included — they have no history to plot."
      : "Balance at the end of each month.";
  draw("balChart", {
    type: "line",
    data: {labels: months.map(MONTH_LABEL), datasets: [{
      label: "Balance", data: series, borderColor: css("--ink"),
      backgroundColor: "transparent", borderWidth: 2, pointRadius: 0,
      pointHoverRadius: 4, tension: 0.25,
    }]},
    options: baseOptions({plugins: {legend: {display: false},
      tooltip: {callbacks: {label: c => money(c.parsed.y)}}}}),
  });
}

// ---------- years and table ----------
function renderYears() {
  const rows = rowsFor(state.account, null);
  const years = [...new Set(rows.map(t => yearOf(t.date)))].sort().reverse();
  if (state.year && !years.includes(state.year)) state.year = undefined;
  // Opens on the newest year with bank rows. A plan running to 2031 must not
  // make the page open on a year holding nothing but what-ifs.
  if (state.year === undefined)
    state.year = years.find(y => rows.some(t => !t.whatif && yearOf(t.date) === y)) || years[0] || null;

  const box = document.getElementById("years");
  // Rebuilding this row while a date box has focus sends the caret back to the
  // first segment, so the next digit lands in the wrong one: editing 11/03 to
  // December gave 2 January. While one is being typed in, only move the light.
  const current = y => String(y ? state.year === y : state.year === null && !state.from && !state.to);
  if (box.contains(document.activeElement) && document.activeElement.type === "date") {
    box.querySelectorAll("button").forEach(b => b.setAttribute("aria-current", current(b.dataset.y)));
    return years;
  }
  box.innerHTML = years.map(y =>
    `<button data-y="${y}" aria-current="${state.year === y}">${y}</button>`).join("")
    // All years means no filter at all, so a range showing takes the light off it.
    + `<button data-y="" aria-current="${state.year === null && !state.from && !state.to}">All years</button>`
    + `<label style="padding:0"><input type="date" class="range-from" aria-label="From" value="${state.from || ""}"
        style="border:0;background:none;font:inherit;color:inherit;padding:5px 8px"></label>`
    + `<label style="padding:0"><input type="date" class="range-to" aria-label="To" value="${state.to || ""}"
        style="border:0;background:none;font:inherit;color:inherit;padding:5px 8px"></label>`;
  box.querySelectorAll("button").forEach(b => b.onclick = () => {
    // A year replaces the range, and All years clears both.
    state.year = b.dataset.y || null;
    state.from = state.to = null;
    render();
    // render() rebuilt these buttons. Focus the new copy of this one.
    box.querySelector(`button[data-y="${b.dataset.y}"]`).focus();
  });
  // A date input fires `change` as each segment is completed, so typing 2026
  // into the year arrives as 0002, 0020, 0202 and only then 2026. The year also
  // takes six digits, so 20260925 typed straight in becomes the year 260925.
  // Only a real day counts; anything else leaves the page as it is.
  box.querySelectorAll("input").forEach(input => input.onchange = () => {
    if (input.value && !isDay(input.value)) return;
    state[input.classList.contains("range-from") ? "from" : "to"] = input.value || null;
    state.year = null;          // a typed date is not a year; see state above
    render();
  });
  return years;
}

const labelOf = id => (DATA.accounts.find(a => a.id === id) || {}).label || "";

const SEARCH_ICON = `<svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
  <circle cx="7" cy="7" r="4.4" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <path d="M10.6 10.6 14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
</svg>`;
// Points right when the table is folded, and turns down when it is open.
const CHEVRON = `<svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
  <path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.6"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>`;

// Everything about a row that is worth searching, in one lowercase string.
// Commas come out so "1234" finds "-$1,234.56"; the amount goes in both
// formatted and plain so "-1234.56" and "1234.56" both land. The running
// balance stays out, or "50.00" would also find every row that left $50.00 in
// the account, and count it in the caption totals. "what-if" finds the plans.
const haystack = t => t._find || (t._find = [
  t.date, t.spent_on || "", t.description, t.category || "", t.type,
  money(t.amount), (t.amount / 100).toFixed(2), labelOf(t.account),
  t.whatif ? "what-if" : "",
].join(" ").toLowerCase().replace(/,/g, ""));

// Substring, anywhere, in any order. Typing "coles" finds it mid-description;
// typing "coles 2024" finds Coles rows from 2024 without caring which comes
// first in the row. Every word has to appear somewhere, so adding a word always
// narrows the result.
function searchRows(rows, query) {
  const terms = query.toLowerCase().replace(/,/g, "").split(/\s+/).filter(Boolean);
  if (!terms.length) return rows;
  return rows.filter(t => {
    const hay = haystack(t);
    return terms.every(term => hay.includes(term));
  });
}

// Every table on screen, so a search box can rebuild its own rows without
// re-rendering the page and taking the focus out of the box you are typing in.
// Keyed by account id, or "drill" for the drill-down, not by title: two
// accounts can share a label, and a title changes with the year.
const tables = new Map();       // key -> {rows, opts}

// Which account tables on All accounts are open, by account id. They start
// collapsed, since nine full ledgers is a long scroll to find one, and the ones
// you open stay open across a refresh. Saved in this browser only.
const OPEN_KEY = "finance-book.open";
let openTables;
try { openTables = new Set(JSON.parse(localStorage.getItem(OPEN_KEY) || "[]")); }
catch { openTables = new Set(); }

function setOpen(wrap, open) {
  wrap.querySelector(".fold").setAttribute("aria-expanded", String(open));
  wrap.querySelector("table").hidden = !open;
  // A search cannot run in a table you cannot see.
  if (!open && !wrap.querySelector(".find").hidden) closeFind(wrap);
  openTables[open ? "add" : "delete"](wrap.dataset.table);
  try { localStorage.setItem(OPEN_KEY, JSON.stringify([...openTables])); } catch {}
}

// Searching a folded table opens it first. A table with no fold is left alone.
const unfold = wrap => { if (wrap.querySelector(".fold")) setOpen(wrap, true); };

function tableBody(rows, {column, hideCategory}) {
  // The drill-down, the table with an account column, picks its rows by the day
  // the money was spent, so it shows and sorts by that day too. A ledger keeps
  // the bank's posting date, which orders the statement and its balance.
  const day = column === "account" ? spentOn : t => t.date;
  // Newest first. Reversing alone was not enough: data.json is grouped by
  // account and only sorted by date within a group, so a set spanning accounts
  // — every category drill-down — came out in backwards account blocks. Reverse
  // first, then a stable sort by date, so within one day the later transaction
  // still comes first.
  return rows.slice().reverse()
    .sort((a, b) => day(b).localeCompare(day(a))).map(t => {
    const cls = t.type === "income" ? "in" : t.type === "expense" ? "out" : "move";
    const last = column === "account"
      ? `<td class="bal">${esc(labelOf(t.account))}</td>`
      : `<td class="r bal num">${t.balance === null ? "" : money(t.balance)}</td>`;
    // data-edit names the field a double-click on the cell edits. Only a row
    // entered by hand can have its date or amount changed, or be deleted: a
    // bank row is the bank's, so those two cells carry no data-edit on it.
    // The type tag names its own field, since it shares the cell with the
    // category. The row's id and series size sit on the <tr>.
    return `<tr class="${t.whatif ? "whatif" : t.provisional ? "provisional" : ""}" data-id="${t.id}"
        data-series="${t.series || 0}">
      <td class="date num"${t.manual ? ' data-edit="date"' : ""}>${t.manual
          ? '<button class="rowbtn del" type="button" aria-label="Delete this row" title="Delete">×</button>' : ""}${day(t)}</td>
      <td class="desc" data-edit="description" title="${esc(t.description)}${t.provisional
          ? " — not yet confirmed by the bank, this row may still change" : ""}">${esc(t.description)}</td>
      <td class="tags" data-edit="category">${t.whatif
          ? `<span class="tag whatif" title="${t.covered
              ? "The bank's rows now cover this day. Delete this what-if if it happened, or it is counted twice."
              : "A plan you entered. The bank has no such row."}">what-if${t.covered ? " · covered" : ""}</span> `
          : t.covered
          ? `<span class="tag whatif" title="The bank's rows now cover this day. Delete this row if the bank lists it, or it is counted twice.">covered</span> `
          : ""}<span class="tag ${cls}" data-edit="type">${esc(t.type)}</span>${t.category && !hideCategory
          ? ` <span class="tag cat" title="${esc(t.category)}" style="--tag:${colourFor(t.category)}">${esc(t.category)}</span>` : ""}</td>
      <td class="r amt num ${cls}"${t.manual ? ' data-edit="amount"' : ""}>${money(t.amount, true)}</td>
      ${last}
    </tr>`;
  }).join("") || '<tr><td colspan="5" class="empty">No transactions</td></tr>';
}

function tableMeta(rows) {
  const sum = totals(rows);
  return `<span class="in">in ${money(sum.income)}</span> ·
    <span class="out">out ${money(sum.spend)}</span> ·
    ${sum.count.toLocaleString()} rows`;
}

// One transaction table, used by the account ledger and by the category
// drill-down. They differ only in the last column: a ledger wants the running
// balance, a category spanning several accounts wants to say which account.
// `key` names the table for searching: the account id, or "drill" if not given.
// `fold` is true or false for a table that folds, open or collapsed, and left
// out for one that does not.
function transactionTable(title, rows, {column = "balance", hideCategory = false, key = "drill", fold} = {}) {
  const opts = {column, hideCategory};
  tables.set(String(key), {rows, opts});

  return `<div class="tablewrap" data-table="${key}"><div class="tcap">
      ${fold === undefined ? `<span class="grp">${esc(title)}</span>`
        : `<button class="fold" aria-expanded="${fold}">${CHEVRON}<span class="grp">${esc(title)}</span></button>`}
      <button class="findbtn" aria-label="Search these transactions"
              title="Search these transactions">${SEARCH_ICON}</button>
      <input class="find" type="search" placeholder="Search…" hidden
             aria-label="Search these transactions">
      <span class="meta">${tableMeta(rows)}</span>
    </div><table class="rows"${fold === false ? " hidden" : ""}>
    <!-- Only Description is sized, and it is sized to absorb the slack. Every
         other column is left alone so it sits at its own content width. -->
    <thead><tr>
      <th class="date">Date</th><th class="desc">Description</th><th class="tags">Type</th>
      <th class="amt r">Amount</th>
      ${column === "account"
        ? '<th class="acct">Account</th>'
        : '<th class="bal r">Balance</th>'}
    </tr></thead>
    <tbody>${tableBody(rows, opts)}</tbody>
    ${column === "balance" ? `<tfoot><tr class="add">${ADD_REST}</tr></tfoot>` : ""}
  </table></div>`;
}

// "ANZ Everyday · 2026", or "ANZ Everyday · 1 Mar 2026 to 15 Sep 2026". All
// years adds nothing: a title with no period on it already means every year.
// Only All accounts folds its tables; an account's own page has one table,
// and hiding it would leave the page empty.
const tableFor = account =>
  transactionTable(`${account.bank} ${account.label}` + (rangeLabel() || state.year ? " · " + periodLabel() : ""),
                   viewRows(account.id),
                   {key: account.id, fold: state.account === "all" ? openTables.has(String(account.id)) : undefined});

function renderTables() {
  const out = document.getElementById("tables");
  // An account with nothing in the period is left out. A range can empty every
  // one of them, a single account included, so say so rather than draw a table
  // with no rows in it.
  const view = accountsInView().filter(a => viewRows(a.id).length);
  out.innerHTML = view.length
    ? view.map(tableFor).join('<div style="height:var(--gap)"></div>')
    : '<div class="tablewrap"><div class="empty">No transactions in this period</div></div>';
}

// ---------- holdings ----------
// A term deposit produces no statement, so its balance can only be typed in.
// It counts towards net worth and never towards income or spending.
// Term deposits and investments differ only in the label. Both are money no
// statement covers, typed in by hand and counted in net worth.
const KINDS = {
  "term deposit": {tab: "holdings", title: "Term deposits", one: "a term deposit",
                   name: "Term deposit 12345", place: "Westpac"},
  "investment":   {tab: "investments", title: "Investments", one: "an investment",
                   name: "Sharesies portfolio", place: "Sharesies"},
};

// Deposits never reconcile to the cent, and the reasons are worth spelling
// out rather than leaving as an unexplained gap.
function depositExplainer(held) {
  // Real rows, whatever the toggle: a planned deposit is not on deposit.
  const of = name => DATA.real.filter(t => t.category === name);
  const into = of("Term deposit").filter(t => t.amount < 0).reduce((n, t) => n + t.amount, 0);
  const back = of("Term deposit").filter(t => t.amount > 0).reduce((n, t) => n + t.amount, 0);
  // Deposit interest by the banks' own wording, not by category. The Interest
  // category also holds ordinary savings interest, which has nothing to do
  // with this table.
  const DEPOSIT_INTEREST = /TERM DEPOSIT|^CREDIT INTEREST FROM/i;
  const interest = of("Interest").filter(t => DEPOSIT_INTEREST.test(t.description))
                                 .reduce((n, t) => n + t.amount, 0);
  const open = -(into + back);
  const gap = held - open;   // term deposits only: this table is about them
  const line = (label, value, cls) =>
    `<tr><td>${label}</td><td class="r amt num ${cls || ""}">${money(value)}</td></tr>`;

  return `<div class="panel">
    <h3>What the statements say</h3>
    <p>Worked out from the wording each bank uses, below.</p>
    <table class="fixed" style="max-width:420px">
      <colgroup><col><col style="width:9rem"></colgroup>
      <tbody>
        ${line("Moved into deposits", into, "out")}
        ${line("Principal returned", back, "in")}
        ${line("<b>Still on deposit</b>", open)}
        ${line("You have entered", held)}
        ${line("<b>Difference</b>", gap, gap ? "move" : "")}
      </tbody>
    </table>
    <p style="margin:12px 0 0">Interest of <b>${money(interest)}</b> was received separately and
      counts as income, not as principal coming back.</p>
    ${gap ? `<p style="margin:8px 0 0">A difference is normal, for three reasons:</p>
      <ul style="margin:6px 0 0;padding-left:18px;font-size:12px;color:var(--ink-faint);line-height:1.7">
        <li>Interest accrues inside an open deposit and is only paid when it matures, so a
            deposit is worth more than the amount you put in.</li>
        <li>Some payouts arrive as a single line with the interest already included, so the
            principal returned above is slightly overstated.</li>
