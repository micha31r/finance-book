// ---------- spending analysis ----------
// This view cuts across accounts rather than sitting inside one, because the
// question "what do I spend on food" is not per account.
// `hidden` holds the categories ticked OFF, not the ones ticked on. Empty means
// everything is included, which is the default, and a category that appears
// later — because you widened the period or added an account — starts included
// without anyone having to remember to tick it.
// from/to start undefined, meaning "not chosen yet", so the default period can
// be applied once on the first render. null means deliberately all time.
// preset is the period button last chosen, and null once dates are typed.
const analysis = {accounts: null, from: undefined, to: undefined, preset: null,
                  category: null, hidden: new Set()};

const catOf = t => t.category || "Uncategorised";

const isoDay = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`
                  + `-${String(d.getDate()).padStart(2, "0")}`;

function monthsAgo(n) {
  const now = new Date(), then = new Date();
  then.setMonth(then.getMonth() - n);
  // setMonth rolls forward when the target month is shorter — 31 March minus
  // one month lands back in March. Pull it to the last day of the month meant.
  if (then.getDate() !== now.getDate()) then.setDate(0);
  return isoDay(then);
}

// Measured from today, so "6 months" means the last six months even when the
// newest statement is a fortnight old.
const PERIODS = [
  {key: "30d", label: "30 days",   from: () => { const d = new Date(); d.setDate(d.getDate() - 29); return isoDay(d); }},
  {key: "3m",  label: "3 months",  from: () => monthsAgo(3)},
  {key: "6m",  label: "6 months",  from: () => monthsAgo(6)},
  {key: "12m", label: "12 months", from: () => monthsAgo(12)},
  {key: "ytd", label: "This year", from: () => `${new Date().getFullYear()}-01-01`},
  {key: "all", label: "All time",  from: () => null},
];
const DEFAULT_PERIOD = "12m";

const applyPeriod = key => {
  analysis.preset = key;
  analysis.from = PERIODS.find(p => p.key === key).from();
  analysis.to = null;
};

// The preset button to light, if any. Remembered rather than matched from the
// dates, because two presets can start on the same day: on 30 January, "30
// days" and "This year" both start on 1 January.
const activePeriod = () => analysis.preset;

// When the money actually moved, which is the question this page asks. The
// ledger stays on the bank's posting date because that is what orders the
// statement and the running balance. They differ by up to 8 days: posting
// dates fall on no weekend at all, and 301 transactions post in the month
// after the one they were spent in.
const spentOn = t => t.spent_on || t.date;

// Rows of one type inside the chosen accounts and period. Income and spending
// share this, so the two cards always cover exactly the same days.
function windowRows(type) {
  const chosen = analysis.accounts;
  // A period with no To of its own ends today: a plan dated next year is not
  // in "the last 12 months". A To past today brings the plans in on purpose.
  const to = analysis.to || isoDay(new Date());
  return DATA.transactions.filter(t =>
    t.type === type &&
    (!chosen || chosen.has(t.account)) &&
    (!analysis.from || spentOn(t) >= analysis.from) &&
    spentOn(t) <= to);
}

function analysisRows() { return windowRows("expense"); }
function incomeRows() { return windowRows("income"); }

// How many days an average is spread over: the chosen period, cut to the first
// and last dates loaded for the chosen accounts. A day inside the statements
// with no spending still counts. A day outside them is unknown, not zero, so
// calendar 2026 divides by the days loaded so far rather than by 365. The
// category ticks play no part, so the cards and the drill-down share one count.
function periodDays() {
  // Without a To of your own the window ends today (see windowRows), so a
  // plan dated later is not measured either: the period ends on the last row
  // up to today, not on the plan.
  const today = isoDay(new Date());
  const dates = DATA.transactions.filter(t => analysis.accounts.has(t.account)).map(spentOn)
    .filter(d => analysis.to || d <= today).sort();
  if (!dates.length) return 1;
  const first = dates[0], last = dates[dates.length - 1];
  const from = analysis.from && analysis.from > first ? analysis.from : first;
  const to = analysis.to && analysis.to < last ? analysis.to : last;
  // Inclusive: 1 Jan to 31 Dec is 365 days, not 364.
  return Math.max(1, (new Date(to) - new Date(from)) / 86400000 + 1);
}

function renderAnalysis() {
  if (analysis.accounts === null) analysis.accounts = new Set(DATA.accounts.map(a => a.id));
  if (analysis.from === undefined) applyPeriod(DEFAULT_PERIOD);

  // Everything the accounts and period select, before the category ticks. The
  // table lists all of these, so a category you have ticked off is still there
  // to tick back on, and the drill-down still works on it.
  const all = analysisRows();
  const listed = tally(all);

  // What the cards and charts are about: the ticked categories only.
  const rows = all.filter(t => !analysis.hidden.has(catOf(t)));
  const spent = rows.reduce((n, t) => n - t.amount, 0);
  const ranked = listed.filter(([name]) => !analysis.hidden.has(name));
  const days = periodDays();

  // What you saved. Net weighs income against every expense in the window, not
  // against the ticked ones, so ticking Rent off cannot make savings look
  // bigger than they were.
  const deposits = incomeRows();
  const income = deposits.reduce((n, t) => n + t.amount, 0);
  const spentAll = all.reduce((n, t) => n - t.amount, 0);
  const net = income - spentAll;

  const panel = document.getElementById("analysis");
  const body = overviewBody(rows, ranked, spent, days, listed, {income, deposits: deposits.length, net});
  // Rebuilding the controls under the caret sends it back to the first segment,
  // which made a date impossible to correct. While one is being typed in, only
  // the part below them is redrawn, and the chips just have their light moved.
  if (panel.contains(document.activeElement) && document.activeElement.type === "date") {
    panel.querySelector(".analysis-body").innerHTML = body;
    panel.querySelectorAll(".period").forEach(chip =>
      chip.setAttribute("aria-current", String(activePeriod() === chip.dataset.period)));
  } else {
    panel.innerHTML = `
    <div class="title"><h2>Spending analysis</h2>
      <span class="sub">income and spending, transfers between your accounts excluded</span></div>
    ${controlsHtml()}
    <div class="analysis-body">${body}</div>`;
    wireControls(panel);
  }

  drawAnalysisCharts(rows, ranked);
  wireCategoryTicks(panel, listed);

  // The same ticked total and day count as the cards and the Share column.
  renderDrill(all, spent, days);
  restoreFind();       // the drill-down has a table, and it has a search too
}

// Category totals for a set of rows, biggest first.
function tally(rows) {
  const byCategory = {};
  for (const t of rows) {
    const c = (byCategory[catOf(t)] ||= {total: 0, n: 0});
    c.total -= t.amount;
    c.n++;
  }
  return Object.entries(byCategory).sort((a, b) => b[1].total - a[1].total);
}

function wireCategoryTicks(root, listed) {
  root.querySelectorAll("tr[data-cat]").forEach(row => {
    row.onclick = event => {
      // The tick column is for including a category, not for opening it.
      if (event.target.closest(".tick")) return;
      analysis.category = row.dataset.cat;
      render();
    };
    // Rows take keyboard focus, so Enter opens one as a click does. Keys on the
    // tick box inside stay the tick box's own. preventDefault stops the same
    // Enter from pressing the drill-down's close button once focus is there.
    row.onkeydown = event => {
      if (event.key !== "Enter" || event.target !== row) return;
      event.preventDefault();
      row.onclick(event);
    };
  });
  // render() rebuilds the table, so each handler below focuses the new copy of
  // its tick box. Found by value: a category name can hold characters that a
  // selector would need escaped.
  root.querySelectorAll("[data-tick]").forEach(box => box.onchange = () => {
    box.checked ? analysis.hidden.delete(box.dataset.tick)
                : analysis.hidden.add(box.dataset.tick);
    render();
    [...root.querySelectorAll("[data-tick]")].find(b => b.dataset.tick === box.dataset.tick).focus();
  });
  root.querySelectorAll(".all-cats").forEach(box => box.onchange = () => {
    analysis.hidden = box.checked ? new Set() : new Set(listed.map(([name]) => name));
    render();
    root.querySelector(".all-cats").focus();
  });
}

// The account and period pickers appear both on the page and inside the
// drill-down, so they are keyed by class and wired per container. Ids would
// collide between the two copies and only the first would work.
function controlsHtml() {
  return `<div class="controls">
      <div><div class="caption" style="margin-bottom:6px">Accounts</div>
        <div class="picker acct-picker">
          <label><input type="checkbox" class="all-accts"
            ${analysis.accounts.size === DATA.accounts.length ? "checked" : ""}> <b>All</b></label>
          ${DATA.accounts.map(a => `
            <label><input type="checkbox" data-acct="${a.id}"
              ${analysis.accounts.has(a.id) ? "checked" : ""}> ${esc(a.label)}</label>`).join("")}
        </div></div>
      <div><div class="caption" style="margin-bottom:6px">Period</div>
        <div class="picker">
          ${PERIODS.map(p => `<button class="chip period" type="button" data-period="${p.key}"
            aria-current="${activePeriod() === p.key}">${p.label}</button>`).join("")}
        </div>
        <div class="picker" style="margin-top:6px">
          <label style="padding:0"><input type="date" class="from-date" value="${analysis.from || ""}"
            style="border:0;background:none;font:inherit;color:inherit;padding:5px 8px"></label>
          <label style="padding:0"><input type="date" class="to-date" value="${analysis.to || ""}"
            style="border:0;background:none;font:inherit;color:inherit;padding:5px 8px"></label>
        </div></div>
    </div>`;
}

function wireControls(root) {
  root.querySelectorAll(".acct-picker [data-acct]").forEach(box => box.onchange = () => {
    box.checked ? analysis.accounts.add(+box.dataset.acct)
                : analysis.accounts.delete(+box.dataset.acct);
    render();
  });
  root.querySelectorAll(".all-accts").forEach(box => box.onchange = () => {
    analysis.accounts = box.checked ? new Set(DATA.accounts.map(a => a.id)) : new Set();
    render();
  });
  // A date input fires `change` as each segment is completed, so typing 2026
  // into the year arrives as 0002, 0020, 0202 and only then 2026. Re-rendering
  // on the early ones rebuilt the field and threw the focus away mid-keystroke,
  // which made the year impossible to type. Only a real day counts: the year
  // segment also takes six digits, so 20260925 typed straight in reads as 260925.
  const settled = value => !value || isDay(value);
  // Typed dates light no preset, except that emptying both boxes is All time.
  const typed = () => { analysis.preset = analysis.from || analysis.to ? null : "all"; render(); };
  root.querySelectorAll(".from-date").forEach(input => input.onchange = () => {
    if (!settled(input.value)) return;
    analysis.from = input.value || null; typed();
  });
  root.querySelectorAll(".to-date").forEach(input => input.onchange = () => {
    if (!settled(input.value)) return;
    analysis.to = input.value || null; typed();
  });
  root.querySelectorAll(".period").forEach(button => button.onclick = () => {
    applyPeriod(button.dataset.period); render();
  });
}

// The drill-down covers the window. The page stays rendered behind it, so
// closing needs no work and the scroll position is still there.
function renderDrill(rows, spent, days) {
  const panel = document.getElementById("drill");
  const name = analysis.category;
  if (!name) {
    panel.hidden = true;
    document.body.classList.remove("locked");
    return;
  }
  const catRows = rows.filter(t => (t.category || "Uncategorised") === name);
  const share = (100 * catRows.reduce((n, t) => n - t.amount, 0) / (spent || 1)).toFixed(1);

  document.getElementById("drillName").innerHTML =
    `<span class="swatch" style="background:${colourFor(name)};width:12px;height:12px"></span>${esc(name)}`;
  // A ticked-off category is not in the total, so it has no share of it. The
  // table shows a dash for it too.
  document.getElementById("drillSub").textContent = analysis.hidden.has(name)
    ? "left out of the totals" : `${share}% of spending in this selection`;
  document.getElementById("drillBody").innerHTML =
    controlsHtml() + drillBody(name, catRows, days);

  // Focus moves into the overlay only as it opens. A later render, such as a
  // period picked inside it, is not a reason to move it.
  const opening = panel.hidden;
  panel.hidden = false;
  document.body.classList.add("locked");
  panel.scrollTop = 0;
  drawDrillChart(name, catRows);
  wireControls(panel);
  if (opening) document.getElementById("drillClose").focus();
}

function closeDrill() {
  if (analysis.category === null) return;
  const name = analysis.category;
  analysis.category = null;
  render();
  // Focus goes back to the category's row. preventScroll keeps the page where
  // it was, since the drill-down may have been opened from the chart instead.
  const row = [...document.querySelectorAll("#analysis tr[data-cat]")].find(r => r.dataset.cat === name);
  if (row) row.focus({preventScroll: true});
}

document.getElementById("drillClose").onclick = closeDrill;
document.addEventListener("keydown", event => {
  // Esc closes one thing at a time, the one on top: a table's search box, then
  // full screen, then the chat, then the drill-down overlay. The chat's own Esc used to bubble on
  // up to here too, so dismissing it also shut the drill-down underneath.
  if (event.key !== "Escape") return;
  if (event.target.classList && event.target.classList.contains("find")) {
    return closeFind(event.target.closest(".tablewrap"));
  }
  const chat = document.getElementById("agent");
  if (chat.classList.contains("full")) return agentFull(false);
  if (chat.classList.contains("open") || chat.contains(document.activeElement)) {
    agentOpen(false);
    if (chat.contains(document.activeElement)) document.activeElement.blur();
    return;
  }
  closeDrill();
});

// ---------- searching a table ----------
// Delegated, so it keeps working after any re-render. The handlers rebuild only
// the tbody and the row-count line; the input itself is never replaced, so what
// you have typed and where the caret sits both survive.
// The search that is currently open, so it can go in the URL and survive a
// re-render when you switch year.
const find = {table: null, query: ""};

function findIn(wrap) {
  const entry = tables.get(wrap.dataset.table);
  if (!entry) return;
  const query = wrap.querySelector(".find").value;
  find.table = wrap.dataset.table;
  find.query = query;
  writeUrl();
  const shown = searchRows(entry.rows, query);
  wrap.querySelector("tbody").innerHTML = tableBody(shown, entry.opts);
  wrap.querySelector(".meta").innerHTML = query.trim()
    ? `${tableMeta(shown)} <span class="ink-faint">of ${entry.rows.length.toLocaleString()}</span>`
    : tableMeta(entry.rows);
}

function closeFind(wrap) {
  if (!wrap) return;
  const box = wrap.querySelector(".find");
  box.value = "";
  box.hidden = true;
  wrap.querySelector(".findbtn").hidden = false;
  findIn(wrap);
  find.table = null;
  find.query = "";
  writeUrl();
}

// Re-open the search after a re-render, so switching year does not throw away
// what you were looking for. A search that names no table, as the agent's does,
// goes to the first table showing. A search whose table has gone is dropped.
function restoreFind() {
  if (!find.query) return;
  // The ledger and the drill-down keep their last tables while hidden.
  const showing = [...document.querySelectorAll(".tablewrap[data-table]")]
    .filter(w => !w.closest("[hidden]"));
  const wrap = find.table ? showing.find(w => w.dataset.table === find.table)
    : showing.find(w => searchRows(tables.get(w.dataset.table)?.rows || [], find.query).length) || showing[0];
  if (!wrap) {
    find.table = null;
    find.query = "";
    return writeUrl();
  }
  unfold(wrap);
  const box = wrap.querySelector(".find");
  box.value = find.query;
  box.hidden = false;
  wrap.querySelector(".findbtn").hidden = true;
  findIn(wrap);
}

document.addEventListener("click", event => {
  const button = event.target.closest && event.target.closest(".findbtn");
  if (!button) return;
  const wrap = button.closest(".tablewrap");
  unfold(wrap);
  const box = wrap.querySelector(".find");
  box.hidden = false;
  button.hidden = true;
  box.focus();
});

document.addEventListener("click", event => {
  const button = event.target.closest && event.target.closest(".fold");
  if (button) setOpen(button.closest(".tablewrap"), button.getAttribute("aria-expanded") !== "true");
});

document.addEventListener("input", event => {
  if (event.target.classList && event.target.classList.contains("find")) {
    findIn(event.target.closest(".tablewrap"));
  }
});

// A search box emptied by its own clear button gets out of the way again.
document.addEventListener("search", event => {
  const box = event.target;
  if (box.classList && box.classList.contains("find") && !box.value) {
    closeFind(box.closest(".tablewrap"));
  }
});

// ---------- editing a row ----------
// Double-click a cell to change it. One listener for every table, so it keeps
// working after any re-render. The row's id is on the <tr>; the field is the
// data-edit attribute on the cell, or on the type tag, which shares its cell
// with the category.
const TYPES = ["automatic", "income", "expense", "transfer"];
const REPEATS = ["once", "weekly", "fortnightly", "monthly", "quarterly", "yearly"];
const AMOUNT_HINT = "Amount must be a number, like -12.34 or 1,234.56";
const options = (list, current) =>
  list.map(v => `<option${v === current ? " selected" : ""}>${v}</option>`).join("");

document.addEventListener("dblclick", event => {
  const target = event.target.closest && event.target.closest("[data-edit]");
  // The what-if tag cannot be changed, and a control is not a cell to edit.
  if (!target || event.target.closest(".tag.whatif, button, input, select")) return;
  const row = target.closest("tr[data-id]");
  const t = row && DATA.all.find(x => x.id === +row.dataset.id);
  if (t) edit(target, t);
});

function edit(target, t) {
  const field = target.dataset.edit;
  const td = target.closest("td");
  const saved = td.innerHTML;
  const before = {description: t.description, category: t.category || "", type: t.type,
                  date: t.date, amount: t.amount}[field];
  const editor = document.createElement(field === "type" ? "select" : "input");
  editor.className = "editor";
  if (field === "type") editor.innerHTML = options(TYPES, t.type);
  else {
    editor.type = field === "date" ? "date" : "text";
    editor.value = field === "amount" ? (t.amount / 100).toFixed(2) : before;
    if (field === "category") editor.setAttribute("list", "categories");
    if (field === "amount") editor.inputMode = "decimal";
  }
  // The date is the one field the server changes on this row alone.
  if (t.series && field !== "date") editor.title = `applies to all ${t.series} rows of this series`;
  // The type and category editors replace their own tag, so the other tag
  // stays in view. The rest fill the cell.
  if (field === "type") target.replaceWith(editor);
  else if (field === "category") {
    const tag = td.querySelector(".tag.cat");
    tag ? tag.replaceWith(editor) : td.append(" ", editor);
  } else td.replaceChildren(editor);
  editor.focus();
  if (editor.select) editor.select();
  // The list opens on the double-click itself. Not every browser has this.
  if (field === "type") try { editor.showPicker(); } catch {}

  // Enter, blur and the type list's change can all fire for one edit, and the
  // restore below removes the editor, which blurs it too. The first one wins.
  let done = false;
  const finish = async keep => {
    if (done) return;
    done = true;
    // Chrome blurs an editor a re-render removes, Firefox does not. Neither
    // saves: pressing Back is not pressing Enter.
    if (!editor.isConnected) keep = false;
    let value;
    if (keep) {
      value = field === "amount" ? cents(editor.value) : editor.value.trim();
      if (field === "amount" && value === null) {
        alert(AMOUNT_HINT);
        keep = false;
      }
      // A date the browser could not complete arrives as "": nothing to save.
      if (field === "date" && !value) keep = false;
    }
    if (!keep || value === before) { td.innerHTML = saved; return; }
    td.setAttribute("aria-busy", "true");
    editor.disabled = true;
    try {
      await request("/api/txn/" + t.id, {method: "POST", headers: {"Content-Type": "application/json"},
                                         body: JSON.stringify({[field]: value})});
    } catch (e) {
      alert("Could not save: " + e.message);
      td.innerHTML = saved;
      td.removeAttribute("aria-busy");
      return;
    }
    await reload();
  };
  editor.addEventListener("keydown", event => {
    // Stopped here: Escape would otherwise close the drill-down under the
    // editor, and the page's own Escape and Enter handling has no part in this.
    if (event.key === "Enter" && !event.isComposing) { event.preventDefault(); event.stopPropagation(); finish(true); }
    if (event.key === "Escape") { event.stopPropagation(); finish(false); }
  });
  editor.addEventListener("blur", () => finish(true));
  // Picking from the list is the whole edit; no Enter needed after it.
  if (field === "type") editor.addEventListener("change", () => finish(true));
}

// ---------- adding a row ----------
// Every ledger table ends with a "+ add" line. Opened, it is one cell across
// the table holding the inputs. Enter anywhere in it saves; Escape puts
// "+ add" back. It lives in the table's foot, which a search leaves alone.
const ADD_REST = '<td></td><td class="desc"><button class="rowbtn addbtn" type="button">+ add</button></td>'
               + '<td></td><td></td><td></td>';

document.addEventListener("click", event => {
  const button = event.target.closest && event.target.closest(".addbtn");
  if (button) openAdd(button.closest("tr"));
});

function openAdd(row) {
  row.innerHTML = `<td colspan="5"><div class="addform">
    <input type="date" name="date" value="${isoDay(new Date())}" aria-label="Date">
    <input name="description" maxlength="200" placeholder="Description" aria-label="Description">
    <select name="type" aria-label="Type">${options(TYPES, "automatic")}</select>
    <input name="category" list="categories" placeholder="Category" aria-label="Category">
    <input name="amount" inputmode="decimal" placeholder="-12.34" aria-label="Amount in dollars">
    <label><input type="checkbox" name="whatif" checked> what-if</label>
    <select name="repeat" aria-label="Repeat">${options(REPEATS, "once")}</select>
    <input type="date" name="until" aria-label="Until" hidden></div></td>`;
  row.querySelector("[name=repeat]").onchange = event =>
    row.querySelector("[name=until]").hidden = event.target.value === "once";
  row.onkeydown = event => {
    // Stopped here, so Escape does not go on to close anything else.
    if (event.key === "Enter" && !event.isComposing) { event.preventDefault(); event.stopPropagation(); submitAdd(row); }
    if (event.key === "Escape") { event.stopPropagation(); closeAdd(row); }
  };
  row.querySelector("[name=description]").focus();
}

function closeAdd(row) {
  row.innerHTML = ADD_REST;
  row.onkeydown = null;
  row.querySelector(".addbtn").focus();
}

async function submitAdd(row) {
  if (row.getAttribute("aria-busy") === "true") return;      // a second Enter while the first saves
  const value = name => row.querySelector(`[name=${name}]`).value.trim();
  const amount = cents(value("amount"));
  if (amount === null) return alert(AMOUNT_HINT);
  const repeat = value("repeat");
  const body = {
    account: +row.closest(".tablewrap").dataset.table,
    date: value("date"), description: value("description"), amount, type: value("type"),
    category: value("category") || null, whatif: row.querySelector("[name=whatif]").checked,
    repeat, until: repeat === "once" ? null : value("until") || null,
  };
  row.setAttribute("aria-busy", "true");
  try {
    await request("/api/txn", {method: "POST", headers: {"Content-Type": "application/json"},
                               body: JSON.stringify(body)});
  } catch (e) {
    // The inputs stay, so a refused row can be corrected rather than retyped.
    alert("Could not add: " + e.message);
    row.removeAttribute("aria-busy");
    return;
  }
  await reload();
  // reload() rebuilt the table. Focus its "+ add" again, where the row began.
  document.querySelector(`.tablewrap[data-table="${body.account}"] .addbtn`)?.focus({preventScroll: true});
}

// ---------- deleting a row ----------
// Only rows entered by hand have the ×. A series goes as a whole, after a
// word; a single row goes at once, since putting it back is one line.
document.addEventListener("click", async event => {
  const button = event.target.closest && event.target.closest(".del");
  if (!button) return;
  const row = button.closest("tr");
  const series = +row.dataset.series;
  if (series && !confirm(`Delete all ${series} rows of this series?`)) return;
  button.disabled = true;
  const table = row.closest(".tablewrap").dataset.table;
  try {
    await request("/api/txn/" + row.dataset.id, {method: "DELETE"});
  } catch (e) {
    alert("Could not delete: " + e.message);
    button.disabled = false;
    return;
  }
  await reload();
  // The × went with its row. The table's "+ add" is the nearest thing left
  // to focus; the drill-down has none.
  document.querySelector(`.tablewrap[data-table="${table}"] .addbtn`)?.focus({preventScroll: true});
});

function overviewBody(rows, ranked, spent, days, listed, {income, deposits, net}) {
  // Bars are drawn against the largest category in the whole list, not the
  // largest included one, so they stay put as you tick things on and off.
  const widest = listed.length ? listed[0][1].total : 0;
  const table = listed.map(([name, c]) => {
    const on = !analysis.hidden.has(name);
    return `<tr class="pick${on ? "" : " off"}" data-cat="${esc(name)}" tabindex="0">
      <td class="tick"><input type="checkbox" data-tick="${esc(name)}" ${on ? "checked" : ""}
        aria-label="Include ${esc(name)}"></td>
      <td><span class="swatch" style="background:${colourFor(name)}"></span>
          ${esc(name)}</td>
      <td><span class="bar"><i style="width:${(100 * c.total / (widest || 1)).toFixed(1)}%;background:${colourFor(name)}"></i></span></td>
      <td class="r num">${on ? (100 * c.total / (spent || 1)).toFixed(1) + "%" : "—"}</td>
      <td class="r num">${c.n}</td>
      <td class="r amt num out">${money(c.total)}</td>
    </tr>`;
  }).join("");
  const allOn = analysis.hidden.size === 0;
  // From the full list, so ticking Uncategorised off does not read "all labelled".
  const unlabelled = listed.find(([name]) => name === "Uncategorised");

  // The share of income kept, said plainly in either direction. Percentages of
  // nothing mean nothing, so a period with no income says so instead.
  // Net is income minus all spending, so the spending behind it is income - net.
  let netNote = income === 0 ? "no income in this period"
    : net >= 0 ? `${Math.round(100 * net / income)}% of income saved`
    // A tiny income makes "x% more than came in" absurd: one 39c interest deposit
    // in 30 days read 253933%. What income covered stays readable at any size.
    : `income covered ${Math.round(100 * income / (income - net))}% of spending`;
  // Total spent has dropped the unticked categories but Net has not. Say so,
  // or the two cards look like they disagree.
  if (analysis.hidden.size) netNote += " · counts all spending";

  return `
    <div class="cards">
      <div class="card"><div class="caption">Income</div>
        <div class="v num in">${money(income)}</div>
        <div class="note">${plural(deposits, "deposit")}</div></div>
      <div class="card"><div class="caption">Total spent</div>
        <div class="v num out">${money(spent)}</div>
        <div class="note">${plural(rows.length, "transaction")}</div></div>
      <div class="card"><div class="caption">Net</div>
        <div class="v num ${tone(net)}">${money(net, true)}</div>
        <div class="note">${netNote}</div></div>
      <div class="card"><div class="caption">Per day</div>
        <div class="v num">${money(Math.round(spent / days))}</div>
        <div class="note">over ${plural(Math.round(days), "day")}</div></div>
      <div class="card"><div class="caption">Per month</div>
        <div class="v num">${money(Math.round(spent / days * 30.44))}</div>
        <div class="note">average</div></div>
      <div class="card"><div class="caption">Categories</div>
        <div class="v num">${ranked.length}</div>
        <div class="note">${unlabelled
            ? money(unlabelled[1].total) + " unlabelled" : "all labelled"}</div></div>
    </div>

    <div class="charts">
      <div class="panel"><h3>Where the money goes</h3>
        <p>Click a category to see the transactions behind it.</p>
        <div class="chartbox" style="height:${Math.max(240, ranked.length * 20)}px">
          <canvas id="catChart"></canvas></div></div>
      <div class="panel"><h3>By month</h3>
        <p>Top eight categories, everything else grouped.</p>
        <div class="chartbox" style="height:380px">
          <canvas id="catTrend"></canvas></div></div>
    </div>

    <div class="tablewrap"><div class="tcap"><span class="grp">Categories</span>
        <span class="meta">${money(spent)} across ${ranked.length}${
          allOn ? "" : ` of ${listed.length}`} categories · click a name to drill in</span>
      </div><table class="fixed">
      <colgroup><col style="width:2.2rem"><col><col style="width:28%">
        <col style="width:5rem"><col style="width:5rem"><col style="width:8rem"></colgroup>
      <thead><tr>
        <th class="tick"><input type="checkbox" class="all-cats" ${allOn ? "checked" : ""}
          aria-label="Include every category" title="Include every category"></th>
        <th>Category</th><th></th><th class="r">Share</th>
        <th class="r">Count</th><th class="r">Total</th></tr></thead>
      <tbody>${table || '<tr><td colspan="6" class="empty">No spending in this selection</td></tr>'}</tbody>
    </table></div>`;
}

function drillBody(name, rows, days) {
  const total = rows.reduce((n, t) => n - t.amount, 0);
  // `days` is the whole selection's, as on the page, not this category's own
  // span. Dividing a one-off by the gap between its first and last row gave a
  // category with a single transaction a "per month" some thirty times its total.
  // Median, not mean. "Typical" promises a representative transaction, and the
  // mean does not survive one expensive flight among cheap ones.
  const sorted = rows.map(t => -t.amount).sort((a, b) => a - b);
  const middle = sorted.length
    ? (sorted.length % 2 ? sorted[(sorted.length - 1) / 2]
       : Math.round((sorted[sorted.length / 2 - 1] + sorted[sorted.length / 2]) / 2))
    : 0;
  const merchants = {};
  for (const t of rows) {
    const key = t.merchant || t.description;
    merchants[key] = (merchants[key] || 0) - t.amount;
  }
  const top = Object.entries(merchants).sort((a, b) => b[1] - a[1]).slice(0, 8);

  return `
    <div class="cards">
      <div class="card"><div class="caption">Spent here</div>
        <div class="v num out">${money(total)}</div>
        <div class="note">${plural(rows.length, "transaction")}</div></div>
      <div class="card"><div class="caption">Per month</div>
        <div class="v num">${money(Math.round(total / days * 30.44))}</div>
        <div class="note">average over ${plural(Math.round(days), "day")}</div></div>
      <div class="card"><div class="caption">Typical</div>
        <div class="v num">${money(middle)}</div>
        <div class="note">middle transaction</div></div>
      <div class="card"><div class="caption">Most spent at</div>
        <div class="v" style="font-size:14px;font-weight:600">${
          top.length ? esc(top[0][0].slice(0, 26)) : "—"}</div>
        <div class="note">${top.length ? money(top[0][1]) : ""}</div></div>
    </div>

    <div class="panel"><h3>Top places</h3>
      <p>Where this category's money went, in this selection.</p>
      <table><tbody>${top.map(([place, amount]) => `<tr>
        <td>${esc(place)}</td>
        <td style="width:40%"><span class="bar"><i style="width:${
          (100 * amount / top[0][1]).toFixed(1)}%;background:${colourFor(name)}"></i></span></td>
        <td class="r amt num out">${money(amount)}</td></tr>`).join("")}</tbody></table></div>

    <div class="panel"><h3>${esc(name)} by month</h3>
      <p>Same accounts and period as the controls above.</p>
      <div class="chartbox"><canvas id="drillChart"></canvas></div></div>

    ${transactionTable(name, rows, {column: "account", hideCategory: true})}`;
}

// Every month between the first and the last, including the empty ones. Using
// only the months that have rows drew a category bought twice, years apart, as
// two adjacent bars: Parking rendered "Jul 23 | Feb 26" side by side. The
// analysis dates a row by when the money moved, the ledger by posting date.
function monthsSpanning(rows, dateOf = spentOn) {
  const seen = rows.map(dateOf).map(monthOf).sort();
  if (!seen.length) return [];
  const out = [];
  const end = seen[seen.length - 1];
  for (let d = new Date(seen[0] + "-01T00:00:00Z"); monthOf(d.toISOString()) <= end;
       d.setUTCMonth(d.getUTCMonth() + 1)) {
    out.push(monthOf(d.toISOString()));
  }
  return out;
}

function drawDrillChart(name, rows) {
  const months = monthsSpanning(rows);
  draw("drillChart", {
    type: "bar",
    data: {labels: months.map(MONTH_LABEL), datasets: [{
      label: name, borderRadius: 0, backgroundColor: colourFor(name),
      data: months.map(m => rows.filter(t => monthOf(spentOn(t)) === m)
        .reduce((n, t) => n - t.amount, 0)),
    }]},
    options: baseOptions({plugins: {legend: {display: false},
      tooltip: {callbacks: {label: c => money(c.parsed.y)}}}}),
  });
}

function drawAnalysisCharts(rows, ranked) {
  draw("catChart", {
    type: "bar",
    data: {labels: ranked.map(([name]) => name), datasets: [{
      data: ranked.map(([, c]) => c.total),
      backgroundColor: ranked.map(([name]) => colourFor(name)), borderRadius: 0,
    }]},
    options: baseOptions({
      indexAxis: "y",
      onClick: (_event, hits) => {
        if (!hits.length) return;
        analysis.category = ranked[hits[0].index][0];
        render();
      },
      plugins: {legend: {display: false},
        tooltip: {callbacks: {label: c => money(c.parsed.x)}}},
      scales: {
        x: {border: {display: false}, ticks: {callback: moneyTick}},
        y: {grid: {display: false}, ticks: {color: css("--ink-dim"), autoSkip: false}},
      },
    }),
  });

  const months = monthsSpanning(rows);
  const top = ranked.slice(0, 8).map(([name]) => name);
  const series = [...top, "Everything else"].map(name => ({
    label: name, stack: "s", borderRadius: 0,
    backgroundColor: name === "Everything else" ? css("--ink-faint") : colourFor(name),
    data: months.map(m => rows
      .filter(t => monthOf(spentOn(t)) === m &&
        (name === "Everything else"
          ? !top.includes(t.category || "Uncategorised")
          : (t.category || "Uncategorised") === name))
      .reduce((n, t) => n - t.amount, 0)),
  })).filter(d => d.data.some(v => v));
  draw("catTrend", {
    type: "bar",
    data: {labels: months.map(MONTH_LABEL), datasets: series},
    options: baseOptions({scales: {
      x: {stacked: true, grid: {display: false}, ticks: {maxRotation: 0, autoSkipPadding: 16}},
      y: {stacked: true, border: {display: false}, ticks: {callback: moneyTick}},
    }}),
  });
}

// ---------- income source rules ----------
// A category says where money came from, which `type` cannot. Salary and money
// from your parents are both income, and worth telling apart.
function renderRules() {
  // Transfers are excluded here as they are everywhere else. Summing them in
  // made "Paying people" read more than all-time income, by adding money
  // moved between the user's own accounts — about two thirds of it — to
  // the real spending.
  const byCategory = {};
  for (const t of DATA.transactions) {
    if (!t.category || t.type === "transfer") continue;
    (byCategory[t.category] ||= {total: 0}).total += t.amount;
  }
  const rows = DATA.rules.map(r => {
    const total = (byCategory[r.category] || {total: 0}).total;
    // Spaces at the end change what a pattern matches but draw as nothing, so
    // they go in a span the stylesheet can shade.
    const pattern = esc(r.pattern).replace(/\s+$/, space => `<span class="trail">${space}</span>`);
    return `<tr>
      <td><span class="tag" title="${esc(r.category)}" style="--tag:${colourFor(r.category)}">${esc(r.category)}</span></td>
      <td><code>${pattern}</code></td>
      <td class="r num" data-hits="${r.id}">…</td>
      <td class="r amt num ${total < 0 ? "out" : "in"}">${money(total)}</td>
      <td class="r"><button class="rowbtn" data-delrule="${r.id}">remove</button></td>
    </tr>`;
  }).join("");

  const uncategorised = DATA.transactions
    .filter(t => t.type === "income" && !t.category)
    .reduce((n, t) => n + t.amount, 0);

  document.getElementById("rules").innerHTML = `
    <div class="title"><h2>Rules</h2>
      <span class="sub">label spending and income by their description</span></div>
    <div class="hint">A rule matches a regular expression against the description,
      ignoring case. Rules run in the order added and the last match wins, so write a
      broad rule first and narrow it with a later one. A few rules also set the type,
      for wording whose meaning the bank has already settled — money going into a term
      deposit is a transfer, not spending.</div>
    <div class="tablewrap" style="margin-bottom:14px"><div class="tcap"><span class="grp">Rules</span>
        <span class="meta">unlabelled income ${money(uncategorised)}</span></div><table class="fixed">
      <colgroup><col style="width:8.5rem"><col><col style="width:5.5rem">
        <col style="width:8rem"><col style="width:5.5rem"></colgroup>
      <!-- Hits counts every row this pattern matches, including rows a later
           rule labels instead. Total is the whole category, which several
           rules can feed. Different scopes, so both are labelled. -->
      <thead><tr><th>Category</th><th>Pattern</th>
        <th class="r" title="Transactions this pattern matches. The last matching rule wins, so a later rule may label some of them instead.">Hits</th>
        <th class="r">Category total</th><th></th></tr></thead>
      <tbody>${rows || '<tr><td colspan="5" class="empty">No rules yet</td></tr>'}</tbody>
    </table></div>
    <div class="panel">
      <h3>Add a rule</h3>
      <p>For example category <code>family</code> matching
         <code>INTL PAYMENT FROM (FIRST NAME|SECOND NAME)</code>.</p>
      <form class="holding" id="ruleForm" style="grid-template-columns:1fr 3fr auto">
        <div><label>Category</label><input name="category" required placeholder="family"></div>
        <div><label>Pattern</label><input name="pattern" required placeholder="PAYMENT FROM (NAME|OTHER NAME)"></div>
        <div><button class="btn" type="submit">Add</button></div>
      </form>
    </div>`;

  // Hit counts are not in data.json: matching every pattern against every row
  // took most of the export's time, and only this page shows them. They arrive
  // a moment after the table, into the cells still on screen. A failed count
  // leaves the dots; nothing else on the page depends on it.
  request("/api/rules").then(rules => {
    if (state.account !== "rules") return;
    for (const r of rules) {
      const cell = document.querySelector(`#rules [data-hits="${r.id}"]`);
      if (cell) cell.textContent = r.matches;
    }
  }).catch(() => {});

  document.getElementById("ruleForm").onsubmit = async event => {
    event.preventDefault();
    const data = Object.fromEntries(new FormData(event.target));
    // Adding relabels every transaction and takes seconds. Disabled until it
    // ends, so a double click cannot add the rule twice.
    const button = event.target.querySelector("[type=submit]");
    button.disabled = true;
    try {
      await request("/api/rules", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({category: data.category.trim(), pattern: data.pattern.trim()}),
      });
      await reload();
    } catch (e) { alert("Could not add: " + e.message); }
    button.disabled = false;
  };
  document.querySelectorAll("[data-delrule]").forEach(b => b.onclick = async () => {
    const rule = DATA.rules.find(r => r.id === +b.dataset.delrule);
    if (!confirm(`Remove the rule labelling "${rule.pattern}" as ${rule.category}? `
                 + "Its transactions are relabelled by the rules that remain.")) return;
    try {
      await request("/api/rules/" + b.dataset.delrule, {method: "DELETE"});
      await reload();
    } catch (e) { alert("Could not remove: " + e.message); }
  });
}

// data.json in, with the rows split by the what-if tag. Every view reads
// DATA.transactions, which render() sets from the toggle. DATA.real is for the
// figures that must never include a plan: the counts in the sidebar and the
// page header, and what the statements say about term deposits.
function takeData(fresh) {
  DATA = Object.assign(DATA || {}, fresh);
  DATA.holdings = DATA.holdings || [];
  DATA.rules = DATA.rules || [];
  DATA.all = DATA.transactions;
  DATA.real = DATA.all.filter(t => !t.whatif);
}

// Any change to a row, or to the rules, rebuilds the whole export server side.
async function reload() {
  takeData(await request("data.json?t=" + Date.now()));
  render();
}

async function request(url, options) {
  const response = await fetch(url, options);
  if (!response.ok) {
    // The API answers {"error": "..."}. Anything else, like a proxy's page, shows as sent.
    const text = await response.text();
    let message = text;
    try { message = JSON.parse(text).error || text; } catch {}
    throw new Error(message);
  }
  return response.json();
}

async function save(item) {
  try {
    DATA.holdings = await request("/api/holdings", {
      method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(item),
    });
    render();
  } catch (e) { alert("Could not save: " + e.message); }
}

// Quotes too: the result also goes inside attribute values, where a bare " would
// end the value and let the rest of a name or URL parameter add attributes.
const esc = t => String(t).replace(/[<>&"']/g, c =>
  ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;","'":"&#39;"}[c]));

// Where you are and what you have filtered lives in the URL, so a refresh, a
// bookmark or a link opens the same screen instead of All accounts.
const TABS = ["holdings", "investments", "rules", "analysis"];

// The view and drill-down the URL held when last written. Changing either adds
// a history entry, so Back returns to the previous screen instead of leaving
// the app. Anything else (a year, a period, a tick, typing a search) replaces
// the current entry.
let place = null;

function writeUrl() {
  const p = new URLSearchParams();
  p.set("view", state.account);
  // from and to are the range of the view on screen: the analysis period, or an
  // account view's custom range. The other tabs are filtered by neither.
  if (state.account === "analysis") {
    const period = activePeriod();
    if (period) p.set("period", period);
    else {
      if (analysis.from) p.set("from", analysis.from);
      if (analysis.to) p.set("to", analysis.to);
    }
  } else if (!TABS.includes(state.account)) {
    if (state.from || state.to) {
      if (state.from) p.set("from", state.from);
      if (state.to) p.set("to", state.to);
    } else if (state.year !== undefined) p.set("year", state.year === null ? "all" : state.year);
  }
  if (analysis.accounts && analysis.accounts.size !== DATA.accounts.length)
    p.set("accts", [...analysis.accounts].join(","));
  if (analysis.hidden.size) p.set("hide", [...analysis.hidden].join("~"));
  // Hidden what-ifs are the exception, so only that goes in the URL.
  if (!state.whatif) p.set("whatif", "0");
  // Only the analysis view has a drill-down. render() closes it on the others,
  // but after this has run.
  if (analysis.category && state.account === "analysis") p.set("cat", analysis.category);
  if (find.query) { p.set("q", find.query); if (find.table) p.set("qt", find.table); }
  const url = location.pathname + "?" + p;
  const here = p.get("view") + " " + (p.get("cat") || "");
  if (place && place !== here) history.pushState(null, "", url);
  else history.replaceState(null, "", url);
  place = here;
}

// A real calendar day, in the form the date inputs use. "2025-1-1" fails the
// pattern; "2025-13-01" and "2025-02-30" fail the round trip.
const isDay = s => /^\d{4}-\d{2}-\d{2}$/.test(s) && new Date(s).toJSON()?.slice(0, 10) === s;

// `search` defaults to the address bar. applyView passes the new query instead
// of writing it there first, which would overwrite the entry Back returns to.
function readUrl(search = location.search) {
  const p = new URLSearchParams(search);
  const view = p.get("view");
  // An account that no longer exists would break every view, so check first.
  if (TABS.includes(view) || view === "all") state.account = view;
  else if (view && DATA.accounts.some(a => a.id === +view)) state.account = +view;

  const year = p.get("year");
  // An unknown period or a date that is not a real day is ignored, so a bad link
  // opens the default period instead of breaking the page.
  const day = key => isDay(p.get(key)) ? p.get(key) : null;
  // from and to belong to the view the URL names. On an account view a year and
  // a range are alternatives, so the one the URL carries clears the other.
  // Without that, Back from a range to a year would leave both showing.
  if (state.account === "analysis") {
    if (PERIODS.some(x => x.key === p.get("period"))) applyPeriod(p.get("period"));
    else if (day("from") || day("to")) {
      analysis.from = day("from");
      analysis.to = day("to");
      analysis.preset = null;
    }
  } else if (!TABS.includes(state.account)) {
    if (day("from") || day("to")) {
      state.from = day("from");
      state.to = day("to");
      state.year = null;
    } else {
      state.from = state.to = null;
      if (year) state.year = year === "all" ? null : year;
    }
  }
  // These reset when absent, so Back and the agent's "" can close the
  // drill-down, drop a search, bring back every account and category, or
  // show the what-ifs again.
  analysis.accounts = p.has("accts") ? new Set(p.get("accts").split(",").map(Number)) : null;
  analysis.hidden = new Set(p.get("hide") ? p.get("hide").split("~") : []);
  analysis.category = p.get("cat");
  find.query = p.get("q") || "";
  find.table = p.get("qt");
  state.whatif = p.get("whatif") !== "0";
}

// Back and Forward: redraw from the entry the browser moved to. Clearing `place`
// makes the redraw replace that entry. A push would cut off Forward.
window.addEventListener("popstate", () => {
  place = null;
  readUrl();
  render();
});

// ---------- the agent ----------
// Everything it says lands in the bar at the top. The bar is always there, one
// line tall, so a question never needs a click first.
const agent = {session: null, busy: false, queue: [], turn: null, controller: null, stopPending: false};

const agentBox = () => document.getElementById("agent");
const agentLog = () => document.getElementById("agentLog");
const agentInput = () => document.getElementById("agentInput");

// Full screen gives the chat the whole window. It sits one layer above the open
// panel: Esc steps back down to the panel before it closes anything, and
// shutting the panel always leaves full screen too.
function agentFull(on) {
  agentBox().classList.toggle("full", on);
  const button = document.getElementById("agentFull");
  const label = on ? "Exit full screen" : "Full screen";
  button.setAttribute("aria-pressed", on ? "true" : "false");
  button.setAttribute("aria-label", label);
  button.title = label;
  if (on) agentLog().scrollTop = agentLog().scrollHeight;
}

function agentOpen(open) {
  // Nothing said yet means nothing to show: clicking into an empty box should
  // not drop an empty panel over the page.
  const said = agentLog().children.length > 0;
  agentBox().classList.toggle("open", open && said);
  // Full screen is the open panel made bigger; with the panel shut it cannot stay.
  if (!(open && said)) agentFull(false);
  agentInput().placeholder = said && !open ? "Continue chatting…"
                                           : "Ask about your money…";
  if (open && said) agentLog().scrollTop = agentLog().scrollHeight;
}

// The box grows with what you type rather than scrolling a single line away.
function agentGrow() {
  const box = agentInput();
  box.style.height = "auto";
  box.style.height = Math.min(box.scrollHeight, window.innerHeight * 0.4) + "px";
  const send = document.getElementById("agentSend");
  send.hidden = !box.value.trim();
  // Mid-turn, sending does not interrupt: it waits, and the button says so.
  send.textContent = agent.busy ? "Queue" : "Send";
}

function agentTurn(question, queued = false) {
  const turn = document.createElement("div");
  turn.className = "turn";
  turn.innerHTML = `<div class="you${queued ? " queued" : ""}">${esc(question)}${
      queued ? '<span class="tag-queued">queued</span>' : ""}</div>`
    + `<div class="steps"></div><div class="said"></div>`;
  agentLog().append(turn);
  agentOpen(true);
  saveChat();
  return turn;
}

function agentStep(turn, html) {
  const steps = turn.querySelector(".steps");
  steps.insertAdjacentHTML("beforeend", html);
  agentLog().scrollTop = agentLog().scrollHeight;
}

// This app's own tools, in plain words. Any other tool shows by its name, so
// nothing the agent runs is hidden.
const STEP_LABELS = {schema: "reading the schema", run_query: "querying",
                     read_rows: "reading transactions", set_view: "changing the view",
                     propose_change: "drafting a change"};

// Markdown for an answer, drawn the way a terminal would: tables, lists,
// headings, quotes, rules, code blocks, bold, italic, inline code and links, at
// one text size. Every piece of text is escaped before any of these patterns
// turn parts of it back into tags, so nothing the model writes becomes live
// HTML on the page.
function mdInline(text) {
  // Code spans are set aside as <cN> markers first, so a ** inside backticks
  // stays literal. esc() has already turned every < into &lt;, so the model's
  // own text can never contain a marker by accident.
  const codes = [];
  let s = esc(text).replace(/`([^`]+)`/g, (_, code) => `<c${codes.push(code) - 1}>`);
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
       .replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,;:!?]|$)/g, "$1<em>$2</em>")
       .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, label, url) =>
         `<a href="${url}" target="_blank" rel="noopener">${label}</a>`);
  return s.replace(/<c(\d+)>/g, (_, n) => `<code>${codes[n]}</code>`);
}

function md(text) {
  const lines = text.replace(/\r/g, "").split("\n");
  const TABLE_RULE = /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/;
  const LIST = /^(\s*)([-*•+]|\d+[.)])\s+(.*)$/;
  const isTable = i => lines[i].includes("|") && i + 1 < lines.length && TABLE_RULE.test(lines[i + 1]);
  const startsBlock = i => /^\s*(```|#{1,6}\s|>)/.test(lines[i]) || LIST.test(lines[i]) || isTable(i);
  const cells = line => line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(c => c.trim());
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }

    if (/^\s*```/.test(line)) {
      const body = [];
      for (i++; i < lines.length && !/^\s*```/.test(lines[i]); i++) body.push(lines[i]);
      i++;
      out.push(`<pre class="md-code">${esc(body.join("\n"))}</pre>`);
    } else if (isTable(i)) {
      const head = cells(line);
      const align = cells(lines[i + 1]).map(c =>
        c.endsWith(":") ? (c.startsWith(":") ? "center" : "right") : "left");
      const rows = [];
      for (i += 2; i < lines.length && lines[i].includes("|"); i++) rows.push(cells(lines[i]));
      const cell = (tag, value, k) =>
        `<${tag} style="text-align:${align[k] || "left"}">${mdInline(value || "")}</${tag}>`;
      out.push(`<div class="md-table"><table><thead><tr>${head.map((c, k) => cell("th", c, k)).join("")}`
        + `</tr></thead><tbody>${rows.map(r => `<tr>${head.map((_, k) => cell("td", r[k], k)).join("")}</tr>`)
        .join("")}</tbody></table></div>`);
    } else if (/^\s*#{1,6}\s+/.test(line)) {
      out.push(`<div class="md-h">${mdInline(line.replace(/^\s*#{1,6}\s+/, ""))}</div>`);
      i++;
    } else if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) {
      out.push(`<hr class="md-hr">`);
      i++;
    } else if (/^\s*>/.test(line)) {
      const body = [];
      for (; i < lines.length && /^\s*>/.test(lines[i]); i++) body.push(mdInline(lines[i].replace(/^\s*>\s?/, "")));
      out.push(`<div class="md-quote">${body.join("<br>")}</div>`);
    } else if (LIST.test(line)) {
      const items = [];
      for (; i < lines.length && LIST.test(lines[i]); i++) {
        const [, indent, marker, content] = lines[i].match(LIST);
        const level = Math.floor(indent.replace(/\t/g, "  ").length / 2);
        items.push(`<div class="md-li" style="--level:${level}"><span class="md-mark">${
          /\d/.test(marker) ? esc(marker.replace(")", ".")) : "•"}</span><span>${mdInline(content)}</span></div>`);
      }
      out.push(`<div class="md-list">${items.join("")}</div>`);
    } else {
      const para = [line];
      for (i++; i < lines.length && lines[i].trim() && !startsBlock(i); i++) para.push(lines[i]);
      out.push(`<p>${para.map(mdInline).join("<br>")}</p>`);
    }
  }
  return out.join("");
}

const VIEW_NAMES = {all: "all accounts", analysis: "spending analysis",
                    holdings: "term deposits", investments: "investments",
                    rules: "rules"};

// "showing you spending analysis · last 12 months · 8 of 41 categories", not
// every parameter spelled out. Hiding 33 categories used to print all 33 names.
// The parameters pick which parts to mention; the words come from the page once
// it has applied them, so a value it ignored is never reported as shown.
function describeView(params) {
  const parts = [];
  if ("view" in params) parts.push(VIEW_NAMES[state.account] || labelOf(state.account));
  // Only a ledger has years and ranges, and by now it has settled a period.
  if (!TABS.includes(state.account) && ("view" in params || "year" in params || "from" in params || "to" in params))
    parts.push(periodLabel());
  if (state.account === "analysis" && ("view" in params || "period" in params || "from" in params || "to" in params)) {
    const preset = PERIODS.find(p => p.key === activePeriod());
    if (preset) parts.push({ytd: "this year", all: "all time"}[preset.key] || "last " + preset.label);
    else if (analysis.from || analysis.to)
      parts.push(`${analysis.from || "the start"} to ${analysis.to || "now"}`);
  }
  if (state.account === "analysis" && "hide" in params) {
    const names = tally(analysisRows()).map(([name]) => name);
    parts.push(`${names.filter(n => !analysis.hidden.has(n)).length} of ${names.length} categories`);
  }
  if ("cat" in params && analysis.category) parts.push(`${analysis.category} in detail`);
  if ("q" in params && find.query) parts.push(`search “${find.query}”`);
  if ("whatif" in params) parts.push(state.whatif ? "what-ifs shown" : "what-ifs hidden");
  return parts.join(" · ") || "a different view";
}

// Chat events, one per line of the stream.
function agentEvent(turn, event) {
  const said = turn.querySelector(".said");
  if (event.type === "text") {
    // Each event is a whole block of text. Separate blocks are separate
    // thoughts — one before a query, one after — so each becomes a paragraph.
    said.dataset.raw = said.dataset.raw ? said.dataset.raw + "\n\n" + event.text : event.text;
    said.innerHTML = md(said.dataset.raw);
  } else if (event.type === "tool") {
    const label = STEP_LABELS[event.name] || "used " + event.name;
    agentStep(turn, `<div class="step" data-tool="${esc(event.name)}">· ${esc(label)}</div>`);
  } else if (event.type === "query") {
    // Replace the "querying" line with the query itself, there to be checked.
    const pending = turn.querySelector('.step[data-tool="run_query"]');
    const html = `<details class="work"><summary>· ${esc(event.purpose || "query")}
        — ${event.rows.toLocaleString()} rows</summary><pre>${esc(event.sql)}</pre></details>`;
    pending ? pending.outerHTML = html : agentStep(turn, html);
  } else if (event.type === "read") {
    const pending = turn.querySelector('.step[data-tool="read_rows"]');
    const html = `<div class="step">· read ${event.rows} of ${event.of.toLocaleString()} rows</div>`;
    pending ? pending.outerHTML = html : agentStep(turn, html);
  } else if (event.type === "view") {
    applyView(event.params);
    // One readable line in place of "changing the view", not a second line.
    const pending = turn.querySelector('.step[data-tool="set_view"]');
    const html = `<div class="step">· showing you ${esc(describeView(event.params))}</div>`;
    pending ? pending.outerHTML = html : agentStep(turn, html);
  } else if (event.type === "proposal") {
    said.insertAdjacentHTML("afterend", `<div class="propose" data-sql="${esc(event.sql)}">
      <h4>${esc(event.title)}</h4><p>${esc(event.why)}</p>
      <details class="work"><summary>· what it runs</summary><pre>${esc(event.sql)}</pre></details>
      <button class="btn apply-change" type="button">Apply</button>
      <button class="btn ghost dismiss-change" type="button">Dismiss</button></div>`);
  } else if (event.type === "turn") {
    agent.turn = event.id;
    if (agent.stopPending) agentStop();     // Stop was pressed before the id came
  } else if (event.type === "session") {
    agent.session = event.id;
  } else if (event.type === "done") {
    if (event.session) agent.session = event.session;
    if (event.stopped) {
      turn.insertAdjacentHTML("beforeend", `<div class="agent-note">· stopped</div>`);
    } else if (event.error) {
      turn.insertAdjacentHTML("beforeend",
        `<div class="agent-err">${esc(event.message || "That did not go through.")}</div>`);
    }
    saveChat();
  }
  agentLog().scrollTop = agentLog().scrollHeight;
}

// The agent drives the page the same way you do: by setting URL parameters and
// re-reading them. Nothing else needs to know the agent exists.
// "" clears a parameter. A period and a from/to range are alternatives, so
// setting one drops the other: a period left behind would win over the range.
// A year and a range are alternatives the same way on an account view.
// The agent's search names no table, so any old qt goes with it.
function applyView(params) {
  const url = new URLSearchParams(location.search);
  // from and to mean a different range on each view, so crossing between the
  // spending analysis and a ledger drops them. Without this, moving from an
  // account's range to the analysis handed that range over as its period. One
  // ledger to another keeps it: the range means the same thing on both.
  const crossing = params.view === "analysis" || state.account === "analysis";
  if ("view" in params && crossing && !("from" in params) && !("to" in params) && !("period" in params)) {
    url.delete("from");
    url.delete("to");
  }
  for (const [key, value] of Object.entries(params)) {
    if (value === "") { url.delete(key); continue; }
    if (key === "period" || key === "year") { url.delete("from"); url.delete("to"); }
    if (key === "from" || key === "to") { url.delete("period"); url.delete("year"); }
    if (key === "q") url.delete("qt");
    url.set(key, value);
  }
  readUrl("?" + url);
  render();
}

// Thinking means a model call or a tool is actually in flight. The moment the
// agent hands back — with an answer, or with a question for you — it stops.
function agentThinking(on) {
  agentLog().setAttribute("aria-busy", on ? "true" : "false");
  document.getElementById("agentSpin").hidden = !on;
  document.getElementById("agentStop").hidden = !on;
  agentGrow();
}

// Asking while a turn is running does not interrupt it. The question joins a
// queue, shows as queued, and goes out the moment the current turn ends.
async function agentAsk(question, turn = null) {
  if (!question.trim()) return;
  if (agent.busy) {
    agent.queue.push({question, turn: agentTurn(question, true)});
    return;
  }
  agent.busy = true;
  if (turn) {
    turn.querySelector(".you").classList.remove("queued");
    turn.querySelector(".tag-queued")?.remove();
  } else {
    turn = agentTurn(question);
  }
  agent.turn = null;
  agent.stopPending = false;
  agent.controller = new AbortController();
  agentThinking(true);
  try {
    const response = await fetch("/api/chat", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message: question, session: agent.session}),
      signal: agent.controller.signal,
    });
    // An error page is not an event stream. Read as one, the turn ended with
    // nothing said and no error.
    if (!response.ok) throw new Error("The server answered " + response.status + " " + response.statusText);
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});
      // Server-sent events: one JSON object per "data:" line, blank line between.
      const parts = buffer.split("\n\n");
      buffer = parts.pop();
      for (const part of parts) {
        const line = part.replace(/^data: /, "").trim();
        if (line) agentEvent(turn, JSON.parse(line));
      }
    }
  } catch (error) {
    agentEvent(turn, error.name === "AbortError"
      ? {type: "done", stopped: true}
      : {type: "done", error: true, message: error.message});
  } finally {
    // finally, not after the try: a dropped connection must still stop the
    // spinner, or it turns forever on a turn that is never coming back.
    agent.busy = false;
    agent.controller = null;
    agent.turn = null;
    agentThinking(false);
    const next = agent.queue.shift();
    if (next) agentAsk(next.question, next.turn);
  }
}

// Stop ends the turn in two places at once. The server cancels the model call,
// which terminates the claude process rather than leaving it running on your
// quota; aborting the request stops the page waiting for it. Anything queued
// behind it still goes out next, as it would in Claude Code.
// The server can only cancel a turn it has named. Pressed before the id
// arrives, Stop waits for it, because dropping the request then would leave the
// model working unseen.
function agentStop() {
  if (!agent.turn) {
    agent.stopPending = true;
    return;
  }
  fetch("/api/stop", {method: "POST", headers: {"Content-Type": "application/json"},
                      body: JSON.stringify({turn: agent.turn})}).catch(() => {});
  if (agent.controller) agent.controller.abort();
}

// The conversation outlives a refresh. What is kept is the log exactly as it was
// drawn, plus the session id, so a reload shows what you saw and the next
// question carries on in the same session. Questions still sitting in the queue
// are dropped: the reload cancelled them, and they would never be sent.
const CHAT_KEY = "finance-book.chat";

function saveChat() {
  try {
    const turns = [...agentLog().children].filter(t => !t.querySelector(".you.queued"));
    localStorage.setItem(CHAT_KEY, JSON.stringify({
      session: agent.session,
      html: turns.slice(-60).map(t => t.outerHTML).join(""),   // bounded; the oldest go first
    }));
  } catch {
    // A private window or full storage. The chat still works; it just won't survive a reload.
  }
}

function restoreChat() {
  try {
    const saved = JSON.parse(localStorage.getItem(CHAT_KEY) || "null");
    if (!saved) return;
    agent.session = saved.session || null;
    agentLog().innerHTML = saved.html || "";
    agentOpen(false);                     // collapsed, reading "Continue chatting…"
  } catch {
    // Unreadable: start clean rather than break the bar. Storage can be blocked
    // outright, and then clearing it throws too.
    try { localStorage.removeItem(CHAT_KEY); } catch {}
  }
}

function wireAgent() {
  const box = agentInput();
  const form = document.getElementById("agentForm");
  restoreChat();
  // Catches a refresh in the middle of an answer, not just between turns.
  window.addEventListener("beforeunload", saveChat);
  box.addEventListener("input", agentGrow);
  box.addEventListener("focus", () => agentOpen(true));
  box.addEventListener("keydown", event => {
    // Enter sends. Shift+Enter is a new line, and the box grows to fit it. An
    // Enter that confirms a word in an input method, as for Chinese, does not send.
    if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
      event.preventDefault();
      form.requestSubmit();
    }
  });
  form.onsubmit = event => {
    event.preventDefault();
    const question = box.value;
    box.value = "";
    agentGrow();
    agentAsk(question);
  };
  // Cmd+K from anywhere, including from inside another input. The browser binds
  // Cmd+K to its own address bar, so that has to be suppressed. The caret goes
  // to the end rather than selecting, so a half-typed question survives.
  document.addEventListener("keydown", event => {
    if ((event.key || "").toLowerCase() !== "k" || !(event.metaKey || event.ctrlKey)) return;
    event.preventDefault();
    box.focus();
    box.setSelectionRange(box.value.length, box.value.length);
  });
  document.getElementById("agentStop").onclick = agentStop;
  document.getElementById("agentFull").onclick = () =>
    agentFull(!agentBox().classList.contains("full"));
  // Over the chat, the wheel scrolls the conversation or the box you are typing
  // in — never the page behind. When either reaches its end the scroll stops
  // there instead of carrying on into the tables underneath.
  agentBox().addEventListener("wheel", event => {
    if (!event.deltaY) return;                      // sideways, e.g. a wide query
    const scroller = [agentLog(), agentInput()].find(el => el.contains(event.target));
    const room = scroller && (event.deltaY < 0
      ? scroller.scrollTop > 0
      : scroller.scrollTop + scroller.clientHeight < scroller.scrollHeight - 1);
    if (!room) event.preventDefault();
  }, {passive: false});
  // Clicking the page puts the answers away; the input stays where it is.
  document.addEventListener("mousedown", event => {
    if (!agentBox().contains(event.target)) agentOpen(false);
  });
  agentLog().addEventListener("click", async event => {
    const panel = event.target.closest(".propose");
    if (!panel) return;
    if (event.target.classList.contains("dismiss-change")) { panel.remove(); return saveChat(); }
    if (!event.target.classList.contains("apply-change")) return;
    const button = event.target;
    button.disabled = true;
    panel.querySelector(".agent-err")?.remove();
    try {
      const response = await fetch("/api/apply", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({sql: panel.dataset.sql}),
      });
      // A body that is not JSON is an error page, such as a crashed server's.
      const answer = await response.json().catch(() => ({error: "the server answered " + response.status}));
      if (answer.error) throw new Error(answer.error);
      panel.innerHTML = `<p>Applied to ${answer.changed} row${answer.changed === 1 ? "" : "s"}.</p>`;
    } catch (error) {
      // A dropped connection or a refused change. Say so, and let Apply be tried again.
      panel.insertAdjacentHTML("beforeend", `<div class="agent-err">Could not apply: ${esc(error.message)}</div>`);
      button.disabled = false;
      return saveChat();
    }
    // The server has rebuilt data.json with the change, so the totals catch up here.
    await reload().catch(() =>
      panel.insertAdjacentHTML("beforeend", "<p>Reload the page to see it in the totals.</p>"));
    saveChat();
  });
}

function render() {
  // The toggle: every view reads DATA.transactions, so hiding the plans is
  // one line here rather than a filter in each of them.
  DATA.transactions = state.whatif ? DATA.all : DATA.real;
  // The category editors' suggestions: every category in use plus the rules'
  // own, so a name a rule knows but no row carries yet is still offered.
  document.getElementById("categories").innerHTML =
    [...new Set([...DATA.all.map(t => t.category), ...DATA.rules.map(r => r.category)])]
      .filter(Boolean).sort().map(c => `<option value="${esc(c)}">`).join("");
  writeUrl();
  renderSidebar();
  const view = TABS.includes(state.account) ? state.account : "ledger";
  for (const id of ["ledger", ...TABS]) {
    document.getElementById(id).hidden = id !== view;
  }
  if (view === "analysis") return renderAnalysis();
  // Leaving the analysis view must take the overlay with it. Nothing else
  // calls renderDrill, so without this it would stay on screen.
  analysis.category = null;
  document.getElementById("drill").hidden = true;
  document.body.classList.remove("locked");
  // These views have no transaction table, so restoreFind drops any search.
  if (view === "holdings") { renderHoldings("term deposit"); return restoreFind(); }
  if (view === "investments") { renderHoldings("investment"); return restoreFind(); }
  if (view === "rules") { renderRules(); return restoreFind(); }
  // Years first: it resolves state.year from undefined to the newest year,
  // and the cards now read that value.
  renderYears();
  renderSummary();
  renderCharts();
  renderTables();
  restoreFind();
  writeUrl();          // again: renderYears has just settled state.year
}

fetch("data.json")
  .then(r => r.ok ? r.json() : Promise.reject(new Error(r.status + " " + r.statusText)))
  .then(d => {
    takeData(d);
    readUrl();          // needs DATA, to check the account in ?view= still exists
    render();
    wireAgent();
  })
  .catch(e => {
    document.querySelector("main").innerHTML =
      `<div class="panel"><h3>Could not load data.json</h3>
       <p>${esc(e.message)}. Run <code>.venv/bin/python serve.py</code> from the project root.</p></div>`;
  });
</script>
</body>
