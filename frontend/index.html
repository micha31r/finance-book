<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Fraunces comes with its soft axis fixed at 100 and its wonky one off: the
     rounded, friendly cut, with nothing to set in the styles. A setting there
     was undone by every `font:` shorthand. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..700,100,0&family=Geist:wght@400..600&family=Geist+Mono:wght@400..500&display=swap">
<title>Finance Book</title>
<!-- No icon. Saying so stops the browser asking for one and logging a 404. -->
<link rel="icon" href="data:,">
<style>
  /* Calm and soft: a very light beige ground, white surfaces, pastel cards,
     a soft serif for titles, the sans for every number, and rounded corners
     everywhere. Light by default, dark when the system is set to dark.

     Colour means something. Blue is what you hold, mint is money in, coral is
     money out, yellow is a what-if or a tip, and pink is the chat. Each
     pastel comes with a dark ink of its own hue for text on it. In the
     transaction tables spending is red and money in green, as on a bank
     statement. Two exceptions: each category gets its own hue, so dozens can
     be told apart, and the sidebar's icon tiles only tell the views apart. */
  :root {
    color-scheme: light;
    --bg: #f7f4ef;          /* ground: a very light beige */
    --panel: #ffffff;       /* surface: tables, charts, forms */
    --soft: #ede9e1;        /* chips, inputs, hover on the ground: a deeper beige */
    --line: #e3dfd8;        /* hairlines: column heads, chart gridlines */
    --rule: #f2f0ec;        /* table row rule */
    --hover: #f9f7f4;       /* row hover on a surface */
    --ink: #191511;
    --ink-dim: #4f4943;     /* secondary text, and any text on --soft */
    --ink-faint: #6c6660;   /* captions and notes; 4.5:1 even on --soft */
    --in: #1e7546;          /* money in */
    --out: var(--ink);      /* money out, outside the transaction tables */
    --move: var(--ink-faint);   /* transfers stay grey */
    --loss: #af3c3a;        /* spending in the tables, and a negative verdict */
    --plan: #915c08;        /* a what-if: a plan you typed in, not a bank row */
    --accent: var(--ink);   /* primary buttons; their text is --bg */
    --focus: #3a75af;
    --neutral: #b4ada4;     /* what has no category: Out bars, Uncategorised; the switch when off */
    --sand: #907c67;        /* the edge of a field while you type in it: a deeper beige, 3:1 */
    --line-chart: #386ca0;  /* the balance and cashflow lines */
    --in-bar: #94b15e;      /* income with no category, in the charts; the --mint green */
    /* The pastels. -ink is the text on each, and -soft a paler fill for the
       pills in the tables and the tip cards. */
    --blue: #b5d5f4;   --blue-ink: #0f253b;
    --mint: #94b15e;   --mint-ink: #1e280b;   --mint-soft: #e4f1d1;
    --coral: #f9b59f;  --coral-ink: #3c180f;  --coral-soft: #ffded3;
    --yellow: #f5df8d; --yellow-ink: #2f2107; --yellow-soft: #fdf1c3;
    --pink: #f6cedf;   --pink-ink: #361927;
    /* The four pastels in a row. It marks the surface where you talk to a
       model rather than read your own books. */
    --spectrum: linear-gradient(90deg, var(--yellow), var(--blue), var(--pink), var(--coral));
    --shadow: 0 1px 2px rgb(45 32 18 / .06), 0 2px 8px rgb(45 32 18 / .04);
    --shadow-pop: 0 4px 12px rgb(45 32 18 / .08), 0 24px 64px rgb(45 32 18 / .16);
    --display: "Fraunces", ui-serif, Georgia, serif;
    --sans: "Geist", ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
    --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --gap: 16px;            /* one spacing step, horizontal and vertical */
    --bar: 0px;             /* the top bar, which only narrow screens have; the page sits below it */
    --side: 248px;          /* the sidebar */
    --radius: 20px;         /* cards, panels, tables */
    --drill-head: 76px;     /* the drill-down's band, which its table heads stick under */
    scrollbar-color: #d2cdc5 transparent;   /* a quiet thumb on a clear track */
  }
  /* The same roles on a warm near-black. The pastels turn into deep tints
     with a light ink, and every text colour still holds 4.5:1. */
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #13100d;
      --panel: #1c1915;
      --soft: #2c2822;
      --line: #37322c;
      --rule: #23201c;
      --hover: #211e19;
      --ink: #f5f1ec;
      --ink-dim: #cfcac1;
      --ink-faint: #a49e94;
      --in: #73ce95;
      --loss: #f07f77;
      --plan: #e5bf6d;
      --focus: #8bbcef;
      --neutral: #59544e;
      --sand: #8a775d;
      --line-chart: #8bbcef;
      --in-bar: #8aa35d;
      --blue: #23374c;   --blue-ink: #d1e7ff;
      --mint: #2f3a1c;   --mint-ink: #ddebc7;   --mint-soft: #29311b;
      --coral: #522c20;  --coral-ink: #ffdacd;  --coral-soft: #44281f;
      --yellow: #45391a; --yellow-ink: #f6e8b3; --yellow-soft: #3c3216;
      --pink: #492a39;   --pink-ink: #fbdae8;
      --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 2px 8px rgb(0 0 0 / .2);
      --shadow-pop: 0 4px 12px rgb(0 0 0 / .4), 0 24px 64px rgb(0 0 0 / .5);
      scrollbar-color: #4a443b transparent;
    }
  }
  * { box-sizing: border-box; }
  /* Anything hidden stays hidden, whatever display a rule gives it. */
  [hidden] { display: none !important; }
  /* The browser's own tick box ticks in the system blue, so every tick in the
     app is drawn here instead. */
  input[type="checkbox"] {
    appearance: none; display: grid; place-content: center; flex: none;
    width: 16px; height: 16px; margin: 0; cursor: pointer;
    border: 1.5px solid var(--ink-faint); border-radius: 5px; background: var(--panel);
  }
  input[type="checkbox"]:checked { background: var(--ink); border-color: var(--ink); }
  /* The tick: the left and bottom borders of a small box, turned 45 degrees. */
  input[type="checkbox"]:checked::before {
    content: ""; width: 8px; height: 4px; margin-top: -2px;
    border: solid var(--bg); border-width: 0 0 2px 2px; transform: rotate(-45deg);
  }
  /* Other browser defaults, which draw in the system blue or a grey of their
     own. */
  ::placeholder { color: var(--ink-faint); }
  ::selection { background: var(--yellow); color: var(--yellow-ink); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  /* Chrome draws the date picker's calendar in its own black or white. The
     same shape cut out of a token colour replaces it. */
  ::-webkit-calendar-picker-indicator {
    cursor: pointer; background: var(--ink-faint);
    mask: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='black' stroke-width='1.5'><rect x='2' y='3' width='12' height='11' rx='2.5'/><path d='M2 7h12M5 1v4M11 1v4'/></svg>") center / 14px no-repeat;
  }
  /* Room above anything scrolled into view by the keyboard, so it does not
     land under the top bar and a stuck table head. The gutter stays when the
     drill-down takes the scrollbar away, so nothing jumps sideways. */
  html { scroll-padding-top: calc(var(--bar) + 100px); scrollbar-gutter: stable; }
  body {
    margin: 0; padding-top: var(--bar); background: var(--bg); color: var(--ink);
    font: 14px/1.55 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  /* Tabular figures, so amounts line up in a column. */
  .num { font-variant-numeric: tabular-nums; }
  .in { color: var(--in); } .out { color: var(--out); } .move { color: var(--move); }
  .caption { font: 600 11px/1.4 var(--sans); color: var(--ink-faint);
             text-transform: uppercase; letter-spacing: .14em; }
  .ink-faint { color: var(--ink-faint); }
  /* Digits inside a serif title: numbers are always in the sans. */
  .digits { font-family: var(--sans); }

  /* The pastel fills. A card, panel, nav icon or report takes one of these
     and paints itself in --tone, writing in --tone-ink. */
  .tone-blue   { --tone: var(--blue);   --tone-ink: var(--blue-ink); }
  .tone-mint   { --tone: var(--mint);   --tone-ink: var(--mint-ink); }
  .tone-coral  { --tone: var(--coral);  --tone-ink: var(--coral-ink); }
  .tone-yellow { --tone: var(--yellow); --tone-ink: var(--yellow-ink); }
  .tone-pink   { --tone: var(--pink);   --tone-ink: var(--pink-ink); }

  /* ---------- top bar ---------- */
  /* Narrow screens only, holding the ☰ and the name. Wide screens put the
     name at the top of the sidebar and keep the page's full height. Solid:
     rows showing through it were noise above a stuck table head. */
  .topbar {
    position: fixed; inset: 0 0 auto 0; z-index: 55; height: var(--bar);
    display: none; align-items: center; gap: 8px; padding: 0 14px 0 8px;
    background: var(--bg);
  }
  .brand { font: 600 21px/1 var(--display); letter-spacing: -0.01em; white-space: nowrap; }
  nav .brand { padding: 14px 12px 24px; }
  .icon-btn {
    display: inline-grid; place-items: center; flex: none; width: 34px; height: 34px;
    padding: 0; border: 0; border-radius: 999px; cursor: pointer;
    background: none; color: var(--ink-dim);
  }
  .icon-btn:hover { background: var(--soft); color: var(--ink); }
  .menu-btn { display: none; }        /* phones only, below */
  /* The way into the chat: a small white pill edged with the pastel
     spectrum, floating in the bottom corner, so it takes no room from the
     page. Above the drill-down, so the chat works there too, and under the
     drawer's scrim. The open panel covers it. */
  .ask {
    position: fixed; right: 20px; bottom: 20px; z-index: 56;
    display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 16px 0 13px;
    border: 1.5px solid transparent; border-radius: 999px; cursor: pointer;
    background: linear-gradient(var(--panel), var(--panel)) padding-box, var(--spectrum) border-box;
    color: var(--ink); font: 500 13.5px var(--sans); box-shadow: var(--shadow-pop);
  }
  .ask .spark { flex: none; color: var(--pink-ink); }
  /* While the agent works the dots show after the word, so a closed panel
     still says an answer is coming. */
  .ask .dots { display: none; }
  .ask.busy .dots { display: inline-flex; }
  /* Three dots rising in turn: the agent is working. */
  .dots { display: inline-flex; align-items: center; gap: 3px; color: var(--ink-faint); }
  .dots i { width: 5px; height: 5px; border-radius: 50%; background: currentColor;
            animation: dot 1.1s ease-in-out infinite; }
  .dots i:nth-child(2) { animation-delay: .15s; }
  .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes dot { 0%, 60%, 100% { opacity: .3; transform: none; }
                   30% { opacity: 1; transform: translateY(-2px); } }

  .layout { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); align-items: start; }

  /* ---------- sidebar ---------- */
  /* Sits straight on the page ground. Fills the window below the top bar,
     so the footer sits on the bottom edge, and scrolls on its own if the
     account list ever outgrows the screen. */
  nav {
    position: sticky; top: var(--bar); height: calc(100vh - var(--bar));
    overflow-y: auto; padding: 8px 12px 16px 16px;
    display: flex; flex-direction: column;
  }
  nav .group { margin-bottom: 18px; flex: none; }
  nav .group > .caption { padding: 0 12px 6px; }
  nav button {
    display: flex; width: 100%; gap: 10px; align-items: center; text-align: left;
    min-height: 36px; padding: 5px 12px; border: 0; border-radius: 12px; cursor: pointer;
    background: none; color: var(--ink-dim); font: 450 13.5px/1.3 var(--sans);
  }
  nav button:hover { background: var(--soft); color: var(--ink); }
  /* The current item is a white pill lifted off the ground. */
  nav button[aria-current="true"] { background: var(--panel); color: var(--ink);
                                    font-weight: 550; box-shadow: var(--shadow); }
  /* The icon tile beside every view that is not a bank account, so the eye
     finds them first. */
  nav .ico {
    display: grid; place-items: center; flex: none; width: 26px; height: 26px; margin-left: -5px;
    border-radius: 8px; background: var(--tone, var(--soft)); color: var(--tone-ink, var(--ink-dim));
  }
  nav button .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  nav button .bal { font-size: 12px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  /* margin-top:auto pins this to the bottom when the account list is short,
     and lets it scroll away with the list when it is long. */
  nav .foot {
    margin-top: auto; padding: 14px 12px 0; display: grid; gap: 10px;
    color: var(--ink-faint); font-size: 12px; line-height: 1.5;
  }
  /* The what-if switch. A line in the footer rather than a sidebar item, so
     it sheds the item styling every other nav button gets. */
  nav .whatif-toggle { width: auto; min-height: 0; padding: 0; gap: 9px; border-radius: 0;
                       font-size: 12.5px; color: var(--ink-dim); }
  nav .whatif-toggle:hover { background: none; color: var(--ink); }
  .switch { position: relative; flex: none; width: 30px; height: 18px; border-radius: 999px;
            background: var(--neutral); transition: background .15s; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px;
                   border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / .25);
                   transition: transform .15s; }
  [aria-checked="true"] > .switch { background: var(--plan); }
  [aria-checked="true"] > .switch::after { transform: translateX(12px); }

  /* ---------- main ---------- */
  main { width: 100%; max-width: 1320px; min-width: 0; justify-self: center; padding: 28px 32px 88px; }
  /* The title, the line under it, and any action on the right. A grid, so
     every view's header lines up whatever it holds. */
  .title { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 16px;
           align-items: end; margin: 4px 0 20px; }
  .title h2 { grid-column: 1; margin: 0; font: 550 34px/1.1 var(--display); letter-spacing: -0.015em; }
  .title .sub { grid-column: 1; margin-top: 6px; color: var(--ink-faint); font-size: 14px; }
  .title .btn { grid-column: 2; grid-row: 1 / span 2; align-self: center; }
  /* What ingest.py said about an upload, tinted by how it went. */
  .report { position: relative; }
  .report .close { position: absolute; top: 12px; right: 12px; }
  .report form { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .report select { height: 38px; padding: 0 12px; font: inherit; color: var(--ink);
                   background: var(--panel); border: 0; border-radius: 12px; }
  .report pre { margin: 0; max-height: 360px; overflow: auto; padding: 12px 14px; border-radius: 12px;
                background: color-mix(in srgb, var(--panel) 60%, transparent);
                font: 12px/1.55 var(--mono); }

  /* The cards: a bento row. The first card is the hero, twice as wide and
     toned; the rest share what is left, wrapping as the page narrows, and a
     card alone on its row stretches across it. */
  .cards { display: flex; flex-wrap: wrap; gap: var(--gap); margin-bottom: var(--gap); }
  .card {
    flex: 1 1 170px; min-width: 0; container-type: inline-size;
    padding: 18px 20px; border-radius: var(--radius);
    background: var(--tone, var(--panel)); color: var(--tone-ink, var(--ink));
  }
  .card.hero { flex: 2 1 360px; padding: 20px 24px; }
  .card .caption, .card .note { color: var(--tone-ink, var(--ink-faint)); }
  /* The figure is the loudest thing on the page, in the sans like every
     number. It scales with the card, so "+$123,456.78" still fits a narrow
     one. */
  .card .v { margin-top: 8px; font: 600 clamp(19px, 11cqi, 28px)/1.15 var(--sans);
             letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .card.hero .v { font-size: clamp(26px, 9cqi, 40px); }
  /* A name rather than a figure, as in "Most spent at". */
  .card .v.text { font: 600 15px/1.35 var(--sans); overflow-wrap: anywhere; }
  .card .note { margin-top: 6px; font-size: 12.5px; }
  /* What the hero is made of, side by side under its figure. */
  .card .parts { display: flex; flex-wrap: wrap; gap: 6px 24px; margin-top: 14px; }
  .card .parts div { display: grid; }
  .card .parts span:first-child { font-size: 11.5px; }
  .card .parts span:last-child { font-size: 14px; font-weight: 550; font-variant-numeric: tabular-nums; }
  /* A card that gives a verdict, Net or a cashflow balance, goes red for a
     loss. A surplus is green like money in, and zero stays grey, like a
     transfer: neither. */
  .card .v.gain { color: var(--in); }
  .card .v.loss { color: var(--loss); }
  .card .v.even { color: var(--move); }

  .panel { background: var(--tone, var(--panel)); color: var(--tone-ink, inherit);
           border-radius: var(--radius); padding: 20px 22px; margin-bottom: var(--gap); min-width: 0; }
  .panel > h3 { margin: 0 0 3px; font: 600 17px/1.3 var(--display); }
  .panel > p { margin: 0 0 14px; font-size: 13px; color: var(--tone-ink, var(--ink-faint)); }
  /* Two panels side by side, one above the other once they would get too
     narrow. The grid's gap is the space between them and its margin the
     space below, so the panels' own margins would only double it. A long
     list makes one panel far taller than the other, which would otherwise
     stretch around empty space to match. */
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
            gap: var(--gap); margin-bottom: var(--gap); align-items: start; }
  .charts > * { min-width: 0; margin-bottom: 0; }
  .chartbox { position: relative; height: 250px; min-width: 0; }
  .chartbox canvas { display: block; max-width: 100%; }

  /* ---------- period controls ---------- */
  /* Above everything they filter: the cards, the charts and the tables. */
  .years, .toolbar { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; }
  .years { margin-bottom: 20px; }
  /* A segmented pill: the choices on a soft track, the current one lifted
     out in white. Where they do not fit on one line they wrap, and the track
     rounds its corners less: a scrolling track hid choices off the edge. */
  .seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border-radius: 20px;
         background: var(--soft); }
  .seg button {
    flex: none; height: 32px; padding: 0 14px; border: 0; border-radius: 999px; cursor: pointer;
    background: none; color: var(--ink-dim); font: 500 13px var(--sans); white-space: nowrap;
  }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-current="true"] { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
  /* A date box: a white pill naming its end, with the input inside drawing
     no box of its own. */
  .field {
    display: inline-flex; align-items: center; gap: 4px; height: 38px; padding: 0 8px 0 14px;
    border-radius: 999px; background: var(--panel); color: var(--ink-faint); font-size: 12.5px;
    cursor: text; box-shadow: var(--shadow);
  }
  .field input { height: 100%; padding: 0 4px; border: 0; background: none; color: var(--ink);
                 font: 500 13px var(--sans); }
  .field input:focus { outline: none; }
  .field:focus-within { box-shadow: inset 0 0 0 1.5px var(--sand), var(--shadow); }
  /* minmax(0, …): a grid column otherwise grows to the period pill's full
     width on a phone, and the account pills run off the screen. */
  .controls { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; margin-bottom: 20px; }
  /* Tick-box pills. A ticked one is lifted out in white. */
  .picker { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .picker > .caption { margin-right: 6px; }
  .picker label {
    display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px 0 10px;
    border-radius: 999px; background: var(--soft); color: var(--ink-dim);
    font-size: 13px; cursor: pointer; user-select: none;
  }
  .picker label:has(input:checked) { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
  .swatch { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }

  /* ---------- tables ---------- */
  .tablewrap { background: var(--panel); border-radius: var(--radius); margin-bottom: var(--gap); }
  /* Below this, Date, Type, Amount and Balance alone need more than the screen
     has, so let the table scroll inside its own box rather than pushing the
     whole page sideways. Only here: making this a scroll container at any
     width would stop the column headers sticking to the top of the page. */
  @media (max-width: 760px) {
    .tablewrap { overflow-x: auto; }
    /* Shared out across a phone screen, the one flexible column (Description,
       Name, Pattern) got no width at all. Keep a usable width and scroll. */
    .tablewrap table { min-width: 44rem; }
  }
  /* Separate borders, no spacing: with collapsed borders the line under a
     sticky head stays where the row was laid out, and a sliver of the rows
     scrolling under it shows through. It also lets a cell round a corner. */
  table { width: 100%; border-collapse: separate; border-spacing: 0; }
  /* A header strip above the table rather than a <caption>: a caption with
     display:flex is laid out outside its own box, leaving an empty band and
     printing its text over the sticky column headers.
     It carries the card's top corners itself. The card cannot clip them,
     because a clipping box would stop the head sticking. */
  .tcap {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    min-height: 56px; padding: 10px 16px; background: var(--panel);
    border-radius: var(--radius) var(--radius) 0 0;
  }
  /* Collapsed, the strip is the whole card. */
  .tcap:has(.fold[aria-expanded="false"]) { border-radius: var(--radius); }
  /* In the sans: most carry a period, "2026" or "26 Aug 2026 to 25 Dec 2026". */
  .tcap .grp { font: 600 14.5px/1.3 var(--sans); }
  /* Sits right after the account name. Quiet until you hover it, because every
     table has one and nine of them shouting would be noise. */
  .findbtn {
    display: inline-grid; place-items: center; width: 30px; height: 30px; padding: 0;
    border: 0; border-radius: 999px; background: none; color: var(--ink-faint); cursor: pointer;
  }
  .findbtn:hover { background: var(--soft); color: var(--ink); }
  /* On All accounts the chevron and the account name are one button, so the
     whole name opens the table, not a 12px arrow. */
  .fold {
    display: inline-flex; align-items: center; gap: 8px; padding: 0;
    border: 0; background: none; cursor: pointer; color: inherit; font: inherit;
  }
  .fold svg { flex: none; color: var(--ink-faint); transition: transform .15s; }
  .fold:hover svg { color: var(--ink); }
  .fold[aria-expanded="true"] svg { transform: rotate(90deg); }
  /* No taller than the buttons beside it, so opening the search does not
     make the strip grow. */
  .tcap .find {
    flex: 1 1 12rem; min-width: 0; max-width: 22rem; height: 30px; padding: 0 12px;
    font: inherit; font-size: 13px; color: var(--ink); background: var(--soft);
    border: 1px solid transparent; border-radius: 999px;
  }
  .tcap .find:focus { outline: none; border-color: var(--sand); }
  /* Chrome's clear button is its own white or blue. This is the same cross in
     a token. */
  .tcap .find::-webkit-search-cancel-button {
    appearance: none; width: 10px; height: 10px; margin-left: 6px; cursor: pointer;
    background: var(--ink-dim);
    mask: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10' stroke='black' stroke-width='1.6' stroke-linecap='round'><path d='M1 1l8 8M9 1L1 9'/></svg>");
  }
  .tcap .meta { margin-left: auto; font-size: 12.5px; color: var(--ink-faint);
                font-variant-numeric: tabular-nums; }
  th {
    text-align: left; font: 600 11px/1.4 var(--sans); text-transform: uppercase; letter-spacing: .1em;
    color: var(--ink-faint); padding: 8px 12px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  /* The whole head sticks: the caption strip with its search and add buttons,
     the add form when it is open, and the column headers. Below the top bar,
     and in the drill-down below its band. Not at 760px and under, where the
     table scrolls in its own box and an offset would push the head down over
     the first row. */
  thead { position: sticky; top: 0; z-index: 2; }
  @media (width > 760px) {
    thead { top: var(--bar); }
    #drill thead { top: var(--drill-head); }
  }
  /* The caption strip is the head's first row, so it sticks with the columns.
     Its cell is a td: a th would print the strip faint, in the column-header
     styling, and read as the header of every cell below. The cell is the
     ground's colour, so what shows past the strip's round corners is the
     page, even with rows scrolling under a stuck head. */
  tr.cap td { padding: 0; border-bottom: 0; background: var(--bg); }
  td { padding: 8px 12px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
  /* One transaction, one row. Date, Type, Amount and Balance each settle at the
     width their own content needs, no narrower, so they never truncate. The
     description takes every pixel that is left.
     Auto layout, not fixed. Fixed layout only divides leftover width evenly
     across the columns, so on a wide window Date was as wide as Description.
     The description cell carries `max-width: 0`, so it asks for nothing while
     the browser measures the other columns, then `width: 100%` claims all the
     slack. Being the only constrained column, it is also the only one that
     truncates; hovering shows the full text. */
  table.rows { table-layout: auto; }
  table.rows td, table.rows th { white-space: nowrap; }
  table.rows td.desc, table.rows th.desc {
    width: 100%; max-width: 0; overflow: hidden; text-overflow: ellipsis;
  }
  /* The type tag always shows; a long category name truncates rather than
     spilling into the Amount column. A what-if tag never does: "what-if ·
     covered" is the whole warning. */
  table.rows td.tags .tag:not(.whatif) { max-width: 8.5rem; overflow: hidden; text-overflow: ellipsis; }
  /* A what-if or a provisional row carries a third tag. Its category gives
     way, so the Type column stays the width it has on every other row. */
  tr.whatif td.tags .tag.cat, tr.provisional td.tags .tag.cat { max-width: 5.5rem; }
  /* The same on the rules page, capped at its fixed-width category column. */
  #rules td .tag { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: var(--hover); }
  /* Drawn inside the row, so a stuck head or a scrolling box cannot cut it off. */
  tr:focus-visible { outline-offset: -2px; }
  /* The last row rounds the card's bottom corners, so a hovered row does not
     paint square ones over them. */
  .tablewrap tbody tr:last-child td:first-child { border-bottom-left-radius: var(--radius); }
  .tablewrap tbody tr:last-child td:last-child { border-bottom-right-radius: var(--radius); }
  td.r, th.r { text-align: right; }
  td.date { white-space: nowrap; color: var(--ink-faint); font-size: 13px; }

  td.amt { white-space: nowrap; font-weight: 550; }
  td.bal { white-space: nowrap; color: var(--ink-faint); font-size: 13px; }
  code {
    font: 12px/1.5 var(--mono);
    background: var(--soft); border-radius: 6px; padding: 2px 6px;
    /* A regex has no spaces to break at, so allow a break anywhere. Without
       this the cell cannot shrink and the other columns get squeezed away. */
    overflow-wrap: anywhere;
  }
  /* Spaces at the end of a pattern change what it matches but draw as nothing,
     so they get a fill. */
  code .trail { white-space: pre; background: var(--ink-faint); }
  /* Fixed layout keeps the narrow columns readable no matter how long the
     pattern is. Widths come from the colgroup on each table. */
  table.fixed { table-layout: fixed; }
  /* One line, the rest on hover. */
  .clip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* A soft pill. Its colours arrive as --tag and --tag-ink, so a category can
     hand over its own pair in a style attribute. */
  .tag {
    display: inline-block; vertical-align: middle; white-space: nowrap;
    padding: 0 9px; border-radius: 999px; font: 500 12px/20px var(--sans);
    background: var(--tag, var(--soft)); color: var(--tag-ink, var(--ink-dim));
  }
  .tag.in { --tag: var(--mint-soft); --tag-ink: var(--mint-ink); }
  .tag.out { --tag: var(--coral-soft); --tag-ink: var(--coral-ink); }
  /* In the transaction tables money reads the way a bank statement does:
     spending red, where the rest of the app leaves money out plain ink.
     The amount and the out figure in the header strip agree. */
  table.rows td.amt.out, .tcap .meta .out { color: var(--loss); }
  /* A provisional row is one the bank has not finalised. It is dimmed, and an
     outlined tag says so; the reason is in the tag's title. */
  tr.provisional td.desc, tr.provisional td.date { color: var(--ink-faint); font-style: italic; }
  .tag.pending { background: none; box-shadow: inset 0 0 0 1px var(--line); color: var(--ink-faint); }
  /* A what-if is a plan you typed in, not a bank row. Its tag is yellow and
     its description is written in the what-if amber, --plan. */
  .tag.whatif { --tag: var(--yellow-soft); --tag-ink: var(--yellow-ink); }
  tr.whatif td.desc { color: var(--plan); }

  /* ---------- editing rows ---------- */
  /* An editor stands in for one cell, or for one tag, and keeps the row's
     height: the negative margin keeps its 22px inside the line the text took,
     so nothing around it moves. */
  .editor {
    height: 22px; margin-block: -2px; padding: 0 6px; font: inherit; font-size: 13px; color: var(--ink);
    background: var(--soft); border: 1px solid transparent; border-radius: 7px;
    vertical-align: middle;
  }
  /* The add form is a row of its own, so its fields can be full size. Its
     what-if tick box keeps the tick box styling. */
  tr.add input:not([type=checkbox]), tr.add select {
    height: 32px; padding: 0 10px; font: inherit; font-size: 13px; color: var(--ink);
    background: var(--soft); border: 1px solid transparent; border-radius: 10px;
  }
  .editor:focus, tr.add input:not([type=checkbox]):focus, tr.add select:focus {
    outline: none; border-color: var(--sand);
  }
  td.desc .editor, td.desc input { width: 100%; }
  td.amt .editor, tr.add [name="amount"] { width: 6rem; text-align: right; }
  tr.add [name="category"] { width: 8rem; }
  /* Dimmed while the server has it. The reload draws the row afresh. */
  td[aria-busy="true"], tr[aria-busy="true"] td { opacity: .5; }
  /* "+ Add" sits in the caption strip beside the search button. The form it
     opens is the head's second row, one cell across the
     table, so it is on screen at any scroll position, and a search, which
     redraws the body only, leaves it alone. The form wraps: one line at
     1440, two below that. Spread over the five columns it squeezed
     Description to 27px at 1024. */
  .tcap .addbtn { color: var(--ink-dim); background: var(--soft); }
  .tcap .addbtn:hover { color: var(--ink); }
  tr.add td { white-space: normal; padding: 10px 16px; border-bottom: 1px solid var(--line);
              background: var(--panel); }
  tr.add .addform { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  tr.add .addform [name="description"] { flex: 1 1 14rem; }
  tr.add .addform label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer;
                          white-space: nowrap; font-size: 13px; height: 32px; }
  .empty { padding: 32px 12px; text-align: center; color: var(--ink-faint); }
  tbody tr.pick { cursor: pointer; }
  /* The name is the part you click to drill in, so only it gets the underline.
     The tick box beside it does something else. */
  tbody tr.pick:hover td:nth-child(2) { text-decoration: underline; text-underline-offset: 3px; }
  td.tick, th.tick { width: 2.4rem; padding-right: 0; }
  /* A category left out of the totals. Still listed, still clickable, just not
     counted. Dimmed rather than hidden, so you can put it back. */
  tr.off td { opacity: .62; }
  tr.off td.tick { opacity: 1; }

  /* ---------- drill-down ---------- */
  /* The category drill-down covers the window below the top bar. The page
     underneath stays rendered, so closing is instant and the scroll position
     survives. */
  #drill {
    position: fixed; inset: var(--bar) 0 0; z-index: 50; background: var(--bg);
    overflow-y: auto; overscroll-behavior: contain;
    scroll-padding-top: calc(var(--drill-head) + 100px);   /* as html's, under the band */
  }
  /* A band in the category's own pastel, which arrives as --tag and --tag-ink.
     Its content lines up with the centred body below it. */
  .drill-head {
    position: sticky; top: 0; z-index: 3; height: var(--drill-head);   /* above the tables' heads (2) */
    display: flex; align-items: center; gap: 14px;
    padding: 0 max(32px, calc((100% - 1320px) / 2 + 32px));
    background: var(--tag, var(--soft)); color: var(--tag-ink, var(--ink));
  }
  .drill-head h2 { margin: 0; font: 600 26px/1.1 var(--display); letter-spacing: -0.01em;
                   display: flex; align-items: center; gap: 10px; }
  .drill-head .sub { font-size: 14px; }
  .drill-close {
    margin-left: auto; flex: none; width: 38px; height: 38px; padding: 0;
    border: 0; border-radius: 999px; background: var(--panel); color: var(--ink-dim);
    font: inherit; font-size: 15px; line-height: 1; cursor: pointer; box-shadow: var(--shadow);
  }
  .drill-close:hover { color: var(--ink); }
  .drill-body { max-width: 1320px; margin: 0 auto; padding: 22px 32px 64px; }
  body.locked { overflow: hidden; }

  /* A span in a table cell, so it needs display: block to take a height. */
  .bar { display: block; height: 8px; border-radius: 999px; background: var(--soft); overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 999px; }
  /* A tip or an explanation: a soft yellow card. */
  .hint { background: var(--yellow-soft); color: var(--yellow-ink); border-radius: var(--radius);
          padding: 16px 20px; margin-bottom: var(--gap); font-size: 13.5px; line-height: 1.6; }
  .hint h3 { margin: 0 0 4px; font: 600 16px/1.3 var(--display); }
  form.holding { display: grid; grid-template-columns: 2fr 1.4fr 1fr 1fr auto; gap: 10px; align-items: end; }
  form.holding.rule-form { grid-template-columns: 1fr 2.4fr auto; }
  @media (max-width: 900px) { form.holding, form.holding.rule-form { grid-template-columns: 1fr 1fr; } }
  form.holding label { display: block; margin-bottom: 6px; }
  /* Fields and buttons in a form row share one height. Left alone, a date
     field and a button each come out a pixel or two off a text field. */
  form.holding input {
    width: 100%; height: 40px; padding: 0 14px; font: inherit; color: var(--ink);
    background: var(--soft); border: 1px solid transparent; border-radius: 12px;
  }
  form.holding input:focus { outline: none; border-color: var(--sand); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 40px; padding: 0 18px; border: 0; border-radius: 999px; cursor: pointer;
    background: var(--accent); color: var(--bg); font: 500 13.5px var(--sans); white-space: nowrap;
  }
  .btn:hover { background: color-mix(in srgb, var(--accent) 84%, var(--bg)); }
  .btn.ghost { background: var(--soft); color: var(--ink-dim); }
  .btn.ghost:hover { color: var(--ink); }
  /* Buttons are only disabled while their request runs. */
  .btn:disabled { opacity: .5; cursor: progress; }
  .rowbtn { background: none; border: 0; border-radius: 999px; cursor: pointer;
            padding: 3px 10px; color: var(--ink-faint); font: 500 12.5px/20px var(--sans); }
  .rowbtn:hover { background: var(--soft); color: var(--ink); }
  /* × on a row entered by hand, in space every date cell reserves, so dates
     line up whether a row has one or not. Inline, pulled back into the
     padding: a positioned cell in the body paints over the sticky head as
     the table scrolls under it. Faded out until the row is hovered or the ×
     itself is focused, so the ledger does not fill with buttons. Opacity,
     not visibility: a hidden button cannot take the focus, so Tab could
     never reach it. After .rowbtn on purpose, so its padding: 0 wins; the
     line height comes from .rowbtn. */
  table.rows td.date, table.rows th.date { padding-left: 34px; }
  .del { display: inline-block; width: 20px; margin: 0 4px 0 -24px; padding: 0;
         text-align: center; opacity: 0; vertical-align: middle; }
  tr:hover .del, .del:focus-visible { opacity: 1; }

  /* ---------- the agent ---------- */
  /* A panel floating over the right of the page. It never pushes the page
     aside: the dashboard stays where it is underneath. Hidden, it cannot
     take the focus. Visibility switches at once on the way in, so the box
     can take the caret straight away, and waits for the fade on the way out.
     It stacks above the drill-down and the top bar, so it works over both. */
  #agent {
    position: fixed; z-index: 60; top: calc(var(--bar) + 14px); right: 14px; bottom: 14px;
    width: min(440px, calc(100vw - 28px));
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--panel); border-radius: 24px; box-shadow: var(--shadow-pop);
    visibility: hidden; opacity: 0; transform: translateX(16px);
    transition: opacity .18s ease, transform .18s ease, visibility 0s .18s;
  }
  #agent.open { visibility: visible; opacity: 1; transform: none;
                transition: opacity .18s ease, transform .18s ease, visibility 0s; }
  /* Full screen: the same chat given the whole window, the conversation kept
     to a readable width down the middle. */
  #agent.full { inset: 8px; width: auto; }
  #agent.full .turn, #agent.full .agent-head, #agent.full #agentForm {
    width: calc(100% - 24px); max-width: 820px; margin-inline: auto;
  }
  /* The spectrum along the top edge. */
  #agent::before { content: ""; position: absolute; inset: 0 0 auto; height: 4px;
                   background: var(--spectrum); }
  .agent-head { flex: none; display: flex; align-items: center; gap: 2px; padding: 16px 12px 8px 22px; }
  .agent-head h2 { margin: 0 auto 0 0; font: 600 18px/1.2 var(--display); }
  #agentFull .shrink, #agent.full #agentFull .grow { display: none; }
  #agent.full #agentFull .shrink { display: block; }
  /* The conversation. A scroll that reaches its end stops there, rather than
     running on into the page behind. */
  #agentLog { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 22px 18px;
              overscroll-behavior: contain; }
  /* Before anything is said, the panel says what the agent can do. */
  #agentLog:empty { display: none; }
  #agentLog:not(:empty) + .agent-empty { display: none; }
  .agent-empty { flex: 1; display: grid; align-content: center; gap: 8px; padding: 24px 36px;
                 text-align: center; color: var(--ink-faint); font-size: 13.5px; }
  .agent-empty strong { font: 600 21px/1.25 var(--display); color: var(--ink); }
  /* The box you type in, with its buttons riding the bottom edge, so they
     stay level with the last line as the box grows. */
  #agentForm { flex: none; display: flex; align-items: flex-end; gap: 8px; margin: 0 12px 12px;
               padding: 4px 4px 4px 16px; border-radius: 22px; background: var(--soft); }
  #agentForm:focus-within { box-shadow: inset 0 0 0 1.5px var(--sand); }
  #agentInput {
    flex: 1; min-width: 0; resize: none; overflow-y: auto;
    max-height: 40vh; padding: 8px 0; border: 0; background: none; overscroll-behavior: contain;
    color: var(--ink); font: inherit; line-height: 1.45;
  }
  #agentInput:focus { outline: none; }
  .agent-controls { flex: none; display: flex; align-items: center; gap: 6px; height: 36px; }
  #agentSpin { margin: 0 6px; }
  #agentSend, #agentStop {
    height: 32px; padding: 0 14px; border: 0; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; font: 500 13px var(--sans);
  }
  #agentSend { background: var(--accent); color: var(--bg); }
  #agentStop { background: var(--panel); color: var(--ink-dim); }
  #agentStop:hover { color: var(--ink); }

  /* One rhythm for the whole conversation: 22px between turns, 10px between
     the parts of a turn, and 3px between the agent's working steps so they
     read as a single block. Your messages are pink bubbles on the right, so
     where one turn begins is visible at a glance. */
  .turn + .turn { margin-top: 22px; }
  .turn .you {
    width: fit-content; max-width: 88%; margin-left: auto; padding: 9px 15px;
    border-radius: 20px 20px 6px 20px; background: var(--pink); color: var(--pink-ink);
    white-space: pre-wrap; line-height: 1.5;
  }
  .turn .you.queued { background: var(--soft); color: var(--ink-dim); }
  .tag-queued { font-size: 11.5px; margin-left: 8px; }
  .turn .steps:not(:empty) { margin-top: 10px; display: grid; gap: 3px; }
  .turn .said:not(:empty) { margin-top: 10px; line-height: 1.6; }
  /* Markdown drawn quietly: headings in bold, structure carried by weight
     and indentation, and every block separated by the same 10px. The agent's
     headings often hold figures, so they stay in the sans. */
  .said > * { margin: 0; }
  .said > * + * { margin-top: 10px; }
  .said strong { font-weight: 600; }
  .said em { font-style: italic; }
  .said a { color: inherit; }
  .said code { font-size: 12.5px; }
  .said .md-h { font: 600 14.5px/1.35 var(--sans); }
  .said .md-list { display: grid; gap: 3px; }
  .said .md-li { display: flex; gap: 8px; padding-left: calc(var(--level, 0) * 18px); }
  .said .md-mark { flex: none; min-width: 1.4ch; color: var(--ink-faint); }
  .said .md-quote { border-left: 3px solid var(--soft); padding-left: 12px; color: var(--ink-dim); }
  .said .md-hr { border: 0; border-top: 1px solid var(--line); }
  .said .md-code { font: 12px/1.55 var(--mono); color: var(--ink-dim); background: var(--soft);
                   padding: 10px 12px; border-radius: 12px; overflow-x: auto; white-space: pre; }
  /* Tables inherit the ledger's rules unless told otherwise: full width, sticky
     uppercase headers, hover fills. None of that belongs in a chat reply. */
  .said .md-table { overflow-x: auto; }
  .said table { width: auto; border-collapse: collapse; }
  /* A chat table's box never scrolls, so a sticky head only sat over its
     first row. */
  .said thead { position: static; }
  .said th, .said td { padding: 4px 16px 4px 0; background: none;
                       font: inherit; font-size: 13px; text-transform: none; letter-spacing: normal;
                       white-space: nowrap; font-variant-numeric: tabular-nums;
                       border-bottom: 1px solid var(--rule); }
  .said th { color: var(--ink-faint); font-weight: 500; border-bottom-color: var(--line); }
  .said th:last-child, .said td:last-child { padding-right: 0; }
  .said tbody tr:hover td { background: none; }
  .work > summary { color: var(--ink-faint); cursor: pointer; list-style: none; font-size: 12.5px; }
  .work > summary::-webkit-details-marker { display: none; }
  .work > summary:hover { color: var(--ink-dim); }
  .work pre { margin: 6px 0 2px; padding: 10px 12px; overflow-x: auto; border-radius: 12px;
              background: var(--soft); font: 11.5px/1.5 var(--mono); color: var(--ink-dim); }
  .step { color: var(--ink-faint); font-size: 12.5px; }
  /* A change the agent wants to make, waiting for your Apply. */
  .propose { margin-top: 12px; padding: 14px 16px; border-radius: 18px;
             background: var(--yellow-soft); color: var(--yellow-ink); }
  .propose h4 { margin: 0 0 4px; font: 600 14px/1.3 var(--sans); }
  .propose p { margin: 0 0 10px; font-size: 13px; }
  .propose .work { margin-bottom: 10px; }
  .propose .work > summary { color: inherit; }
  .propose .work pre { background: color-mix(in srgb, var(--panel) 70%, transparent); color: inherit; }
  .propose .btn { height: 32px; padding: 0 14px; margin-right: 6px; }
  .agent-err, .agent-note { margin-top: 10px; }
  .agent-err { color: var(--loss); font-size: 13px; }
  .agent-note { color: var(--ink-faint); font-size: 12.5px; }

  /* ---------- narrow screens ---------- */
  /* Behind the open drawer: dims the page and takes the tap that closes the
     drawer, so that tap cannot also press whatever lies underneath. */
  .scrim { display: none; }
  /* Below this the sidebar becomes a drawer behind the ☰ button, and the
     tables get the full width: beside a sidebar they spilled out of their
     cards. The script's DRAWER query holds the same width. */
  @media (max-width: 1000px) {
    :root { --bar: 56px; }
    .topbar { display: flex; }
    nav .brand { display: none; }       /* the top bar has it */
    .menu-btn { display: inline-grid; }
    .layout { grid-template-columns: minmax(0, 1fr); }
    nav {
      position: fixed; top: var(--bar); left: 0; bottom: 0; z-index: 58; height: auto;
      width: min(300px, 86vw); padding-top: 14px;
      background: var(--bg); border-radius: 0 24px 24px 0; box-shadow: var(--shadow-pop);
      visibility: hidden; transform: translateX(-104%);
      transition: transform .2s ease, visibility 0s .2s;
    }
    body.nav-open nav { visibility: visible; transform: none; transition: transform .2s ease, visibility 0s; }
    body.nav-open .scrim { display: block; position: fixed; inset: var(--bar) 0 0; z-index: 57;
                           background: rgb(20 21 16 / .2); }
    /* Under the drill-down the layout is inert, drawer included, so the ☰
       that opens it hides. */
    body.locked .menu-btn { visibility: hidden; }
    main { padding: 10px 24px 80px; }
  }
  /* Phones: a view opens on its own content, and the chat takes the screen. */
  @media (max-width: 600px) {
    main { padding: 6px 16px 80px; }
    .title h2 { font-size: 28px; }
    .drill-head { padding: 0 16px; }
    .drill-head h2 { font-size: 21px; }
    .drill-body { padding: 16px 16px 48px; }
    #agent, #agent.full { inset: var(--bar) 8px 8px; width: auto; }
    /* It already fills the screen, so full screen would change nothing. */
    #agentFull { display: none; }
  }
  /* A rule's pattern gets a line of its own. */
  @media (max-width: 520px) {
    .ask { right: 16px; bottom: 16px; }
    .brand { font-size: 18px; }
    .card.hero .v { font-size: 28px; }
    form.holding.rule-form { grid-template-columns: 1fr; }
  }
  /* Whoever asked the system for less motion gets none. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
