<!-- Suggestions for the category editors and the add form. takeData() fills it. -->
<datalist id="categories"></datalist>


<script src="vendor/chart.umd.js"></script>
<script>
// Money is integer cents everywhere, exactly as the database stores it.
// Division by 100 happens only when formatting. One formatter, made once: a
// ledger formats two figures for each of thousands of rows.
const MONEY = new Intl.NumberFormat("en-AU", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const money = (c, sign) => {
  const lead = c < 0 ? "-" : (sign && c > 0 ? "+" : "");
  return lead + "$" + MONEY.format(Math.abs(c) / 100);
};
// Short form for sidebar balances and chart axes. One decimal below $10k so
// neighbouring gridlines cannot collide: rounding to whole thousands printed
// $1,000 and $1,200 both as "$1k", and $1,500 as "$2k".
const compact = c => {
  const v = Math.abs(c) / 100;
  const scale = (n, suffix) => (n >= 10 ? Math.round(n) : Math.round(n * 10) / 10) + suffix;
  // The unit is picked by the rounded figure, so a value that rounds past a
  // unit's ceiling moves up one: $999.50 is "$1k", not "$1000", and $999,500
  // is "$1m", not "$1000k".
  const text = Math.round(v / 1000) >= 1000 ? scale(v / 1e6, "m")
    : Math.round(v) >= 1000 ? scale(v / 1000, "k")
    : String(Math.round(v));
  // No minus on a figure that rounds to zero: -$0.30 read "-$0".
  return (c < 0 && text !== "0" ? "-" : "") + "$" + text;
};
// "1 transaction", not "1 transactions".
const plural = (n, word) => `${n.toLocaleString()} ${word}${n === 1 ? "" : "s"}`;
// Dollars typed by hand to cents, or null when the text is not an amount.
// Commas only where a thousands separator belongs. Stripping them blindly
// turned a typo like "50000,25" into $5,000,025.00 without a word.
function cents(text) {
  const typed = String(text).replace(/[$\s]/g, "");
  if (!/^[-+]?\d{1,3}(,\d{3})*(\.\d{1,2})?$|^[-+]?\d+(\.\d{1,2})?$/.test(typed)) return null;
  return Math.round(Number(typed.replace(/,/g, "")) * 100);
}

const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
// The export stamp is written in UTC. Show it in the reader's own time zone:
// "when did this last run" only means anything in the time you live in.
// The month comes from MONTHS, not from toLocaleDateString, which renders
// September as "Sept" under en-AU and makes the line jump width.
const stamp = iso => {
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const date = `${String(d.getDate()).padStart(2, "0")} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  return date + " at " + d.toLocaleTimeString("en-AU", {hour: "numeric", minute: "2-digit"});
};
const monthOf = date => date.slice(0, 7);
const yearOf  = date => date.slice(0, 4);
// "1 Mar 2026". The month comes from MONTHS for the same reason stamp's does:
// toLocaleDateString writes September as "Sept" under en-AU.
const dayLabel = day => {
  const [y, m, d] = day.split("-");
  return `${+d} ${MONTHS[+m - 1]} ${y}`;
};
const DARK = matchMedia("(prefers-color-scheme: dark)");
// Dozens of categories have to be told apart at a glance, so hues are spread by
// the golden angle over the alphabetical list, DATA.categories. Hashing the
// name collided badly. Uncategorised is neutral: it means "missing", not a
// kind of thing.
const hueOf = name => {
  const i = name && name !== "Uncategorised" ? DATA.categories.indexOf(name) : -1;
  return i < 0 ? null : {i, h: i * 137.508 % 360};
};

// A category's colour in the charts, swatches and bars: a mid pastel, deep
// enough to read on the surface. OKLCH, not HSL, so every hue comes out at
// one lightness; HSL's yellows are far lighter than its blues. Neighbours
// alternate a step in lightness, so two close hues still differ.
function colourFor(name) {
  const hue = hueOf(name);
  if (!hue) return css("--neutral");
  const [even, odd, chroma] = DARK.matches ? [0.68, 0.64, 0.10] : [0.72, 0.68, 0.115];
  return oklch(hue.i % 2 ? odd : even, chroma, hue.h);
}

// A category's pill, and the drill-down's band: a pale fill with a dark ink
// of the same hue, or a deep fill with a light ink in dark mode. The ink
// holds 8:1 on its fill for every hue. Uncategorised gets no style, so it
// takes the neutral pill.
function tagStyle(name) {
  const hue = hueOf(name);
  if (!hue) return "";
  const [fill, ink] = DARK.matches ? [[0.34, 0.05], [0.90, 0.06]] : [[0.92, 0.05], [0.36, 0.08]];
  return `--tag:${oklch(...fill, hue.h)};--tag-ink:${oklch(...ink, hue.h)}`;
}

// An OKLCH colour as #rrggbb, with Björn Ottosson's OKLab matrices. Chart.js
// cannot parse oklch(), and it has to parse a fill to shade it on hover.
function oklch(l, c, h) {
  const a = c * Math.cos(h * Math.PI / 180), b = c * Math.sin(h * Math.PI / 180);
  const L = (l + 0.3963377774 * a + 0.2158037573 * b) ** 3;
  const M = (l - 0.1055613458 * a - 0.0638541728 * b) ** 3;
  const S = (l - 0.0894841775 * a - 1.2914855480 * b) ** 3;
  return "#" + [
    4.0767416621 * L - 3.3077115913 * M + 0.2309699292 * S,
    -1.2684380046 * L + 2.6097574011 * M - 0.3413193965 * S,
    -0.0041960863 * L - 0.7034186147 * M + 1.7076147010 * S,
  ].map(v => {
    v = Math.min(1, Math.max(0, v));     // a hue sRGB cannot show is clipped
    v = v <= 0.0031308 ? 12.92 * v : 1.055 * v ** (1 / 2.4) - 0.055;
    return Math.round(v * 255).toString(16).padStart(2, "0");
  }).join("");
}

const MONTH_LABEL = m => {
  const [y, mm] = m.split("-");
  return MONTHS[+mm - 1] + " " + y.slice(2);
};

// state.year: a "2026" string, null for every year, undefined for not chosen
// yet. Keeping "not chosen" distinct from "all" is what lets the All years
// button stick instead of being overwritten by the default below.
// state.from and state.to are a custom range on an account view, an alternative
// to the year. Setting either sets year to null, so no year button lights up and
// the default newest year cannot come back over the top of the range.
// state.whatif shows the what-if rows, the plans typed in by hand. Off, every
// view reads real rows only.
let DATA, state = {account: "all", year: undefined, from: null, to: null, whatif: true};
const charts = {};

// ---------- selection ----------
const totalOf = kind =>
  DATA.holdings.filter(h => (h.kind || "term deposit") === kind)
    .reduce((n, h) => n + h.balance, 0);

const accountsTotal = () => DATA.accounts.reduce((n, a) => n + (a.balance || 0), 0);

const netWorth = () => accountsTotal() + DATA.holdings.reduce((n, h) => n + h.balance, 0);

const accountsInView = () =>
  state.account === "all" ? DATA.accounts : DATA.accounts.filter(a => a.id === state.account);

// By posting date, which is what the year buttons and the running balances go
// by. Only a From runs to the last transaction; only a To starts at the first.
const rowsFor = (accountId, year, from, to) => DATA.transactions.filter(t =>
  (accountId === "all" || t.account === accountId) && (!year || yearOf(t.date) === year)
  && (!from || t.date >= from) && (!to || t.date <= to));

// The rows an account view is showing: its year, or its custom range.
const viewRows = accountId => rowsFor(accountId, state.year, state.from, state.to);

// The range in words, or "" when there is none. A range open at one end names
// only the day it was given. The other end is the first or last transaction,
// which is not a day worth printing.
const rangeLabel = () =>
  state.from && state.to ? `${dayLabel(state.from)} to ${dayLabel(state.to)}`
  : state.from ? `from ${dayLabel(state.from)}`
  : state.to ? `to ${dayLabel(state.to)}` : "";

// What the cards, the table titles and the agent's line call the period on show.
const periodLabel = () => rangeLabel() || state.year || "all years";

// Income and spending never include transfers. Moving your own money between
// accounts is not earning or spending it, and treating it as either is the
// mistake this whole view exists to avoid.
function totals(rows) {
  let income = 0, spend = 0;
  for (const t of rows) {
    if (t.type === "income") income += t.amount;
    else if (t.type === "expense") spend -= t.amount;
  }
  return {income, spend, net: income - spend, count: rows.length};
}

// Green for a surplus, red for a loss, neither for zero. The Net and End of
// period cards use it.
const tone = n => n > 0 ? "gain" : n < 0 ? "loss" : "even";

// ---------- sidebar ----------
// Line icons for the views, on a 16px grid, each on a small tile.
const ICONS = {
  all: '<rect x="2" y="2" width="5" height="5" rx="1.5"/><rect x="9" y="2" width="5" height="5" rx="1.5"/>'
    + '<rect x="2" y="9" width="5" height="5" rx="1.5"/><rect x="9" y="9" width="5" height="5" rx="1.5"/>',
  analysis: '<path d="M8 2.2a5.8 5.8 0 1 0 5.8 5.8H8z"/><path d="M10.2 1.6a4.6 4.6 0 0 1 4.2 4.2h-4.2z"/>',
  cashflow: '<path d="M1.8 11.5 5.6 7.7l2.8 2.6 5.8-6.1"/><path d="M10.6 4.2h3.6v3.6"/>',
  holdings: '<rect x="2.5" y="7" width="11" height="7" rx="2"/><path d="M5 7V5.2a3 3 0 0 1 6 0V7"/>',
  investments: '<path d="M8 14.2V7.6"/><path d="M8 8.6C8 5.5 6.2 3.8 2.8 3.8c0 3.1 1.9 4.8 5.2 4.8z"/>'
    + '<path d="M8 10.4c0-2.8 1.7-4.4 4.9-4.4 0 2.8-1.7 4.4-4.9 4.4z"/>',
  rules: '<path d="M2.4 8.3V3.2a.8.8 0 0 1 .8-.8h5.1l5.4 5.4-5.9 5.9z"/><circle cx="5.6" cy="5.6" r="1.1"/>',
};
const icon = (key, fill = "") => `<span class="ico${fill && " tone-" + fill}"><svg viewBox="0 0 16 16"
    width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"
    stroke-linecap="round" stroke-linejoin="round">${ICONS[key]}</svg></span>`;

// On narrow screens the sidebar is a drawer behind the ☰ in the top bar,
// over a scrim. Picking a view, Esc, or a tap on the scrim closes it. The
// focus goes into the drawer with it, and back out to ☰ when it closes,
// since a hidden drawer cannot keep it.
function navOpen(open) {
  const nav = document.getElementById("sidebar"), menu = document.getElementById("menuBtn");
  if (open === document.body.classList.contains("nav-open")) return;
  document.body.classList.toggle("nav-open", open);
  menu.setAttribute("aria-expanded", String(open));
  if (open) nav.querySelector('[aria-current="true"]')?.focus();
  else if (nav.contains(document.activeElement)) menu.focus();
}
document.getElementById("menuBtn").onclick = () => navOpen(!document.body.classList.contains("nav-open"));
document.getElementById("scrim").onclick = () => navOpen(false);
// The drawer only exists below this width, the same as the stylesheet's.
// Widening the window past it must not leave the drawer open unseen, where
// it would take the next Esc.
const DRAWER = matchMedia("(max-width: 1000px)");
DRAWER.addEventListener("change", () => navOpen(false));

function renderSidebar() {
  const banks = {};
  for (const a of DATA.accounts) (banks[a.bank] ||= []).push(a);
  const nav = document.getElementById("sidebar");
  // One item. Every item but a bank account carries an icon tile.
  const item = (id, name, bal, ico = "", title = "") => `<button data-id="${id}"
      aria-current="${state.account === id}"${title && ` title="${title}"`}>${ico}
      <span class="name">${esc(name)}</span>${bal === "" ? "" : `<span class="bal">${bal}</span>`}</button>`;
  const group = (caption, items) =>
    `<div class="group">${caption && `<div class="caption">${esc(caption)}</div>`}${items}</div>`;
  const low = freeCash();     // the lowest the projection goes, for the Cashflow item
  const held = kind => totalOf(kind) ? compact(totalOf(kind)) : "add";
  // Real rows only, so the count still matches what the bank has. The plans
  // are counted apart, with the switch that hides them from every view.
  const plans = DATA.all.length - DATA.real.length;

  // All accounts totals the bank accounts listed below it. Term deposits and
  // investments have their own items under Holdings, so they are not counted
  // there too.
  nav.innerHTML = `<div class="brand">Finance Book</div>`
    + group("", item("all", "All accounts", compact(accountsTotal()), icon("all", "blue"))
      + item("analysis", "Spending analysis", "", icon("analysis", "coral"))
      + item("cashflow", "Cashflow", low ? compact(low.amount) : "—", icon("cashflow", "mint"),
             "Free cash: the lowest the projection goes in the period"))
    + Object.entries(banks).map(([bank, list]) => group(bank, list.map(a =>
        item(a.id, a.label, a.balance === null ? "—" : compact(a.balance))).join(""))).join("")
    + group("Holdings", item("holdings", "Term deposits", held("term deposit"), icon("holdings", "yellow"))
      + item("investments", "Investments", held("investment"), icon("investments", "pink")))
    + group("Setup", item("rules", "Rules", DATA.rules.length || "add", icon("rules")))
    + `<div class="foot">
        <div>${DATA.real.length.toLocaleString()} transactions across ${DATA.accounts.length} accounts</div>
        ${plans ? `<button class="whatif-toggle" type="button" role="switch" aria-checked="${state.whatif}">
          <span class="switch" aria-hidden="true"></span>Show ${plural(plans, "what-if")}</button>` : ""}
        <div>Exported ${esc(stamp(DATA.generated_at))}</div>
      </div>`;
  const toggle = nav.querySelector(".whatif-toggle");
  if (toggle) toggle.onclick = () => {
    state.whatif = !state.whatif;
    render();
    // render() rebuilt the sidebar. Focus the new copy of the switch.
    nav.querySelector(".whatif-toggle").focus({preventScroll: true});
  };

  // Only the view buttons: the switch above is a button in the same nav.
  nav.querySelectorAll("button[data-id]").forEach(b => b.onclick = () => {
    const before = state.account;
    // Picked from the drawer, which closes and hands the focus to ☰.
    const fromDrawer = document.body.classList.contains("nav-open");
    state.account = b.dataset.id === "all" || TABS.includes(b.dataset.id) ? b.dataset.id : +b.dataset.id;
    navOpen(false);
    // The chosen year or range carries over. renderYears drops a year the new
    // account has no rows for.
    render();
    // A new view opens at its top, not partway down the last one's table.
    if (state.account !== before) window.scrollTo(0, 0);
    // render() rebuilt the sidebar. Focus the new copy of this item, so
    // pressing Enter does not drop keyboard focus back to the page.
    if (!fromDrawer) nav.querySelector(`button[data-id="${b.dataset.id}"]`).focus({preventScroll: true});
  });
}

// ---------- header, cards ----------
function renderSummary() {
  const view = accountsInView();
  // The period on show, not all time: the cards agree with the charts and
  // tables beside them, which obey the year buttons.
  const rows = viewRows(state.account);
  const sum = totals(rows);
  const period = periodLabel();
  const balance = view.reduce((n, a) => n + (a.balance || 0), 0);

  document.getElementById("viewName").innerHTML =
    serifText(state.account === "all" ? "All accounts" : view[0].label);
  document.getElementById("viewSub").textContent =
    state.account === "all"
      ? `${view.length} accounts · ${DATA.real.length.toLocaleString()} transactions`
      : `${view[0].bank} · ${view[0].bsb ? view[0].bsb + "-" : ""}${view[0].number} · ${view[0].count.toLocaleString()} transactions`;

  // On All accounts the first card is net worth, where it can say what it is
  // made of. A single account shows its own balance instead, or a dash when
  // no statement has stated one, as the sidebar does.
  const byKind = Object.entries(KINDS)
    .map(([kind, meta]) => [meta.title, totalOf(kind)])
    .filter(([, total]) => total);
  // Every balance is as at its own latest statement or entry, so the total
  // mixes dates. The oldest one says how far behind it can be.
  const oldest = [...DATA.accounts, ...DATA.holdings].map(x => x.as_at).filter(Boolean).sort()[0];
  const first = state.account === "all"
    ? card("Net worth", money(netWorth()), {fill: "blue", hero: true,
        note: byKind.length ? "" : "across every account",
        parts: byKind.length ? [["In accounts", money(balance)],
                                ...byKind.map(([label, total]) => [label, money(total)])] : [],
        foot: oldest ? "oldest balance as at " + esc(dayLabel(oldest)) : ""})
    : card("Balance", view[0].balance === null ? "—" : money(view[0].balance), {fill: "blue", hero: true,
        note: view[0].as_at ? "as at " + esc(dayLabel(view[0].as_at)) : ""});

  document.getElementById("cards").innerHTML =
    first +
    card("Money in", money(sum.income), {fill: "mint", note: `${period} · excludes transfers`}) +
    card("Money out", money(sum.spend), {fill: "coral", note: `${period} · excludes transfers`}) +
    card("Net", money(sum.net, true), {cls: tone(sum.net), note: `${period} · in minus out`});
  document.getElementById("upload").hidden = state.account !== "all";
}

// One card in a bento row. `fill` paints it a pastel and `hero` makes it
// the wide first card. `cls` is gain, loss or even to colour the figure, or
// text for a name. `parts`
// are [label, figure] pairs shown side by side under it, and `foot` a last
// quiet line.
function card(label, value, {fill = "", hero = false, cls = "", note = "", parts = [], foot = ""} = {}) {
  return `<div class="card${hero ? " hero" : ""}${fill && " tone-" + fill}">
      <div class="caption">${label}</div>
      <div class="v num ${cls}">${value}</div>
      ${note && `<div class="note">${note}</div>`}
      ${parts.length ? `<div class="parts">${parts.map(([name, figure]) =>
        `<div><span>${name}</span><span>${figure}</span></div>`).join("")}</div>` : ""}
      ${foot && `<div class="note">${foot}</div>`}
    </div>`;
}

// ---------- uploading statements ----------
// The files go to ingest.py through the server, all in one run, as the command
// line takes them: a Westpac accounts file checks the exports beside it, and
// transfers pair across every file.
const readUpload = file => new Promise((resolve, reject) => {
  const reader = new FileReader();
  // A data URL is "data:<type>;base64,<data>", and the server wants the data.
  reader.onload = () => resolve({name: file.name, data: reader.result.split(",")[1]});
  reader.onerror = () => reject(reader.error);
  reader.readAsDataURL(file);
});

// The panel under the title, which stays until it is closed. Its pastel says
// how it went: mint loaded, yellow waiting on you, coral failed.
function showPanel(html, fill) {
  const panel = document.getElementById("uploadReport");
  panel.className = "panel report tone-" + fill;
  panel.innerHTML = `<button class="icon-btn close" type="button" aria-label="Close" title="Close">✕</button>${html}`;
  panel.hidden = false;
  panel.querySelector(".close").onclick = () => { panel.hidden = true; };
  return panel;
}

async function upload(files, account = null) {
  const button = document.getElementById("upload");
  button.disabled = true;
  button.textContent = "Loading…";
  try {
    const answer = await request("/api/ingest", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({files: await Promise.all(files.map(readUpload)), account}),
    });
    // The files are in by now, so a failed refresh must not hide the report.
    await reload().catch(e => {
      answer.report += `\n\nThe page could not refresh (${e.message}). Reload it.`;
    });
    showReport(answer, files);
  } catch (e) {
    // A file that could not be read, a refused request, or the server's own
    // error, which says so when the files were saved all the same.
    showPanel(`<h3>Something went wrong</h3><p>${esc(e.message)}</p>`, "coral");
  } finally {
    button.disabled = false;
    button.textContent = "Upload statements";
  }
}

// `status` is ingest.py's exit code: 0 when every file loaded, 4 when all that
// is missing is an ANZ CSV export's account, and anything else when a file did
// not load.
function showReport({status, report}, files) {
  const csvs = files.filter(f => /\.csv$/i.test(f.name));
  const anz = DATA.accounts.filter(a => a.bank === "ANZ");
  const heading = status === 0 ? "Files loaded"
    : status === 4 ? "Which account is this export?" : "Not everything loaded";
  // An ANZ CSV export carries no account number. The one file is sent again
  // with the account picked. Nothing is picked to start with, so a stray click
  // cannot file it under the wrong account. With several files, the page
  // cannot tell which one ingest.py skipped, and one answer for all could.
  const known = "a PDF statement of its account first, so the account is known.";
  const ask = status !== 4 ? ""
    : csvs.length > 1 ? "<p>Upload each ANZ CSV export on its own to choose its account.</p>"
    : !anz.length ? `<p>Load ${known}</p>`
    : `<form><select name="account" required aria-label="Account">
        <option value="">Choose its account</option>${anz.map(a =>
          `<option value="${esc(a.number)}">${esc(a.label)} · ${esc(a.bsb ? a.bsb + "-" : "")}${esc(a.number)}</option>`)
          .join("")}</select><button class="btn" type="submit">Load it</button></form>
      <p>Not listed? Load ${known}</p>`;
  const note = status === 0 ? "The report below is what was checked and written."
    : status === 4 ? "An ANZ CSV export has no account number, and too few of its rows are known to tell."
    : "The report below says which file and why. A file that fails its checks writes nothing."
      + " An ANZ CSV export skipped for its account can be uploaded on its own to choose it.";
  const panel = showPanel(`<h3>${heading}</h3><p>${note}</p>${ask}<pre>${esc(report)}</pre>`,
                          status === 0 ? "mint" : status === 4 ? "yellow" : "coral");
  const form = panel.querySelector("form");
  if (form) form.onsubmit = event => {
    event.preventDefault();
    upload(csvs, form.account.value);
  };
}

function wireUpload() {
  const input = document.getElementById("uploadFiles");
  document.getElementById("upload").onclick = () => input.click();
  input.onchange = () => {
    const files = [...input.files];
    // Cleared, so choosing the same files again still counts as a change.
    input.value = "";
    if (files.length) upload(files);
  };
}

// ---------- charts ----------
function draw(id, config) {
  charts[id]?.destroy();
  charts[id] = new Chart(document.getElementById(id), config);
}

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

// Chart.js ships Helvetica, black gridlines and a black tooltip, none of
// which fit this palette. Set as defaults from the page's tokens, so a chart
// that passes its own `scales`, and so replaces baseOptions' scales whole,
// still matches.
Chart.defaults.font.family = css("--sans");
Chart.defaults.font.size = 11.5;
function chartColours() {
  Chart.defaults.color = css("--ink-faint");      // tick and legend text
  Chart.defaults.borderColor = css("--line");     // gridlines and axis borders
  // A white rounded card, like the rest of the page.
  Object.assign(Chart.defaults.plugins.tooltip, {
    backgroundColor: css("--panel"), borderColor: css("--line"), borderWidth: 1,
    titleColor: css("--ink-faint"), bodyColor: css("--ink"), multiKeyBackground: css("--panel"),
    titleFont: {weight: "500"}, cornerRadius: 12, padding: 10, boxPadding: 4, usePointStyle: true,
  });
}
chartColours();
// Every bar is rounded all round, and never wider than a thumb, so a chart of
// three months does not draw three slabs. A hairline of the surface along
// each top edge keeps stacked pieces apart. Only the top: a border all round
// ate a thin bar down to nothing.
const barStyle = () => ({borderRadius: 6, borderSkipped: false, maxBarThickness: 28,
                         borderColor: css("--panel"), borderWidth: {top: 1.5}});
// Every line is the one blue, with a soft wash under it and a dot only under
// the pointer.
const lineStyle = () => ({borderColor: css("--line-chart"), backgroundColor: css("--line-chart") + "1f",
                          fill: true, borderWidth: 2.5, pointRadius: 0, pointHoverRadius: 5, tension: 0.3});
// The stylesheet follows a switch between light and dark by itself. The
// charts and the category fills take colours from the script, so they are
// set again and the page redrawn. Not while you are typing in the page: a
// redraw rebuilds its forms. The next render, after the save, catches up.
DARK.addEventListener("change", () => {
  chartColours();
  const typing = document.querySelector(
    ":is(main, #drill) :is(input:not([type=checkbox]), textarea, select):focus");
  if (DATA && !typing) render();
});
// Chart.js animates every redraw. Whoever asked the system for less motion
// gets none.
if (matchMedia("(prefers-reduced-motion: reduce)").matches) Chart.defaults.animation = false;

// Money axes step by a dollar at least. A flat line at zero, such as a closed
// account's balance, otherwise got eleven gridlines all reading "$0". Returning
// null drops that tick and its gridline.
const moneyTick = v => v % 100 ? null : compact(v);

function baseOptions(extra = {}) {
  const options = Object.assign({
    responsive: true, maintainAspectRatio: false,
    plugins: {
      legend: {labels: {color: css("--ink-dim"), boxWidth: 8, boxHeight: 8, padding: 14,
                        usePointStyle: true, pointStyle: "circle"}},
      // Math.abs: the flow chart plots spending downwards, which is a drawing
      // decision. Leaking it into the text showed a negative "Out" figure beside a
      // "Money out" card reading the same figure unsigned.
      tooltip: {callbacks: {label: c => `${c.dataset.label}: ${money(Math.abs(c.parsed.y))}`}},
    },
    interaction: {mode: "index", intersect: false},
    scales: {
      x: {grid: {display: false}, ticks: {maxRotation: 0, autoSkipPadding: 16}},
      y: {border: {display: false}, ticks: {callback: moneyTick}},
    },
  }, extra);
  return options;
}

function renderCharts() {
  const rows = viewRows(state.account);
  // Every month from the first row to the last by posting date, so a month
  // with no rows shows as a gap instead of being skipped.
  const months = monthsSpanning(rows, t => t.date);

  // Income is stacked by category so labelled sources read separately.
  const categories = [...new Set(rows.filter(t => t.type === "income")
    .map(t => t.category).filter(Boolean))].sort();
  const perMonth = m => rows.filter(t => monthOf(t.date) === m);
  const incomeSets = [...categories, null].map(name => ({
    label: name || (categories.length ? "Other income" : "In"),
    data: months.map(m => perMonth(m)
      .filter(t => t.type === "income" && (t.category || null) === name)
      .reduce((n, t) => n + t.amount, 0)),
    backgroundColor: name ? colourFor(name) : css("--in-bar"),
    stack: "in", ...barStyle(),
  })).filter(d => d.data.some(v => v));
  draw("flowChart", {
    type: "bar",
    data: {labels: months.map(MONTH_LABEL), datasets: [...incomeSets, {
      label: "Out", stack: "out", ...barStyle(), backgroundColor: css("--neutral"),
      data: months.map(m => -totals(perMonth(m)).spend),
    }]},
    options: baseOptions({scales: {
      x: {stacked: true, grid: {display: false}, ticks: {maxRotation: 0, autoSkipPadding: 16}},
      y: {stacked: true, border: {display: false}, ticks: {callback: moneyTick}},
    }}),
  });

  // Balance at each month end. For a single account that is its own running
  // balance; for "all accounts" it is the sum of every account's last known
  // balance in that month.
  const view = accountsInView();
  const series = months.map(m => {
    let total = 0;
    for (const a of view) {
      const upTo = DATA.transactions.filter(t => t.account === a.id && monthOf(t.date) <= m && t.balance !== null);
      total += upTo.length ? upTo[upTo.length - 1].balance : 0;
    }
    return total;
  });

  // Not "net worth": this is bank accounts only. Term deposits and investments
  // are typed in as a single current balance with no history, so they cannot be
  // plotted. Calling this net worth put the accounts-only total under a card
  // showing the full net worth, on the same screen.
  document.getElementById("balTitle").textContent =
    state.account === "all" ? "In your accounts, over time" : "Balance over time";
  document.getElementById("balNote").textContent =
    state.account === "all"
      ? "Every account's balance at each month end, added up. Term deposits and "
        + "investments are not included: they have no history to plot."
      : "Balance at the end of each month.";
  draw("balChart", {
    type: "line",
    data: {labels: months.map(MONTH_LABEL), datasets: [{
      label: "Balance", data: series, ...lineStyle(),
    }]},
    options: baseOptions({plugins: {legend: {display: false},
      tooltip: {callbacks: {label: c => money(c.parsed.y)}}}}),
  });
}

// ---------- years and table ----------
function renderYears() {
  const rows = rowsFor(state.account, null);
  const years = [...new Set(rows.map(t => yearOf(t.date)))].sort().reverse();
  if (state.year && !years.includes(state.year)) state.year = undefined;
  // Opens on the newest year with bank rows. A plan running to 2031 must not
  // make the page open on a year holding nothing but what-ifs.
  if (state.year === undefined)
    state.year = years.find(y => rows.some(t => !t.whatif && yearOf(t.date) === y)) || years[0] || null;

  const box = document.getElementById("years");
  // Rebuilding this row while a date box has focus sends the caret back to the
  // first segment, so the next digit lands in the wrong one: editing 11/03 to
  // December gave 2 January. While one is being typed in, only move the light.
  const current = y => String(y ? state.year === y : state.year === null && !state.from && !state.to);
  if (box.contains(document.activeElement) && document.activeElement.type === "date") {
    box.querySelectorAll("button").forEach(b => b.setAttribute("aria-current", current(b.dataset.y)));
    return years;
  }
  // All years means no filter at all, so a range showing takes the light off it.
  box.innerHTML = `<div class="seg" role="group" aria-label="Year">${years.map(y =>
      `<button data-y="${y}" aria-current="${current(y)}">${y}</button>`).join("")}`
    + `<button data-y="" aria-current="${current("")}">All years</button></div>`
    + `<label class="field">From <input type="date" class="range-from" aria-label="From" value="${state.from || ""}"></label>`
    + `<label class="field">To <input type="date" class="range-to" aria-label="To" value="${state.to || ""}"></label>`;
  box.querySelectorAll("button").forEach(b => b.onclick = () => {
    // A year replaces the range, and All years clears both.
    state.year = b.dataset.y || null;
    state.from = state.to = null;
    render();
    // render() rebuilt these buttons. Focus the new copy of this one.
    box.querySelector(`button[data-y="${b.dataset.y}"]`).focus();
  });
  // A date input fires `change` as each segment is completed, so typing 2026
  // into the year arrives as 0002, 0020, 0202 and only then 2026. The year also
  // takes six digits, so 20260925 typed straight in becomes the year 260925.
  // Only a real day counts; anything else leaves the page as it is.
  box.querySelectorAll("input").forEach(input => input.onchange = () => {
    if (input.value && !isDay(input.value)) return;
    state[input.classList.contains("range-from") ? "from" : "to"] = input.value || null;
    state.year = null;          // a typed date is not a year; see state above
    render();
  });
  return years;
}

const labelOf = id => (DATA.accounts.find(a => a.id === id) || {}).label || "";

const SEARCH_ICON = `<svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
  <circle cx="7" cy="7" r="4.4" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <path d="M10.6 10.6 14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
</svg>`;
// Points right when the table is collapsed, and turns down when it is open.
const CHEVRON = `<svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
  <path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.6"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>`;

// Everything about a row that is worth searching, in one lowercase string.
// Dates go in as stored, "2026-09-16": a month's name would match every row
// of that month, so "may" could not find Mayfield. Commas come out so "1234"
// finds "-$1,234.56"; the amount goes in both
// formatted and plain so "-1234.56" and "1234.56" both land. The running
// balance stays out, or "50.00" would also find every row that left $50.00 in
// the account, and count it in the caption totals. "what-if" finds the plans.
const haystack = t => t._find || (t._find = [
  t.date, t.spent_on || "", t.description, t.category || "", t.type,
  money(t.amount), (t.amount / 100).toFixed(2), labelOf(t.account),
  t.whatif ? "what-if" : "",
].join(" ").toLowerCase().replace(/,/g, ""));

// Substring, anywhere, in any order. Typing "coles" finds it mid-description;
// typing "coles 2024" finds Coles rows from 2024 without caring which comes
// first in the row. Every word has to appear somewhere, so adding a word always
// narrows the result.
function searchRows(rows, query) {
  const terms = query.toLowerCase().replace(/,/g, "").split(/\s+/).filter(Boolean);
  if (!terms.length) return rows;
  return rows.filter(t => {
    const hay = haystack(t);
    return terms.every(term => hay.includes(term));
  });
}

// Every table on screen, so a search box can rebuild its own rows without
// re-rendering the page and taking the focus out of the box you are typing in.
// Keyed by account id, or "drill" for the drill-down, not by title: two
// accounts can share a label, and a title changes with the year.
const tables = new Map();       // key -> {rows, opts}

// Which account tables on All accounts are open, by account id. They start
// collapsed, since a full ledger for every account is a long scroll to find
// one, and the ones you open stay open across a refresh. Saved in this browser
// only.
const OPEN_KEY = "finance-book.open";
let openTables;
try { openTables = new Set(JSON.parse(localStorage.getItem(OPEN_KEY) || "[]")); }
catch { openTables = new Set(); }

function setOpen(wrap, open) {
  wrap.querySelector(".fold").setAttribute("aria-expanded", String(open));
  // The head stays: it holds the name, the search and the add button.
  wrap.querySelector("tbody").hidden = !open;
  wrap.querySelector("tr.cols").hidden = !open;
  // A search or an open add form cannot run in a table you cannot see.
  if (!open && !wrap.querySelector(".find").hidden) closeFind(wrap);
  const adding = wrap.querySelector("tr.add:not([hidden])");
  if (!open && adding) closeAdd(adding, false);
  // A table drawn collapsed has no rows yet. Its first opening builds them.
  const tbody = wrap.querySelector("tbody");
  if (open && !tbody.children.length) {
    const {rows, opts} = tables.get(wrap.dataset.table);
    tbody.innerHTML = tableBody(rows, opts);
  }
  openTables[open ? "add" : "delete"](wrap.dataset.table);
  try { localStorage.setItem(OPEN_KEY, JSON.stringify([...openTables])); } catch {}
}

// Searching a collapsed table opens it first. A table that cannot collapse is
// left alone.
const unfold = wrap => { if (wrap.querySelector(".fold")) setOpen(wrap, true); };

function tableBody(rows, {column, hideCategory}) {
  // The drill-down, the table with an account column, picks its rows by the day
  // the money was spent, so it shows and sorts by that day too. A ledger keeps
  // the bank's posting date, which orders the statement and its balance.
  const day = column === "account" ? spentOn : t => t.date;
  // Newest first. Reversing alone was not enough: data.json is grouped by
  // account and only sorted by date within a group, so a set spanning accounts,
  // as every category drill-down does, came out in backwards account blocks.
  // Reverse first, then a stable sort by date, so within one day the later
  // transaction still comes first.
  return rows.slice().reverse()
    .sort((a, b) => day(b).localeCompare(day(a))).map(t => {
    const cls = t.type === "income" ? "in" : t.type === "expense" ? "out" : "move";
    const last = column === "account"
      ? `<td class="bal">${esc(labelOf(t.account))}</td>`
      : `<td class="r bal num">${t.balance === null ? "" : money(t.balance)}</td>`;
    // data-edit names the field a double-click on the cell edits. Only a row
    // entered by hand can have its date or amount changed, or be deleted: a
    // bank row is the bank's, so those two cells carry no data-edit on it.
    // The type tag names its own field, since it shares the cell with the
    // category. The row's id and series size sit on the <tr>, which takes the
    // keyboard focus so Enter can open an editor too.
    return `<tr class="${t.whatif ? "whatif" : t.provisional ? "provisional" : ""}" data-id="${t.id}"
        data-series="${t.series || 0}" tabindex="0">
      <td class="date num"${t.manual ? ' data-edit="date"' : ""}>${t.manual
          ? '<button class="rowbtn del" type="button" aria-label="Delete this row" title="Delete">×</button>' : ""}${dayLabel(day(t))}</td>
      <td class="desc" data-edit="description" title="${esc(t.description)}">${esc(t.description)}</td>
      <td class="tags" data-edit="category">${t.whatif
          ? `<span class="tag whatif" title="${t.covered
              ? "The bank's rows now cover this day. Delete this what-if if it happened, or it is counted twice."
              : "A plan you entered. The bank has no such row."}">what-if${t.covered ? " · covered" : ""}</span> `
          : t.covered
          ? `<span class="tag whatif" title="The bank's rows now cover this day. Delete this row if the bank lists it, or it is counted twice.">covered</span> `
          : t.provisional
          ? `<span class="tag pending" title="The bank has not confirmed this row yet, so it may still change.">provisional</span> `
          : ""}<span class="tag ${cls}" data-edit="type">${esc(t.type)}</span>${t.category && !hideCategory
          ? ` <span class="tag cat" title="${esc(t.category)}" style="${tagStyle(t.category)}">${esc(t.category)}</span>` : ""}</td>
      <td class="r amt num ${cls}"${t.manual ? ' data-edit="amount"' : ""}>${money(t.amount, true)}</td>
      ${last}
    </tr>`;
  }).join("") || '<tr><td colspan="5" class="empty">No transactions</td></tr>';
}

function tableMeta(rows) {
  const sum = totals(rows);
  return `<span class="in">in ${money(sum.income)}</span> ·
    <span class="out">out ${money(sum.spend)}</span> ·
    ${plural(sum.count, "row")}`;
}

// One transaction table, used by the account ledger and by the category
// drill-down. They differ only in the last column: a ledger wants the running
// balance, a category spanning several accounts wants to say which account.
// `key` names the table for searching: the account id, or "drill" if not given.
// `fold` is true or false for a table that can collapse, open or collapsed,
// and left out for one that cannot. A collapsed table gets no rows: setOpen
// builds them when it opens, so All accounts only draws what is on screen.
// `add` puts "+ Add" in the caption and an add form row in the head.
function transactionTable(title, rows, {column = "balance", hideCategory = false, key = "drill", fold, add = false} = {}) {
  const opts = {column, hideCategory};
  tables.set(String(key), {rows, opts});

  // The caption strip is the head's first row and the add form its second, so
  // both stick with the column headers at any scroll position.
  return `<div class="tablewrap" data-table="${key}"><table class="rows">
    <thead>
    <tr class="cap"><td colspan="5"><div class="tcap">
      ${fold === undefined ? `<span class="grp">${esc(title)}</span>`
        : `<button class="fold" aria-expanded="${fold}">${CHEVRON}<span class="grp">${esc(title)}</span></button>`}
      <button class="findbtn" aria-label="Search these transactions"
              title="Search these transactions">${SEARCH_ICON}</button>
      <input class="find" type="search" placeholder="Search…" hidden
             aria-label="Search these transactions">
      ${add ? '<button class="rowbtn addbtn" type="button" title="Add a transaction or a what-if">+ Add</button>' : ""}
      <span class="meta">${tableMeta(rows)}</span>
    </div></td></tr>
    ${add ? '<tr class="add" hidden></tr>' : ""}
    <!-- Only Description is sized, and it is sized to absorb the slack. Every
         other column is left alone so it sits at its own content width. -->
    <tr class="cols"${fold === false ? " hidden" : ""}>
      <th class="date">Date</th><th class="desc">Description</th><th class="tags">Type</th>
      <th class="amt r">Amount</th>
      ${column === "account"
        ? '<th class="acct">Account</th>'
        : '<th class="bal r">Balance</th>'}
    </tr></thead>
    <tbody${fold === false ? " hidden" : ""}>${fold === false ? "" : tableBody(rows, opts)}</tbody>
  </table></div>`;
}

// "ANZ Everyday · 2026", or "ANZ Everyday · 1 Mar 2026 to 15 Sep 2026". All
// years adds nothing: a title with no period on it already means every year.
// Only All accounts collapses its tables; an account's own page has one table,
// and hiding it would leave the page empty.
const tableFor = account =>
  transactionTable(`${account.bank} ${account.label}` + (rangeLabel() || state.year ? " · " + periodLabel() : ""),
                   viewRows(account.id),
                   {key: account.id, add: true,
                    fold: state.account === "all" ? openTables.has(String(account.id)) : undefined});

function renderTables() {
  const out = document.getElementById("tables");
  // An account with nothing in the period is left out. A range can empty every
  // one of them, a single account included, so say so rather than draw a table
  // with no rows in it.
  const view = accountsInView().filter(a => viewRows(a.id).length);
  out.innerHTML = view.length
    ? view.map(tableFor).join("")
    : '<div class="tablewrap"><div class="empty">No transactions in this period</div></div>';
}

// ---------- holdings ----------
// Term deposits and investments differ only in the label. Both are money no
// statement covers, so the balance can only be typed in. It counts towards net
// worth and never towards income or spending.
const KINDS = {
  "term deposit": {tab: "holdings", title: "Term deposits", one: "a term deposit",
                   name: "Term deposit 12345", place: "Westpac"},
  "investment":   {tab: "investments", title: "Investments", one: "an investment",
                   name: "Sharesies portfolio", place: "Sharesies"},
};

// Deposits never reconcile to the cent, and the reasons are worth spelling
// out rather than leaving as an unexplained gap.
function depositExplainer(held) {
  // Real rows, whatever the what-if switch: a planned deposit is not on deposit.
  const of = name => DATA.real.filter(t => t.category === name);
  const into = of("Term deposit").filter(t => t.amount < 0).reduce((n, t) => n + t.amount, 0);
  const back = of("Term deposit").filter(t => t.amount > 0).reduce((n, t) => n + t.amount, 0);
  // Deposit interest by the banks' own wording, not by category. The Interest
  // category also holds ordinary savings interest, which has nothing to do
  // with this table.
  const DEPOSIT_INTEREST = /TERM DEPOSIT|^CREDIT INTEREST FROM/i;
  const interest = of("Interest").filter(t => DEPOSIT_INTEREST.test(t.description))
                                 .reduce((n, t) => n + t.amount, 0);
  const open = -(into + back);
  const gap = held - open;   // term deposits only: this table is about them
  const line = (label, value, cls) =>
    `<tr><td>${label}</td><td class="r amt num ${cls || ""}">${money(value)}</td></tr>`;

  return `<div class="panel">
    <h3>What the statements say</h3>
    <p>Worked out from the wording each bank uses, below.</p>
    <table class="fixed" style="max-width:420px">
      <colgroup><col><col style="width:9rem"></colgroup>
      <tbody>

  const hint = kind === "term deposit" ? `<div class="charts">${depositExplainer(held)}</div>`
    : `<div class="hint">

  document.getElementById(meta.tab).innerHTML = `

    <div class="tablewrap"><div class="tcap"><span class="grp">${meta.title}</span>
        <span class="meta">${mine.length} entries · total ${money(held)}</span></div><table class="fixed">
      <!-- Name takes the width left over. The other columns are sized to what they
           hold, and Note, nearly always empty, is narrow. -->

        <col style="width:8rem"><col style="width:9rem"></colgroup>
      <thead><tr><th>Name</th><th>Institution</th><th>As at</th><th>Note</th>

      <tbody>${rows || '<tr><td colspan="6" class="empty">Nothing entered yet</td></tr>'}</tbody>
    </table></div>
    <div class="panel">
      <h3 class="form-title">Add ${meta.one}</h3>
      <p>Balance in dollars. It is added to net worth, never to income or spending.</p>
      <form class="holding holding-form">
        <input type="hidden" name="id">
        <div><label class="caption">Name</label><input name="name" required placeholder="${meta.name}"></div>
        <div><label class="caption">Institution</label><input name="institution" placeholder="${meta.place}"></div>
        <div><label class="caption">Balance</label><input name="balance" required inputmode="decimal" placeholder="50000.00"></div>
        <div><label class="caption">As at</label><input name="as_at" type="date"></div>
        <div style="display:flex;gap:6px">
          <button class="btn" type="submit">Save</button>
          <button class="btn ghost reset-form" type="button">Clear</button>
        </div>
      </form>
    </div>
    ${hint}`;

  const root = document.getElementById(meta.tab);
  const form = root.querySelector(".holding-form");
  form.onsubmit = async event => {
    event.preventDefault();
    const data = Object.fromEntries(new FormData(form));
    const balance = cents(data.balance);
    if (balance === null) return alert("Balance must be an amount, like 1234.56 or 1,234.56");
    // Disabled while saving, so a double click cannot add the holding twice.
    // A successful save redraws the form; after a failure it has to work again.
    const button = form.querySelector("[type=submit]");
    button.disabled = true;
    const item = {
      kind,
      id: data.id ? +data.id : undefined,
      name: data.name.trim(),
      institution: data.institution.trim() || null,
      balance,
      as_at: data.as_at || null,
    };
    try {
      DATA.holdings = await request("/api/holdings", {
        method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(item),
      });
      render();
      // render() drew the form afresh and empty. Its first field is the place
      // to be for the next entry.
      root.querySelector("[name=name]").focus();

      alert("Could not save: " + e.message);
      button.disabled = false;
    }
  };
  root.querySelector(".reset-form").onclick = () => {
    form.reset();
    // reset() leaves a hidden field as script last set it, so without this
    // Save would still overwrite the holding that Edit loaded.

    root.querySelector(".form-title").textContent = "Add " + meta.one;
  };
  root.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => {
    const h = mine.find(x => x.id === +b.dataset.edit);
    form.id.value = h.id; form.name.value = h.name;
    form.institution.value = h.institution || "";
    form.balance.value = (h.balance / 100).toFixed(2);
    form.as_at.value = h.as_at || "";
    root.querySelector(".form-title").innerHTML = "Edit " + serifText(h.name);
    form.scrollIntoView({behavior: "smooth", block: "center"});
  });
  root.querySelectorAll("[data-del]").forEach((b, i) => b.onclick = async () => {
    const h = mine.find(x => x.id === +b.dataset.del);
    if (confirm(`Delete "${h.name}"? Net worth drops by ${money(h.balance)}.`)) {
      try {
        DATA.holdings = await request("/api/holdings/" + h.id, {method: "DELETE"});
        render();
        // The row went. Focus the delete button now in its place, or the form
        // when it was the last one.
        const buttons = root.querySelectorAll("[data-del]");
        (buttons[Math.min(i, buttons.length - 1)] || root.querySelector("[name=name]")).focus();
      } catch (e) { alert("Could not delete: " + e.message); }
    }
  });
}

// ---------- spending analysis ----------
// This view cuts across accounts rather than sitting inside one, because the
// question "what do I spend on food" is not per account.
// `hidden` holds the categories ticked OFF, not the ones ticked on. Empty means
// everything is included, which is the default, and a category that appears
// later, because you widened the period or added an account, starts included
// without anyone having to remember to tick it.
// from/to are the period; null at either end means open. preset is the period
// button last chosen, and null once dates are typed. It is remembered rather
// than matched from the dates, because two presets can start on the same day:
// on 30 January, "30 days" and "This year" both start on 1 January.
const analysis = {accounts: null, from: null, to: null, preset: null,
                  category: null, hidden: new Set()};

const catOf = t => t.category || "Uncategorised";

const isoDay = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`
                  + `-${String(d.getDate()).padStart(2, "0")}`;

// Today moved by whole months, either way. setMonth rolls forward when the
// target month is shorter: 31 March minus one month lands back in March, so
// the day is pulled to the last day of the month meant.
function monthsFrom(n) {
  const now = new Date(), then = new Date();
  then.setMonth(then.getMonth() + n);
  if (then.getDate() !== now.getDate()) then.setDate(0);
  return isoDay(then);
}
const monthsAgo = n => monthsFrom(-n);
const daysAhead = n => { const d = new Date(); d.setDate(d.getDate() + n); return isoDay(d); };

// Measured from today, so "6 months" means the last six months even when the
// newest statement is a fortnight old.
const PERIODS = [
  {key: "30d", label: "30 days",   from: () => daysAhead(-29)},
  {key: "3m",  label: "3 months",  from: () => monthsAgo(3)},
  {key: "6m",  label: "6 months",  from: () => monthsAgo(6)},
  {key: "12m", label: "12 months", from: () => monthsAgo(12)},
  {key: "ytd", label: "This year", from: () => `${new Date().getFullYear()}-01-01`},
  {key: "all", label: "All time",  from: () => null},
];
const DEFAULT_PERIOD = "12m";

const applyPeriod = key => {
  analysis.preset = key;
  analysis.from = PERIODS.find(p => p.key === key).from();
  analysis.to = null;
};
// The page opens on the default period. A URL naming another applies its own.
applyPeriod(DEFAULT_PERIOD);

// When the money actually moved, which is the question this page asks. The
// ledger stays on the bank's posting date because that is what orders the
// statement and the running balance. They differ by up to 8 days: posting
// dates fall on no weekend at all, and a purchase late in a month often posts
// in the next one.
const spentOn = t => t.spent_on || t.date;

// Rows of one type inside the chosen accounts and period. Income and spending
// share this, so the two cards always cover exactly the same days.
function windowRows(type) {
  const chosen = analysis.accounts;
  // A period with no To of its own ends today: a plan dated next year is not
  // in "the last 12 months". A To past today brings the plans in on purpose.
  const to = analysis.to || isoDay(new Date());
  return DATA.transactions.filter(t =>
    t.type === type &&
    (!chosen || chosen.has(t.account)) &&
    (!analysis.from || spentOn(t) >= analysis.from) &&
    spentOn(t) <= to);
}

// How many days an average is spread over: the chosen period, cut to the first
// and last bank rows of the chosen accounts. A day inside the statements with
// no spending still counts. A day outside them is unknown, not zero, so a
// calendar year divides by the days loaded so far rather than by 365. The
// category ticks play no part, so the cards and the drill-down share one count.
function periodDays() {
  // Bank rows only, up to the To given or today, as windowRows does: a plan
  // dated later is not a day loaded, so the period ends on the last real row
  // inside the window.
  const end = analysis.to || isoDay(new Date());
  const dates = DATA.real.filter(t => analysis.accounts.has(t.account)).map(spentOn)
    .filter(d => d <= end).sort();
  if (!dates.length) return 1;
  const first = dates[0], last = dates[dates.length - 1];
  const from = analysis.from && analysis.from > first ? analysis.from : first;
  // Inclusive: 1 Jan to 31 Dec is 365 days, not 364.
  return Math.max(1, (new Date(last) - new Date(from)) / 86400000 + 1);
}

function renderAnalysis() {
  if (analysis.accounts === null) analysis.accounts = new Set(DATA.accounts.map(a => a.id));

  // Everything the accounts and period select, before the category ticks. The
  // table lists all of these, so a category you have ticked off is still there
  // to tick back on, and the drill-down still works on it.
  const all = windowRows("expense");
  const listed = tally(all);

  // What the cards and charts are about: the ticked categories only.
  const rows = all.filter(t => !analysis.hidden.has(catOf(t)));
  const spent = rows.reduce((n, t) => n - t.amount, 0);
  const ranked = listed.filter(([name]) => !analysis.hidden.has(name));
  const days = periodDays();

  // What you saved. Net weighs income against every expense in the window, not
  // against the ticked ones, so ticking Rent off cannot make savings look
  // bigger than they were.
  const deposits = windowRows("income");
  const income = deposits.reduce((n, t) => n + t.amount, 0);
  const spentAll = all.reduce((n, t) => n - t.amount, 0);
  const net = income - spentAll;

  const panel = document.getElementById("analysis");
  const body = overviewBody(rows, ranked, spent, days, listed, {income, deposits: deposits.length, net});
  // Rebuilding the controls under the caret sends it back to the first segment,
  // which made a date impossible to correct. While one is being typed in, only
  // the part below them is redrawn, and the chips just have their light moved.
  if (panel.contains(document.activeElement) && document.activeElement.type === "date") {
    panel.querySelector(".analysis-body").innerHTML = body;
    panel.querySelectorAll(".period").forEach(chip =>
      chip.setAttribute("aria-current", String(analysis.preset === chip.dataset.period)));
  } else {
    panel.innerHTML = `
    <div class="title"><h2>Spending analysis</h2>
      <span class="sub">income and spending, transfers between your accounts excluded</span></div>
    ${controlsHtml()}
    <div class="analysis-body">${body}</div>`;
    wireControls(panel);
  }

  drawAnalysisCharts(rows, ranked);
  wireCategoryTicks(panel, listed);

  // The same ticked total and day count as the cards and the Share column.
  renderDrill(all, spent, days);
  restoreFind();       // the drill-down has a table, and it has a search too
}

// Category totals for a set of rows, biggest first.
function tally(rows) {
  const byCategory = {};
  for (const t of rows) {
    const c = (byCategory[catOf(t)] ||= {total: 0, n: 0});
    c.total -= t.amount;
    c.n++;
  }
  return Object.entries(byCategory).sort((a, b) => b[1].total - a[1].total);
}

function wireCategoryTicks(root, listed) {
  root.querySelectorAll("tr[data-cat]").forEach(row => {
    row.onclick = event => {
      // The tick column is for including a category, not for opening it.
      if (event.target.closest(".tick")) return;
      analysis.category = row.dataset.cat;
      render();
    };
    // Rows take keyboard focus, so Enter opens one as a click does. Keys on the
    // tick box inside stay the tick box's own. preventDefault stops the same
    // Enter from pressing the drill-down's close button once focus is there.
    row.onkeydown = event => {
      if (event.key !== "Enter" || event.target !== row) return;
      event.preventDefault();
      row.onclick(event);
    };
  });
  // render() rebuilds the table, so each handler below focuses the new copy of
  // its tick box. Found by value: a category name can hold characters that a
  // selector would need escaped.
  root.querySelectorAll("[data-tick]").forEach(box => box.onchange = () => {
    box.checked ? analysis.hidden.delete(box.dataset.tick)
                : analysis.hidden.add(box.dataset.tick);
    render();
    [...root.querySelectorAll("[data-tick]")].find(b => b.dataset.tick === box.dataset.tick).focus();
  });
  root.querySelectorAll(".all-cats").forEach(box => box.onchange = () => {
    analysis.hidden = box.checked ? new Set() : new Set(listed.map(([name]) => name));
    render();
    root.querySelector(".all-cats").focus();
  });
}

// The account and period pickers appear both on the page and inside the
// drill-down, so they are keyed by class and wired per container. Ids would
// collide between the two copies and only the first would work.
function controlsHtml() {
  return `<div class="controls">
      <div class="toolbar">
        <div class="seg" role="group" aria-label="Period">${PERIODS.map(p => `<button class="period"
          type="button" data-period="${p.key}" aria-current="${analysis.preset === p.key}">${p.label}</button>`).join("")}</div>
        <label class="field">From <input type="date" class="from-date" aria-label="From" value="${analysis.from || ""}"></label>
        <label class="field">To <input type="date" class="to-date" aria-label="To" value="${analysis.to || ""}"></label>
      </div>
      <div class="picker acct-picker"><span class="caption">Accounts</span>
        <label><input type="checkbox" class="all-accts"
          ${analysis.accounts.size === DATA.accounts.length ? "checked" : ""}> All</label>
        ${DATA.accounts.map(a => `
          <label><input type="checkbox" data-acct="${a.id}"
            ${analysis.accounts.has(a.id) ? "checked" : ""}> ${esc(a.label)}</label>`).join("")}
      </div>
    </div>`;
}

// render() rebuilds the controls, so each handler ends by focusing the new copy
// of the control it was on, and a keyboard keeps its place.
function wireControls(root) {
  root.querySelectorAll(".acct-picker [data-acct]").forEach(box => box.onchange = () => {
    box.checked ? analysis.accounts.add(+box.dataset.acct)
                : analysis.accounts.delete(+box.dataset.acct);
    render();
    root.querySelector(`[data-acct="${box.dataset.acct}"]`).focus();
  });
  root.querySelectorAll(".all-accts").forEach(box => box.onchange = () => {
    analysis.accounts = box.checked ? new Set(DATA.accounts.map(a => a.id)) : new Set();
    render();
    root.querySelector(".all-accts").focus();
  });
  // A date input fires `change` as each segment is completed, so typing 2026
  // into the year arrives as 0002, 0020, 0202 and only then 2026. Re-rendering
  // on the early ones rebuilt the field and threw the focus away mid-keystroke,
  // which made the year impossible to type. Only a real day counts: the year
  // segment also takes six digits, so 20260925 typed straight in reads as 260925.
  const settled = value => !value || isDay(value);
  // Typed dates light no preset, except that emptying both boxes is All time.
  const typed = () => { analysis.preset = analysis.from || analysis.to ? null : "all"; render(); };
  root.querySelectorAll(".from-date").forEach(input => input.onchange = () => {
    if (!settled(input.value)) return;
    analysis.from = input.value || null; typed();
  });
  root.querySelectorAll(".to-date").forEach(input => input.onchange = () => {
    if (!settled(input.value)) return;
    analysis.to = input.value || null; typed();
  });
  root.querySelectorAll(".period").forEach(button => button.onclick = () => {
    applyPeriod(button.dataset.period);
    render();
    root.querySelector(`.period[data-period="${button.dataset.period}"]`).focus();
  });
}

// Open, the drill-down is a dialog and the only thing on offer: the layout
// under it is inert, so Tab and a screen reader cannot wander into it. The
// top bar and the chat panel are outside the layout and stay live.
function showDrill(open) {
  document.getElementById("drill").hidden = !open;
  document.body.classList.toggle("locked", open);
  document.querySelector(".layout").inert = open;
}

// The drill-down covers the window. The page stays rendered behind it, so
// closing needs no work and the scroll position is still there.
function renderDrill(rows, spent, days) {
  const panel = document.getElementById("drill");
  const name = analysis.category;
  if (!name) return showDrill(false);
  const catRows = rows.filter(t => catOf(t) === name);
  const share = (100 * catRows.reduce((n, t) => n - t.amount, 0) / (spent || 1)).toFixed(1);

  panel.querySelector(".drill-head").style.cssText = tagStyle(name);
  document.getElementById("drillName").innerHTML =
    `<span class="swatch" style="background:${colourFor(name)};width:12px;height:12px"></span>${serifText(name)}`;
  // A ticked-off category is not in the total, so it has no share of it. The
  // table shows a dash for it too.
  document.getElementById("drillSub").textContent = analysis.hidden.has(name)
    ? "left out of the totals" : `${share}% of spending in this selection`;
  document.getElementById("drillBody").innerHTML =
    controlsHtml() + drillBody(name, catRows, days);

  // Focus and scroll reset only as it opens. A later render, such as a period
  // picked inside it or a row edited, is not a reason to move either.
  const opening = panel.hidden;
  showDrill(true);
  if (opening) panel.scrollTop = 0;
  drawDrillChart(name, catRows);
  wireControls(panel);
  if (opening) document.getElementById("drillClose").focus();
}

function closeDrill() {
  if (analysis.category === null) return;
  const name = analysis.category;
  analysis.category = null;
  render();
  // Focus goes back to the category's row. preventScroll keeps the page where
  // it was, since the drill-down may have been opened by a link or by the agent.
  const row = [...document.querySelectorAll("#analysis tr[data-cat]")].find(r => r.dataset.cat === name);
  if (row) row.focus({preventScroll: true});
}

document.getElementById("drillClose").onclick = closeDrill;
document.addEventListener("keydown", event => {
  // Esc closes one thing at a time, the one on top: a table's search box, then
  // full screen, then the chat, then the phone's menu, then the drill-down
  // overlay. One press never closes two.
  if (event.key !== "Escape") return;
  if (event.target.classList && event.target.classList.contains("find")) {
    const wrap = event.target.closest(".tablewrap");
    closeFind(wrap);
    // The box has gone. Its button is back in its place, so focus goes there.
    return wrap.querySelector(".findbtn").focus();
  }
  const chat = document.getElementById("agent");
  if (chat.classList.contains("full")) return agentFull(false);
  if (chat.classList.contains("open")) {
    agentOpen(false);
    // Focus was in the panel. It goes to the Ask pill.
    if (chat.contains(document.activeElement)) document.getElementById("askBtn").focus();
    return;
  }
  if (document.body.classList.contains("nav-open")) return navOpen(false);
  closeDrill();
});

// ---------- searching a table ----------
// Delegated, so it keeps working after any re-render. The handlers rebuild only
// the tbody and the row-count line; the input itself is never replaced, so what
// you have typed and where the caret sits both survive.
// The search that is currently open, so it can go in the URL and survive a
// re-render when you switch year.
const find = {table: null, query: ""};

function findIn(wrap) {
  const entry = tables.get(wrap.dataset.table);
  if (!entry) return;
  const query = wrap.querySelector(".find").value;
  find.table = wrap.dataset.table;
  find.query = query;
  writeUrl();
  const shown = searchRows(entry.rows, query);
  wrap.querySelector("tbody").innerHTML = tableBody(shown, entry.opts);
  wrap.querySelector(".meta").innerHTML = query.trim()
    ? `${tableMeta(shown)} <span class="ink-faint">of ${entry.rows.length.toLocaleString()}</span>`
    : tableMeta(entry.rows);
}

function closeFind(wrap) {
  if (!wrap) return;
  const box = wrap.querySelector(".find");
  box.value = "";
  box.hidden = true;
  wrap.querySelector(".findbtn").hidden = false;
  findIn(wrap);
  find.table = null;
  find.query = "";
  writeUrl();
}

// Re-open the search after a re-render, so switching year does not throw away
// what you were looking for. A search that names no table, as the agent's does,
// goes to the first table showing. A search whose table has gone is dropped.
function restoreFind() {
  if (!find.query) return;
  // The ledger and the drill-down keep their last tables while hidden.
  const showing = [...document.querySelectorAll(".tablewrap[data-table]")]
    .filter(w => !w.closest("[hidden]"));
  const wrap = find.table ? showing.find(w => w.dataset.table === find.table)
    : showing.find(w => searchRows(tables.get(w.dataset.table)?.rows || [], find.query).length) || showing[0];
  if (!wrap) {
    find.table = null;
    find.query = "";
    return writeUrl();
  }
  const box = wrap.querySelector(".find");
  box.value = find.query;
  box.hidden = false;
  wrap.querySelector(".findbtn").hidden = true;
  findIn(wrap);
  // Opened after the search: the search has just built the rows, so setOpen
  // has nothing to build for a table drawn collapsed.
  unfold(wrap);
}

document.addEventListener("click", event => {
  const button = event.target.closest && event.target.closest(".findbtn");
  if (!button) return;
  const wrap = button.closest(".tablewrap");
  unfold(wrap);
  const box = wrap.querySelector(".find");
  box.hidden = false;
  button.hidden = true;
  box.focus();
});

document.addEventListener("click", event => {
  const button = event.target.closest && event.target.closest(".fold");
  if (button) setOpen(button.closest(".tablewrap"), button.getAttribute("aria-expanded") !== "true");
});

document.addEventListener("input", event => {
  if (event.target.classList && event.target.classList.contains("find")) {
    findIn(event.target.closest(".tablewrap"));
  }
});

// A search box emptied by its own clear button, or by Enter on nothing, gets
// out of the way again. Its button takes the focus, as after Esc.
document.addEventListener("search", event => {
  const box = event.target;
  if (box.classList && box.classList.contains("find") && !box.value) {
    const wrap = box.closest(".tablewrap");
    closeFind(wrap);
    wrap.querySelector(".findbtn").focus();
  }
});

// ---------- editing a row ----------
// Double-click a cell to change it, or focus the row and press Enter. One
// listener each for every table, so they keep working after any re-render. The
// row's id is on the <tr>; the field is the data-edit attribute on the cell,
// or on the type tag, which shares its cell with the category.
const TYPES = ["automatic", "income", "expense", "transfer"];
const REPEATS = ["once", "weekly", "fortnightly", "monthly", "quarterly", "yearly"];
const AMOUNT_HINT = "Amount must be a number, like -12.34 or 1,234.56";
// The editable cells, left to right across a row. Tab moves along them.
const FIELDS = ["date", "description", "type", "category", "amount"];
const options = (list, current) =>
  list.map(v => `<option${v === current ? " selected" : ""}>${v}</option>`).join("");

document.addEventListener("dblclick", event => {
  const target = event.target.closest && event.target.closest("[data-edit]");
  // The what-if tag cannot be changed, and a control is not a cell to edit.
  if (!target || event.target.closest(".tag.whatif, button, input, select")) return;
  const row = target.closest("tr[data-id]");
  const t = row && DATA.all.find(x => x.id === +row.dataset.id);
  if (t) edit(target, t);
});

// Enter on the row itself opens its description, the cell every row can edit.
document.addEventListener("keydown", event => {
  const row = event.target.closest && event.target.closest("tr[data-id]");
  if (!row || event.target !== row || event.key !== "Enter") return;
  const t = DATA.all.find(x => x.id === +row.dataset.id);
  if (t) { event.preventDefault(); edit(row.querySelector('[data-edit="description"]'), t); }
});

function edit(target, t) {
  const field = target.dataset.edit;
  const td = target.closest("td");
  const table = td.closest(".tablewrap").dataset.table;
  const saved = td.innerHTML;
  const before = {description: t.description, category: t.category || "", type: t.type,
                  date: t.date, amount: t.amount}[field];
  const editor = document.createElement(field === "type" ? "select" : "input");
  editor.className = "editor";
  if (field === "type") editor.innerHTML = options(TYPES, t.type);
  else {
    editor.type = field === "date" ? "date" : "text";
    editor.value = field === "amount" ? (t.amount / 100).toFixed(2) : before;
    if (field === "category") editor.setAttribute("list", "categories");
    if (field === "amount") editor.inputMode = "decimal";
  }
  // The date is the one field the server changes on this row alone.
  if (t.series && field !== "date") editor.title = `applies to all ${t.series} rows of this series`;
  // The type and category editors replace their own tag, so the other tag
  // stays in view. The rest fill the cell.
  if (field === "type") target.replaceWith(editor);
  else if (field === "category") {
    const tag = td.querySelector(".tag.cat");
    tag ? tag.replaceWith(editor) : td.append(" ", editor);
  } else td.replaceChildren(editor);
  editor.focus();
  if (editor.select) editor.select();
  // The list opens on the double-click itself. Not every browser has this.
  if (field === "type") try { editor.showPicker(); } catch {}

  // Where the focus goes once the editor is gone. A blur leaves it where the
  // click put it. A key goes back to the row, found afresh by id since a save
  // redraws every table, or for Tab on to the next editable cell along it.
  const settle = step => {
    if (step === undefined) return;
    const row = document.querySelector(`.tablewrap[data-table="${table}"] tr[data-id="${t.id}"]`);
    if (!row) return;
    const cells = FIELDS.map(f => row.querySelector(`[data-edit="${f}"]`)).filter(Boolean);
    const next = step && cells[cells.findIndex(c => c.dataset.edit === field) + step];
    if (next) edit(next, DATA.all.find(x => x.id === t.id));
    else row.focus({preventScroll: true});
  };

  // Enter, blur and the type list's change can all fire for one edit, and the
  // restore below removes the editor, which blurs it too. The first one wins.
  let done = false;
  const finish = async (keep, step) => {
    if (done) return;
    done = true;
    // Chrome blurs an editor a re-render removes, Firefox does not. Neither
    // saves: pressing Back is not pressing Enter.
    if (!editor.isConnected) keep = false;
    let value;
    if (keep) {
      value = field === "amount" ? cents(editor.value) : editor.value.trim();
      if (field === "amount" && value === null) {
        alert(AMOUNT_HINT);
        keep = false;
      }
      // A date the browser could not complete arrives as "": nothing to save.
      if (field === "date" && !value) keep = false;
    }
    if (!keep || value === before) { td.innerHTML = saved; return settle(step); }
    td.setAttribute("aria-busy", "true");
    editor.disabled = true;
    try {
      await request("/api/txn/" + t.id, {method: "POST", headers: {"Content-Type": "application/json"},
                                         body: JSON.stringify({[field]: value})});
    } catch (e) {
      alert("Could not save: " + e.message);
      td.innerHTML = saved;
      td.removeAttribute("aria-busy");
      return settle(step);
    }
    await reload();
    settle(step);
  };
  editor.addEventListener("keydown", event => {
    // Stopped here: Escape would otherwise close the drill-down under the
    // editor, and the page's own Escape and Enter handling has no part in this.
    if (event.key === "Enter" && !event.isComposing) { event.preventDefault(); event.stopPropagation(); finish(true, 0); }
    if (event.key === "Escape") { event.stopPropagation(); finish(false, 0); }
    // Tab saves as Enter does, then opens the next cell's editor.
    if (event.key === "Tab") { event.preventDefault(); event.stopPropagation(); finish(true, event.shiftKey ? -1 : 1); }
  });
  editor.addEventListener("blur", () => finish(true));
  // Picking from the list is the whole edit; no Enter needed after it.
  if (field === "type") editor.addEventListener("change", () => finish(true, 0));
}

// ---------- adding a row ----------
// "+ Add" in a table's caption opens the form row under it: one cell across
// the table holding the inputs, in the sticky head, so it is in view wherever
// the page is scrolled. Enter anywhere in it saves; Escape closes it. A table
// of one account puts the row in that account; one spanning accounts, like
// the cashflow's, asks which.
document.addEventListener("click", event => {
  const button = event.target.closest && event.target.closest(".addbtn");
  if (!button) return;
  // A collapsed table opens first, or the new row would land out of sight.
  const wrap = button.closest(".tablewrap");
  unfold(wrap);
  openAdd(wrap.querySelector("tr.add"));
});

function openAdd(row) {
  const key = row.closest(".tablewrap").dataset.table;
  const accounts = /^\d+$/.test(key) ? "" : `<select name="account" aria-label="Account">${
    DATA.accounts.map(a => `<option value="${a.id}">${esc(a.bank)} ${esc(a.label)}</option>`).join("")}</select>`;
  row.hidden = false;
  row.innerHTML = `<td colspan="5"><div class="addform">${accounts}
    <input type="date" name="date" value="${isoDay(new Date())}" aria-label="Date">
    <input name="description" maxlength="200" placeholder="Description" aria-label="Description">
    <select name="type" aria-label="Type">${options(TYPES, "automatic")}</select>
    <input name="category" list="categories" placeholder="Category" aria-label="Category">
    <input name="amount" inputmode="decimal" placeholder="-12.34" aria-label="Amount in dollars">
    <label><input type="checkbox" name="whatif" checked> what-if</label>
    <select name="repeat" aria-label="Repeat">${options(REPEATS, "once")}</select>
    <input type="date" name="until" aria-label="Until" hidden></div></td>`;
  row.querySelector("[name=repeat]").onchange = event =>
    row.querySelector("[name=until]").hidden = event.target.value === "once";
  row.onkeydown = event => {
    // Stopped here, so Escape does not go on to close anything else.
    if (event.key === "Enter" && !event.isComposing) { event.preventDefault(); event.stopPropagation(); submitAdd(row); }
    if (event.key === "Escape") { event.stopPropagation(); closeAdd(row); }
  };
  // No scroll: the row is in view already, under the button just pressed. A
  // phone would otherwise jump to put the box mid-screen.
  row.querySelector("[name=description]").focus({preventScroll: true});
}

// Escape puts the focus back on "+ Add". Collapsing the table does not: the
// chevron has it, and keeps it.
function closeAdd(row, refocus = true) {
  row.innerHTML = "";
  row.hidden = true;
  row.onkeydown = null;
  if (refocus) row.closest(".tablewrap").querySelector(".addbtn").focus();
}

async function submitAdd(row) {
  if (row.getAttribute("aria-busy") === "true") return;      // a second Enter while the first saves
  const value = name => row.querySelector(`[name=${name}]`).value.trim();
  const amount = cents(value("amount"));
  if (amount === null) return alert(AMOUNT_HINT);
  const repeat = value("repeat");
  const key = row.closest(".tablewrap").dataset.table;
  const body = {
    account: +(row.querySelector("[name=account]")?.value ?? key),
    date: value("date"), description: value("description"), amount, type: value("type"),
    category: value("category") || null, whatif: row.querySelector("[name=whatif]").checked,
    repeat, until: repeat === "once" ? null : value("until") || null,
  };
  row.setAttribute("aria-busy", "true");
  try {
    await request("/api/txn", {method: "POST", headers: {"Content-Type": "application/json"},
                               body: JSON.stringify(body)});
  } catch (e) {
    // The inputs stay, so a refused row can be corrected rather than retyped.
    alert("Could not add: " + e.message);
    row.removeAttribute("aria-busy");
    return;
  }
  await reload();
  // reload() rebuilt the table. Focus its "+ Add" again, where the row began.
  document.querySelector(`.tablewrap[data-table="${key}"] .addbtn`)?.focus({preventScroll: true});
}

// ---------- deleting a row ----------
// Only rows entered by hand have the ×. A series goes as a whole, after a
// word; a single row goes at once, since putting it back is one line.
document.addEventListener("click", async event => {
  const button = event.target.closest && event.target.closest(".del");
  if (!button) return;
  const row = button.closest("tr");
  const series = +row.dataset.series;
  if (series && !confirm(`Delete all ${series} rows of this series?`)) return;
  button.disabled = true;
  const table = row.closest(".tablewrap").dataset.table;
  try {
    await request("/api/txn/" + row.dataset.id, {method: "DELETE"});
  } catch (e) {
    alert("Could not delete: " + e.message);
    button.disabled = false;
    return;
  }
  await reload();
  // The × went with its row. The table's "+ Add" is the nearest thing left
  // to focus; the drill-down has none.
  document.querySelector(`.tablewrap[data-table="${table}"] .addbtn`)?.focus({preventScroll: true});
});

function overviewBody(rows, ranked, spent, days, listed, {income, deposits, net}) {
  // Bars are drawn against the largest category in the whole list, not the
  // largest included one, so they stay put as you tick things on and off.
  const widest = listed.length ? listed[0][1].total : 0;
  const table = listed.map(([name, c]) => {
    const on = !analysis.hidden.has(name);
    return `<tr class="pick${on ? "" : " off"}" data-cat="${esc(name)}" tabindex="0">
      <td class="tick"><input type="checkbox" data-tick="${esc(name)}" ${on ? "checked" : ""}
        aria-label="Include ${esc(name)}"></td>
      <td><span class="swatch" style="background:${colourFor(name)}"></span>
          ${esc(name)}</td>
      <td><span class="bar"><i style="width:${(100 * c.total / (widest || 1)).toFixed(1)}%;background:${colourFor(name)}"></i></span></td>
      <td class="r num">${on ? (100 * c.total / (spent || 1)).toFixed(1) + "%" : "—"}</td>
      <td class="r num">${c.n}</td>
      <td class="r amt num out">${money(c.total)}</td>
    </tr>`;
  }).join("");
  const allOn = analysis.hidden.size === 0;

  // The share of income kept, said plainly in either direction. Percentages of
  // nothing mean nothing, so a period with no income says so instead.
  // Net is income minus all spending, so the spending behind it is income - net.
  let netNote = income === 0 ? "no income in this period"
    : net >= 0 ? `${Math.round(100 * net / income)}% of income saved`
    // A tiny income makes "x% more than came in" absurd: a few cents of interest
    // against a month's spending reads as a six-figure percentage. What income
    // covered stays readable at any size.
    : `income covered ${Math.round(100 * income / (income - net))}% of spending`;
  // Total spent has dropped the unticked categories but Net has not. Say so,
  // or the two cards look like they disagree.
  if (analysis.hidden.size) netNote += " · counts all spending";

  return `
    <div class="cards">
